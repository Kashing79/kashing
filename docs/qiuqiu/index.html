<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>球球</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="球球">
<meta name="theme-color" content="#8fca78">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --grass: #8fca78; --ink: #1f3a2a; --card: #ffffffd9; }
  html.dusk { --grass: #86b96e; --ink: #2c3a22; --card: #fff6e6d9; }
  html.night { --grass: #2f5a45; --ink: #eaf5ee; --card: #0d1f18b3; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    background: var(--grass); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Noto Sans TC", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 整个屏幕都是草地 */
  #world { position: absolute; inset: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; bottom: 0; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; }
  #bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); max-width: 220px; padding: 6px 10px;
    font: 600 14px/1.35 inherit; font-family: inherit; color: #2a1f2d; background: #fffdf7;
    border: 2px solid #2a1f2d; border-radius: 9px; white-space: pre-wrap; text-align: center;
    opacity: 0; transition: opacity .25s;
  }
  .bubble.on { opacity: 1; }
  #top {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    display: flex; flex-direction: column; gap: 9px; transition: opacity .6s;
  }
  #top.quiet { opacity: 0; }
  /* 标题也垫一块底：新草地颜色深，字直接压在草上看不清 */
  #top h1 { margin: 0; align-self: flex-start; padding: 4px 13px; font-size: 20px; line-height: 1.3; background: var(--card); border-radius: 999px; }
  #tips { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 7px; }
  #tips li { padding: 6px 11px; font-size: 13px; line-height: 1.25; background: var(--card); border-radius: 999px; }
  #install { align-self: flex-start; max-width: 30em; padding: 10px 12px; font-size: 13px; line-height: 1.5; background: var(--card); border-radius: 12px; }
  #install b { font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="world">
  <div id="top">
    <h1 id="t-title"></h1>
    <ul id="tips"><li id="t-1"></li><li id="t-2"></li><li id="t-3"></li><li id="t-4"></li></ul>
    <div id="install" hidden></div>
  </div>
  <canvas id="stage"></canvas>
  <div id="bubbles"></div>
</div>
<script>
// —— 手机版外壳：文字（繁体 / 简体）、白天黑夜的天空、"加到主画面"提示、离线缓存 ——
(function () {
  var hant = /^zh\b.*(tw|hk|mo|hant)/i.test(navigator.language || '') || /hant|tw|hk/i.test((navigator.languages || []).join(','));
  var zh = /^zh/i.test(navigator.language || 'zh');
  var T = hant ? {
    title: '球球', a: '點草地：把球丟到那裡', b: '拖住小球甩出去', c: '點小狗摸摸牠', d: '也可以把牠們拎起來',
    install: '想像 App 一樣打開：點 Safari 下方的<b>分享</b>按鈕，選<b>「加入主畫面」</b>。加好以後沒有網路也能玩。',
  } : zh ? {
    title: '球球', a: '点草地：把球丢到那里', b: '拖住小球甩出去', c: '点小狗摸摸它', d: '也可以把它们拎起来',
    install: '想像 App 一样打开：点 Safari 下方的<b>分享</b>按钮，选<b>"添加到主屏幕"</b>。加好以后没有网络也能玩。',
  } : {
    title: 'QiuQiu', a: 'Tap the lawn to throw there', b: 'Drag the ball and fling it', c: 'Tap a dog to pet it', d: 'Or pick them up',
    install: 'To open it like an app: tap <b>Share</b> in Safari, then <b>Add to Home Screen</b>. It works offline after that.',
  };
  document.documentElement.lang = hant ? 'zh-Hant' : (zh ? 'zh-Hans' : 'en');
  document.getElementById('t-title').textContent = T.title;
  document.getElementById('t-1').textContent = T.a;
  document.getElementById('t-2').textContent = T.b;
  document.getElementById('t-3').textContent = T.c;
  document.getElementById('t-4').textContent = T.d;

  function sky() {
    var h = new Date().getHours(), c = document.documentElement.classList;
    c.remove('dusk', 'night');
    if (h >= 19 || h < 5) c.add('night'); else if (h >= 17 || h < 7) c.add('dusk');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--grass').trim());
  }
  sky(); setInterval(sky, 5 * 60 * 1000);

  var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !standalone) { var box = document.getElementById('install'); box.innerHTML = T.install; box.hidden = false; }

  // 玩起来以后，上面的字淡掉，不挡画面
  var top = document.getElementById('top'), touched = 0;
  window.addEventListener('pointerdown', function () { touched++; if (touched >= 2) top.classList.add('quiet'); });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
<script>// ============================================================
//  球球 · 可以自己改的设定
//  改完之后重新运行一次  bash install.sh  就会生效。
//  看不懂也没关系：把这个文件交给 Claude Code，说"帮我改成……"就行。
// ============================================================
var PET_CONFIG = {

  // —— 穿西装的小人 ——（颜色用 #RRGGBB）
  person: {
    hair:  '#2b2530',   // 头发
    skin:  '#f3c9a5',   // 肤色
    suit:  '#3a4c7a',   // 西装
    shirt: '#f6f4ef',   // 衬衫
    tie:   '#d0353f',   // 领带
    shoes: '#2a2024',   // 皮鞋
  },

  // —— 小腊肠的毛色 ——  'red' 红棕 | 'blacktan' 黑棕 | 'cream' 奶油
  dachshund: 'red',

  // —— 小人偶尔会说的话（可以留空）——
  // 每行一句，小人会隔一阵子转过来挥挥手，随机说其中一句。
  // 例：messages: ['休息一下吧', '记得喝水', '我在呢'],
  messages: [],

  // 每隔多少分钟说一句（最短, 最长）
  messageMinutes: [25, 60],

  // —— 小人自动丢球 ——  每隔多少秒玩一轮（最短, 最长）
  autoPlaySeconds: [35, 90],

  // —— 夜里睡觉 ——  [几点开始, 几点结束]，这段时间它们会回岛里睡觉，不自动丢球。
  // 点一下灵动岛它们还是会出来陪玩。不想要就写 null。
  nightSleep: [0, 7],

  // —— 灵动岛上显示两地的时间（可以留空）——
  // 例：clock: [{ label: '台北', tz: 'Asia/Taipei' }, { label: '他那边', tz: 'America/Los_Angeles' }],
  clock: null,

  // —— 灵动岛上显示"还有几天见面"（可以留空）——  例：reunion: '2027-02-14',
  reunion: null,

  // —— 小人在小剧场里说的话（可以留空；空着他就不说话，用表情代替）——
  // 每一项是一句或者几句（几句就随便挑一句）。例：lines: { morning: ['早安'], night: ['晚安，好梦'], welcome: ['你回来啦'] },
  // 写 lines: true 的话，他会说戏里自带的那几句（繁体 / 简体 / 英文，跟着系统语言）。
  lines: {},

  // —— 特别的日子（可以留空）——  on 写 'MM-DD'（每年）或 'YYYY-MM-DD'（那一天）；kind: 'birthday' | 'anniversary' | 'gift' | 'note'
  // 例：dates: [{ on: '05-20', kind: 'anniversary', line: '纪念日快乐' }],
  dates: [],

  // —— 它们有多闹 ——  0.5 安静一点 … 1 默认 … 1.5 热闹一点
  liveliness: 1,
  // 这几个钟点里只演安静的小戏（比如上班时间）。例：quietHours: [[9, 12], [14, 18]],
  quietHours: [],
  // 鼠标停在它们旁边时，它们会凑过来、跟着鼠标玩。不想要就写 false
  cursorPlay: true,
  // 有几段小剧场头几天先不演，第 1–4 天陆续出现（每天有点新东西）。写 false = 第一天就全部都有
  discovery: true,
  // 睡过的地方第二天开小花这一类"留在草地上的小印子"。不想要就写 false
  lawnMemories: true,

  // —— 小剧场里用到的几样（都可以不写；不写就用戏里自己的默认值）——
  // teaTime: '15:30',                 // 他的下午茶（不写就跟着下面 care.biscuitTime）
  // secretTimes: ['13:14', '17:20'],  // 这几分钟他会偷偷送一颗小爱心；[] = 不要
  // hisClock: 1,                      // 上面 clock 里哪一个是他那边的时间（从 0 数）；-1 = 不要
  // hisMorning: '07:30', hisNight: '23:30',   // 他那边几点起床、几点睡（要先写 hisClock）
  // sunsetHour: 17,                   // 几点一起看夕阳（不写 = 草地变成傍晚颜色的时候）
  // weekend: [6, 0],                  // 哪几天算周末（0 = 星期天），周末会去野餐；[] = 不要
  // hemisphere: 'north',              // 南半球写 'south'（季节反过来）

  // —— 喂饭和拉粑粑（小人自己会照顾两只狗）——
  care: {
    feeding: true,               // 小人到点自己喂饭（菜单里的开关会盖过这里）
    potty: true,                 // 狗狗会拉粑粑，小人会收拾（同上）
    water: true,                 // 吃完饭喝水，玩累了也喝
    meals: ['08:00', '18:30'],   // 几点开饭（本地时间，最多三顿；可以改成她家狗狗真的吃饭的时间）
    biscuitTime: '15:30',        // 每天一块饼干；不要就写 null
    lucky: true,                 // 很少很少会出现一次"狗屎运"
    lines: null,                 // null 小人不说话；true 说自带的几句；也可以自己写 { meal: '开饭啦', thanks: '谢谢你' }
    goldSide: 'auto',            // 金毛习惯在哪一边上厕所：'left' | 'right' | 'auto'
  },
};

// 手机版：整个屏幕是草地，可以到处跑；屏幕窄，所以像素画得小一点
window.PET_CONFIG.roam = true;
window.PET_CONFIG.grass = true;
window.PET_CONFIG.autoScale = function (vw) { return vw < 600 ? 2 : 3; };
</script>
<script>// 旧版的手画像素图：每个字符是一个像素，'.' 是透明。
// 所有角色都画成"面向右"，要面向左时由画的那一方左右镜像。
// 第三版里小人、小道具有了新的画法（person.js / fx.js）；那两个文件不在时，引擎就用这里的图。
// 这个文件不碰网页的任何东西（没有 canvas），在 Mac 外壳的 JavaScriptCore 里也能直接跑。
(function (G) {
  'use strict';

  // ---------- 小工具 ----------
  function blank(w) { return '.'.repeat(w); }

  // 把 patch 盖到 rows 上。patch.px 是 [x, y, ch] 列表；ch 为 '_' 表示擦成透明。
  function put(rows, px) {
    var g = rows.map(function (r) { return r.split(''); });
    px.forEach(function (p) {
      var x = p[0], y = p[1], ch = p[2];
      if (y < 0 || y >= g.length || x < 0 || x >= g[y].length) return;
      g[y][x] = ch === '_' ? '.' : ch;
    });
    return g.map(function (r) { return r.join(''); });
  }
  // 一段横线像素
  function run(x0, x1, y, ch) {
    var out = [];
    for (var x = x0; x <= x1; x++) out.push([x, y, ch]);
    return out;
  }
  function cat() {
    var out = [];
    for (var i = 0; i < arguments.length; i++) out = out.concat(arguments[i]);
    return out;
  }
  // 替换某几行
  function rowsAt(rows, y0, repl) {
    var g = rows.slice();
    repl.forEach(function (r, i) { g[y0 + i] = r; });
    return g;
  }
  // 整体上移 n 行（腾空）
  function up(rows, n) {
    var w = rows[0].length, g = rows.slice(n);
    for (var i = 0; i < n; i++) g.push(blank(w));
    return g;
  }
  // 顶部补空行到 h 行
  function padTop(rows, h) {
    var w = rows[0].length, g = rows.slice();
    while (g.length < h) g.unshift(blank(w));
    return g;
  }
  // 上半身下沉 1 像素（呼吸 / 迈步）：顶部加一行，删掉 removeRow 这一行
  function sink(rows, removeRow) {
    var w = rows[0].length, g = rows.slice();
    g.splice(removeRow, 1);
    g.unshift(blank(w));
    return g;
  }

  // ============================================================
  //  小球（6x6）
  // ============================================================
  var BALL = [
    ['.yYyw.',
     'yYYwyy',
     'yYwyyy',
     'ywyyyv',
     'wyyyvv',
     '.yvvv.'],
    ['.wYyy.',
     'yywYyy',
     'yYywyy',
     'yyyywv',
     'yyyvvw',
     '.yvvv.'],
    ['.yYyy.',
     'wYYyyy',
     'ywwyyy',
     'yyywwv',
     'yyyvvw',
     '.yvvv.'],
    ['.yYyy.',
     'yYYyyw',
     'yYyyww',
     'yywwyv',
     'wwyyvv',
     '.yvvv.'],
  ];

  // ============================================================
  //  穿西装的小人（20x26）
  // ============================================================
  var P_FRONT = [
    '......hhhhhhhh......',
    '.....hhhhhhhhhh.....',
    '....hhhhhhhhhhhh....',
    '....hhhhhhhhhhhh....',
    '....hhhhhssshhhh....',
    '....hhsssssssshh....',
    '....hssssssssssh....',
    '....sssessssesss....',
    '....sssessssesss....',
    '....sdssssssssds....',
    '.....ssssmmssss.....',
    '......ssssssss......',
    '........wwww........',
    '.....jjjwttwjjj.....',
    '....jjjjJttJjjjj....',
    '....jjjjJttJjjjj....',
    '....jjjjjJJjjjjj....',
    '....jjjjjjjjjjjj....',
    '....sjjjjjjjjjjs....',
    '.....jjjjjjjjjj.....',
    '.....pppppppppp.....',
    '.....pppp..pppp.....',
    '.....pppp..pppp.....',
    '.....pppp..pppp.....',
    '.....pppp..pppp.....',
    '....bbbbb..bbbbb....',
  ];
  var P_FRONT_BLINK = rowsAt(P_FRONT, 7, [
    '....ssssssssssss....',
    '....sseesssseess....',
  ]);
  // 正面挥手：先擦掉右边那条手臂，再画举起来的手
  var P_FRONT_NOARM = put(P_FRONT, cat(
    [[15, 14, '_'], [15, 15, '_'], [15, 16, '_'], [15, 17, '_'], [15, 18, '_']]
  ));
  var P_WAVE_A = put(P_FRONT_NOARM, [
    [15, 14, 'j'], [15, 13, 'j'], [16, 13, 'j'], [16, 12, 'j'], [17, 12, 'j'],
    [17, 11, 'j'], [17, 10, 'j'], [17, 9, 's'], [18, 9, 's'], [17, 8, 's'], [18, 8, 's'],
  ]);
  var P_WAVE_B = put(P_FRONT_NOARM, [
    [15, 14, 'j'], [15, 13, 'j'], [16, 13, 'j'], [16, 12, 'j'], [17, 12, 'j'],
    [18, 11, 'j'], [18, 10, 'j'], [19, 9, 's'], [18, 9, 's'], [19, 8, 's'], [18, 8, 's'],
  ]);

  // 侧面（面向右的 3/4 视角），不含近侧手臂
  var P_SIDE = [
    '......hhhhhhhh......',
    '.....hhhhhhhhhh.....',
    '....hhhhhhhhhhhh....',
    '....hhhhhhhhhhhh....',
    '....hhhhhhhsssshh...',
    '....hhhhsssssssss...',
    '....hhhssssssssss...',
    '....hhhsssessssess..',
    '....hhhsssessssess..',
    '....hhsssssssssdss..',
    '.....hsssssssmmss...',
    '......sssssssss.....',
    '.........wwww.......',
    '.....jjjjjwttwj.....',
    '.....jjjjjJttJj.....',
    '.....jjjjjJttJj.....',
    '.....jjjjjjJJjj.....',
    '.....jjjjjjjjjj.....',
    '.....jjjjjjjjjj.....',
    '.....jjjjjjjjjj.....',
    '......pppppppp......',
    '......ppp..ppp......',
    '......ppp..ppp......',
    '......ppp..ppp......',
    '......ppp..ppp......',
    '......bbbb.bbbb.....',
  ];
  var P_SIDE_BLINK_PX = [[10, 7, 's'], [15, 7, 's'], [9, 8, 'e'], [14, 8, 'e']];
  var LEGS_STRIDE = [
    '......pppppppp......',
    '.....pppp..pppp.....',
    '.....ppp....ppp.....',
    '....ppp......ppp....',
    '....ppp......ppp....',
    '....bbbb.....bbbb...',
  ];
  var LEGS_PASS = [
    '......pppppppp......',
    '.......pppppp.......',
    '.......ppppp........',
    '.......ppppp........',
    '.......ppppp........',
    '.......bbbbbb.......',
  ];
  // 近侧手臂（袖子用 J，手用 s）。肩膀在 (7,14) 附近。
  var ARM = {
    down:   cat(run(6, 7, 14, 'J'), run(6, 7, 15, 'J'), run(6, 7, 16, 'J'), run(6, 7, 17, 'J'), run(6, 7, 18, 's')),
    fwd:    cat(run(6, 7, 14, 'J'), run(7, 8, 15, 'J'), run(8, 9, 16, 'J'), run(9, 10, 17, 'J'), run(10, 11, 18, 's')),
    back:   cat(run(6, 7, 14, 'J'), run(5, 6, 15, 'J'), run(4, 5, 16, 'J'), run(3, 4, 17, 'J'), run(2, 3, 18, 's')),
    hold:   cat(run(6, 7, 14, 'J'), run(6, 7, 15, 'J'), run(7, 8, 16, 'J'), run(8, 11, 17, 'J'), run(12, 13, 17, 's'), run(12, 13, 16, 's')),
    windup: cat(run(6, 7, 14, 'J'), run(4, 6, 13, 'J'), run(2, 4, 12, 'J'), run(1, 2, 11, 'J'), run(0, 1, 10, 's'), run(0, 1, 9, 's')),
    release: cat(run(7, 8, 14, 'J'), run(8, 10, 13, 'J'), run(10, 12, 12, 'J'), run(13, 15, 12, 'J'), run(16, 17, 12, 's'), run(16, 17, 11, 's')),
    follow: cat(run(7, 8, 14, 'J'), run(8, 9, 15, 'J'), run(9, 10, 16, 'J'), run(10, 11, 17, 'J'), run(12, 13, 18, 's')),
    pat:    cat(run(7, 8, 14, 'J'), run(8, 9, 15, 'J'), run(9, 10, 16, 'J'), run(10, 11, 17, 'J'), run(11, 12, 18, 'J'), run(13, 14, 19, 's'), run(14, 15, 20, 's')),
  };
  function pSide(arm, legs, lower) {
    var r = P_SIDE;
    if (legs) r = rowsAt(r, 20, legs);
    r = put(r, ARM[arm]);
    if (lower) r = sink(r, 21);
    return r;
  }

  // ---- 更多动作 ----
  var B20 = blank(20);
  // 蹲下（摸小腊肠、揉肚子）
  function pCrouch(v) {
    var r = [B20, B20, B20, B20, B20, B20, B20].concat(P_SIDE.slice(0, 17));
    r.push('....pppppppppp......');
    r.push('.....bbbb.bbbb......');
    var arm = v === 2
      ? cat(run(7, 8, 21, 'J'), run(9, 10, 21, 'J'), run(11, 12, 22, 'J'), run(13, 14, 22, 'J'), run(15, 16, 22, 's'))
      : cat(run(7, 8, 21, 'J'), run(9, 10, 22, 'J'), run(11, 12, 23, 'J'), run(13, 14, 23, 'J'), run(15, 16, 24, 's'));
    return put(r, arm);
  }
  // 坐在草地上
  function pSit() {
    var r = [B20, B20, B20, B20, B20, B20].concat(P_SIDE.slice(0, 18));

  // ============================================================

  function bone(p) {

    p.outline(); p.soften();
  }

  // 蝴蝶：a.wing = 0 翅膀举着 / 1 平展 / 2 往下压 / 3 停着（侧面，翅膀合起来）；a.m = 翅膀的颜色

    var m = M[a.m], w = a.wing, s, hp = p.hp, NO = { ol: false, lock: true };
    p.box(-4.5, -3.5, 5, 2.5);
    if (w === 3) {             // 停着：侧面，翅膀竖着合在一起，头朝左
      p.ell(hp + 1.0, 0.1, 1.0, 0.9, m, { tone: 2 });                                       // 后翅
      p.poly([hp - 0.75, 0.75, hp - 0.25, -3.25, hp + 1.25, -2.75, hp + 2.0, -0.75, hp + 0.75, 0.75], m, { tone: 3 });    // 前翅

      p.rim(m, -1, -1, 4);

      p.dot(hp + 0.75, -2.5, M.white, 4, { over: m, lock: true });
      p.dot(hp + 1.0, -0.25, M.white, 4, { over: m, lock: true });

  // 灰尘：a = 第几帧（0 刚冒出来的一团 → 1 鼓起来 → 2 散开 → 3 只剩几点）。贴着地面（y = 0 是地）

      [[-1.9, -1.2, 1.2], [1.8, -1.1, 1.1], [0, -1.9, 1.5], [-0.6, -1.0, 1.0]],
      [[-3.0, -1.7, 0.9], [-1.9, -1.9, 1.0], [1.9, -2.0, 0.9], [3.0, -1.5, 0.7], [-0.1, -3.5, 0.55]],

  }

  }

  // 萤火虫：a = 0 最亮 / 1 暗一点 / 2 灭着（只是一个小黑点）

  // 飘落的叶子：a.f = 0 平着 / 1 斜过来 / 2 侧着只剩一条 / 3 翻到另一面；a.m = 颜色
  function leaf(p, a) {

    if (a === 'open') {

      p.move(4.25, top, 0.52);                                                                                // 盖子绕右边的合页掀起来

  // 他的白手帕：拎着一个角，一道折痕
  function hanky(p) {

    p.poly([0, 0, 2.0, 2.0, 0.25, 4.0, -2.0, 2.0], m, { tone: function (x, y) { return x < -0.1 ? 4 : 3; } });

    p.poly([0.25, 4.0, 1.0, 3.25, 0.5, 3.25], m, { tone: 2 });                         // 卷起来的角

  // 小雏菊（不描边，和草地上的花一家）：a = 0 刚冒出来的芽 / 1 开花
  function daisy(p, a) {
    var g = M.grass, w = M.white, NO = { ol: false };

    p.line(p.hp + 0.5, -1.5, p.hp + 1.25, -2.0, g, 5, NO); p.dot(p.hp + 1.5, -2.25, g, 4, NO);   // 一片叶子

  // ---------- 表情（第二批）----------
  // 想吃饭：一朵想法云，里面一个满满的小红碗
  // 想法云：先画好里面的小图（自己描好边），云再填在空的地方（under），小图就有自己的描边
  function thoughtCloud(p, small) {
    var w = M.white, k = small ? 0.88 : 1, U = { tone: 4, under: true };
    p.ell(0.5 * k, -1.0 * k, 3.6 * k, 2.6 * k, w, U);
    p.disc(-1.8 * k, -2.6 * k, 1.4 * k, w, U); p.disc(0.6 * k, -3.2 * k, 1.6 * k, w, U); p.disc(2.8 * k, -2.4 * k, 1.3 * k, w, U);
    p.disc(-2.4 * k, -0.2 * k, 1.2 * k, w, U); p.disc(3.3 * k, -0.4 * k, 1.1 * k, w, U);
    p.rim(w, 1, 1, 3); p.rim(w, 0, 1, 2);
    p.disc(-5.0 * k, 3.6 * k, 1.0, w, { tone: 4 }); p.disc(-7.4 * k, 6.1 * k, 0.6, w, { tone: 4 });     // 两个往下拖的小泡（和大泡分开）
  }
  function food(p) {
    var m = M.cred;
    kibbles(p, 0.6, -1.25, 1.6, 1.1, -1.0, 3);                                            // 冒尖的一小堆狗粮
    p.poly([-1.25, -1.0, 2.5, -1.0, 1.9, 0.5, -0.65, 0.5], m, { tone: function (x) { return x < -0.25 ? 4 : (x > 1.4 ? 2 : 3); } });

  // 口水：一颗亮亮的水珠挂在一根细线上；a = 长度（2 / 3 / 5 世界单位）。最上面就是挂在嘴上的那一点（grip）
  function drool(p, a) {

    p.line(0, 0, 0, a - 1.5, m, 2, NO);
    p.ell(p.hp, a - 0.75, 0.5, a > 2 ? 0.75 : 0.5, m, { ol: false, tone: function (ux, uy) { return ux + uy < -0.3 ? 5 : (ux + uy > 0.5 ? 1 : 3); } });

  // 叹气：一小团淡淡的气，从嘴边往旁边飘；a = 大小（0.5 = 哼一声）
  function sigh(p, a) {
    var k = a || 1, m = M.dust, o = { f: 0.5, lo: 3, hi: 5, ol: false };
    p.disc(1.0 * k, -0.25 * k, 1.25 * k, m, o); p.disc(-0.6 * k, 0.1 * k, 0.9 * k, m, o); p.disc(2.3 * k, 0.2 * k, 0.8 * k, m, o);
    p.disc(-1.9 * k, 0.5 * k, Math.max(0.35, 0.45 * k), m, o);

  // 三个点：a = 显示几个（1 / 2 / 3；三帧用同一个框，一个一个冒出来）
  function dots(p, a) {
    var m = M.dark;
    p.box(-3.5, -1, 3.5, 1);
    for (var i = 0; i < a; i++) {
      var x = -2.5 + i * 2.5;

  // 脸红：两道短短的粉色斜杠（贴在脸颊上，不飘）
  function blush(p) {
    var m = M.heart, NO = { ol: false };
    for (var i = 0; i < 2; i++) {
      var x = -1.75 + i * 2.0;
      p.line(x, 0.75, x + 1.0, -0.75, m, 3, NO);
      p.line(x + 0.5, 0.75, x + 1.5, -0.75, m, 4, NO);

  }
  // 刚拉完那一下的两缕"新鲜"气（漫画里的意思，只出现一次）：两条淡淡的小波浪
  function wisp(p) {
    var m = M.steel, u = 0.5, i, j, NO = { ol: false };
    var W = [[0, 0, 1, 1, 1, 0, 0], [1, 2, 2, 2, 1, 1]];        // 从下往上，每一排往右挪几个像素：两道轻轻弯着的线
    for (i = 0; i < 2; i++) for (j = 0; j < W[i].length; j++) {
      var x = -1.5 + i * 1.75 + W[i][j] * u, y = 1.5 - j * u - i * u;
      p.rect(x, y, x + u, y + u, m, { tone: 3, ol: false });

  }
  // 四叶草（交好运），旁边一个小小的金色闪光
  function clover(p) {
    var g = M.grass, i, d = 1.3, hp = p.hp;
    p.cap(hp + 0.25, 0.75, hp + 1.25, 3.0, 0.3, 0.25, g, { tone: 2 });                       // 小茎
    for (i = 0; i < 4; i++) {
      var an = i * PI / 2 + PI / 4, c = Math.cos(an), s = Math.sin(an);
      p.disc(hp + c * d, s * d, 1.2, g, { f: 0.3, lo: 2, hi: 4 });                           // 一片叶子
    }
    p.line(hp, -2.5, hp, 2.5, g, 0, { over: g }); p.line(hp - 2.5, 0, hp + 2.5, 0, g, 0, { over: g });   // 四片叶子之间的缝
    for (i = 0; i < 4; i++) {
      var a2 = i * PI / 2 + PI / 4;
      p.dot(hp + Math.cos(a2) * 2.2, Math.sin(a2) * 2.2, g, 0, { over: g });                  // 每片叶子外头一个小缺口：像一颗心
    }
    p.dot(hp - 1.5, -1.0, g, 5, { lock: true }); p.dot(hp + 0.75, -1.5, g, 5, { lock: true });
    p.outline();
    var x = hp + 2.75, y = -2.75, o = { ol: false, lock: true };                              // 金色的小闪光
    p.dot(x, y, M.gold, 5, o); p.dot(x - 0.5, y, M.gold, 3, o); p.dot(x + 0.5, y, M.gold, 3, o); p.dot(x, y - 0.5, M.gold, 3, o); p.dot(x, y + 0.5, M.gold, 3, o);
  }


  // ============================================================
  //  互动用的小道具（R5 3.3）
  // ============================================================
  // 一段两股拧在一起的绳子（红、白斜条纹），沿着折线 pts 画，粗 r
  function twist(p, pts, r) {
    var i, red = M.cred, wt = M.ivory, len = 0, segs = [];
    for (i = 0; i + 3 < pts.length; i += 2) {
      p.cap(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], r, r, red, { f: 0.3 });
      var dx = pts[i + 2] - pts[i], dy = pts[i + 3] - pts[i + 1], l = sqrt(dx * dx + dy * dy) || 1;
      segs.push([pts[i], pts[i + 1], dx / l, dy / l, l]); len += l;
    }
    // 每隔一小段，斜着压一道白的
    for (i = 0; i < segs.length; i++) {
      var g = segs[i], t;
      for (t = 0.4; t < g[4]; t += 1.0) {
        var cx = g[0] + g[2] * t, cy = g[1] + g[3] * t, nx = -g[3], ny = g[2];
        p.line(cx - nx * r - g[2] * 0.4, cy - ny * r - g[3] * 0.4, cx + nx * r + g[2] * 0.4, cy + ny * r + g[3] * 0.4, wt, 4, { over: red });
      }
    }
  }
  // 绳结：4 × 4，红白两股
  function knot(p, x, y) {
    var red = M.cred, wt = M.ivory, k;
    p.disc(x, y, 1.6, red, { f: 0.3 });
    for (k = -2; k <= 2; k++) p.line(x + k * 1.5 - 1.6, y + 1.6, x + k * 1.5 + 1.6, y - 1.6, wt, 4, { over: red });
    p.rim(red, 1, 1, 2); p.rim(wt, 1, 1, 2); p.rim(red, -1, -1, 4); p.rim(wt, -1, -1, 5);
  }
  // 树枝（28 × 2）：稍微弯一点，中间偏右一个小杈；a.chew = 右头被咬过（露出浅色的木头）
  function stick(p, a) {
    var w = M.wood;
    p.cap(-13.5, 0.25, 0, -0.25, 0.5, 0.55, w, { f: 0.3 });
    p.cap(0, -0.25, 13.25, 0.25, 0.55, 0.45, w, { f: 0.3 });
    p.cap(6.0, -0.25, 7.5, -2.0, 0.35, 0.25, w, { f: 0.3 });
    p.dot(-8, 0, w, 1, { over: w }); p.dot(-3.5, -0.5, w, 2, { over: w }); p.dot(3.0, 0, w, 1, { over: w }); p.dot(10, 0, w, 2, { over: w });
    p.dot(-13.75, 0, w, 5, { over: w, lock: true });                                     // 断口：浅色的木头
    if (a && a.chew) {
      p.rect(10.5, -0.25, 13.25, 0.5, w, { tone: 5, over: w, lock: true });
      p.line(13.5, -0.5, 14.5, -1.0, w, 4); p.line(13.5, 0.5, 14.5, 1.0, w, 4);
    }
    p.outline();
    p.anchor('grip', 0, 0);
  }
  // 绳子玩具：a = 'ground' 平放 / 'carry' 叼着一头、另一头往下坠 / 'knot' 只有一个绳结（两张嘴之间拉紧时，线的两头用）
  function ropeToy(p, a) {
    if (a === 'knot') { knot(p, 0, 0); p.outline(); p.anchor('grip', 0, 0); return; }
    if (a === 'carry') {
      twist(p, [0, 0.5, 1.5, 3.5, 3.0, 6.0, 4.0, 8.5], 0.6);
      knot(p, 0, 0); knot(p, 4.25, 10.0);
      p.outline();
      p.anchor('grip', 0, 0);
      return;
    }
    twist(p, [-6.0, -1.75, -2.0, -2.25, 2.0, -1.5, 6.0, -1.75], 0.6);
    knot(p, -6.0, -1.75); knot(p, 6.0, -1.75);
    p.outline();
    p.anchor('grip', -6.0, -1.75);
  }
  // 红色牵引绳：a = 'ground' 盘在地上（一头是手环，一头是钢扣）/ 'handle' 只有手环（他手里）/ 'carry' 叼着手环、绳子垂下去
  function leash(p, a) {
    var r = M.cred, s = M.steel;
    var loop = function (x, y) {                                                        // 手环：3 × 4 的一个圈
      var pts = [], i;
      for (i = 0; i <= 12; i++) { var t = i / 12 * PI * 2; pts.push(x + Math.sin(t) * 1.0, y - 1.5 + Math.cos(t) * 1.5); }
      p.stroke(pts, 0.75, r, { tone: 3 });
    };
    if (a === 'handle') {
      loop(0, 0);
      p.stroke([0, 0, 0, 2.5], 0.75, r, { tone: 3 });
      p.rim(r, -1, 0, 4); p.rim(r, 1, 0, 2);
      p.outline();
      p.anchor('grip', 0, -2.75);
      return;
    }
    if (a === 'carry') {
      loop(0, 0);
      p.stroke([0, 0, 0.75, 3, 1.25, 6, 1.0, 9, 0.25, 11], 0.75, r, { tone: 3 });
      p.rect(-0.25, 11, 0.75, 12.5, s, { tone: 3 }); p.dot(0.25, 12.75, s, 2);            // 钢扣
      p.rim(r, -1, 0, 4); p.rim(r, 1, 0, 2);
      p.outline();
      p.anchor('grip', 0, -2.75);
      return;
    }
    loop(-6.5, -1.0);
    p.stroke([-6.5, -1.0, -4, -0.75, -1.5, -1.75, 1.5, -2.25, 4, -1.0, 6.5, -0.75], 0.75, r, { tone: 3 });
    p.rect(6.5, -1.25, 8.0, -0.25, s, { tone: 3 }); p.dot(8.25, -0.75, s, 2);
    p.rim(r, -1, -1, 4); p.rim(r, 1, 1, 2);
    p.outline();
    p.anchor('grip', -6.5, -2.5);
  }
  // 梳毛的刷子（5 × 3）：木头背、深色的刷毛；a.full = 刷毛上夹着一块奶油色的毛
  function brush(p, a) {
    var w = M.wood, d = M.shoe, c = M.cream;
    p.cap(-1.75, -1.25, 1.75, -1.25, 0.75, 0.75, w, { f: 0.35 });
    p.rect(-2.25, -0.75, 2.25, 0.5, d, { tone: function (x) { return (round(x * p.R) & 1) ? 2 : 4; } });
    if (a && a.full) {
      p.ell(0.25, 0.75, 2.4, 1.1, c, { f: 0.4, lo: 3 });
      p.dot(-2.0, 1.25, c, 4); p.dot(2.5, 1.5, c, 3); p.dot(-1.0, 1.75, c, 4);
    }
    p.outline();
    p.anchor('grip', 0, -1.75);
  }
  // 一团奶油色的毛（6 × 5），四周翘着几根；a = 转到哪一帧（0 / 1 / 2，滚起来轮着放）
  function furball(p, a) {
    var c = M.cream, i, ph = a * 2.1;
    p.box(-4, -6.5, 4, 0);
    p.ell(0, -2.6, 2.4, 2.1, c, { f: 0.35 });
    for (i = 0; i < 9; i++) {
      var an = ph + i * 0.7 + (hsh(i * 3 + 1) - 0.5) * 0.4, l = 2.3 + hsh(i * 7) * 0.9;
      p.line(Math.cos(an) * 1.6, -2.6 + Math.sin(an) * 1.4, Math.cos(an + 0.25) * l, Math.min(-1.0, -2.6 + Math.sin(an + 0.25) * l * 0.85), c, an > 2.4 && an < 5.5 ? 4 : 3);
    }
    p.line(Math.cos(ph) * 0.5 - 0.5, -3.1, Math.cos(ph) * 0.5 + 0.75, -2.1, c, 2, { over: c });        // 一道毛的纹路，跟着转
    p.outline();
    p.anchor('grip', 0, 0);
  }
  // 白杯子（4 × 4）：里面是茶，右边一个把手，上面一缕热气；a = 0 / 1 两帧热气
  function cup(p, a) {
    var m = M.paper, NO = { ol: false };
    p.box(-2.0, -6.5, 3.5, 0);
    var hp = [];                                                                        // 把手：一个小圈
    for (var i = 0; i <= 10; i++) { var t = -PI / 2 + i / 10 * PI; hp.push(1.6 + Math.cos(t) * 0.9, -2.0 + Math.sin(t) * 0.8); }
    p.stroke(hp, 0.5, m, { tone: 3 });
    p.poly([-1.6, -3.25, 1.6, -3.25, 1.25, -0.5, -1.25, -0.5], m, { tone: function (x) { return x < -0.75 ? 4 : (x > 0.75 ? 2 : 3); } });
    p.ell(0, -3.25, 1.6, 0.5, m, { tone: 4 });
    p.ell(0, -3.2, 1.1, 0.3, M.kib, { tone: 2, over: m });                              // 茶
    p.outline();
    var S = a ? [[0.25, -4.25], [0.0, -4.75], [0.25, -5.25], [0.5, -5.75]] : [[0.0, -4.25], [0.25, -4.75], [0.0, -5.25], [-0.25, -5.75]];
    for (i = 0; i < S.length; i++) p.dot(S[i][0], S[i][1], M.white, i < 2 ? 4 : 3, NO);
    p.anchor('grip', 2.3, -2.0);
  }
  // 台历（6 × 7）：白纸、上面一道红边和两个扣环；a.sheet = 撕下来飘着的那一页（5 × 5，a.tilt 歪多少）
  function calendar(p, a) {
    var w = M.paper, r = M.cred, d = M.shoe;
    if (a && a.sheet) {
      p.box(-3.5, -3.5, 3.5, 3.5);
      p.move(0, 0, a.tilt || 0);
      p.rect(-2.25 * (a.sq || 1), -2.25, 2.25 * (a.sq || 1), 2.25, w, { tone: 4 });
      p.rect(-2.25 * (a.sq || 1), -2.25, 2.25 * (a.sq || 1), -1.75, r, { tone: 3 });  // 撕下来时连着的一点红边
      p.rect(-0.75 * (a.sq || 1), -1.0, -0.25 * (a.sq || 1), 1.0, d, { tone: 3 }); p.rect(0.25 * (a.sq || 1), -1.0, 0.75 * (a.sq || 1), 1.0, d, { tone: 3 });   // 日期（两个数字）
      p.home();
      p.rim(w, 1, 1, 3);
      p.outline();
      p.anchor('grip', 0, -2.0);
      return;
    }
    p.rect(-2.5, -6.0, 2.5, -0.5, w, { tone: function (x) { return x > 1.5 ? 3 : 4; } });
    p.rect(-2.5, -6.0, 2.5, -4.5, r, { tone: 3 });
    p.rect(-2.5, -6.0, 2.5, -5.5, r, { tone: 4 });

//
// render 给回来的东西：{ w, h, data(RGBA), scale, ox, oy, key: null, ver, box, mouth, nose, back, seat, headX, headY, top, half }

      else if (!a.n || !b.n) { if (w >= 0.5) { n = b.n; top = b.top; L = b.L; Rr = b.R; } }
      else {
        // 两片的行数可能不一样：按"从上到下的百分比"对上
        var nn = Math.max(a.n, b.n);
        for (i = 0; i < nn; i++) {
          var u = (i + 0.5) / nn, fa = clamp(u * a.n - 0.5, 0, a.n - 1), fb = clamp(u * b.n - 0.5, 0, b.n - 1);
          var ia = Math.floor(fa), ib = Math.floor(fb), ia2 = Math.min(a.n - 1, ia + 1), ib2 = Math.min(b.n - 1, ib + 1);
          TL[i] = lerp(lerp(a.L[ia], a.L[ia2], fa - ia), lerp(b.L[ib], b.L[ib2], fb - ib), w);
          TR[i] = lerp(lerp(a.R[ia], a.R[ia2], fa - ia), lerp(b.R[ib], b.R[ib2], fb - ib), w);
        }
        hgt = lerp(a.n, b.n, w) / nn; top = lerp(a.top, b.top, w); n = nn; L = TL; Rr = TR;
      }
    }
    if (!n) return;
    vn = 0;
    if (shOn) {
      loc(L[0] + SHX[0], top + SHY[0]);
      for (i = 0; i < n; i++) loc(L[i] + SHX[i], top - (i + 0.5) * hgt + SHY[i]);
      loc(L[n - 1] + SHX[n - 1], top - n * hgt + SHY[n - 1]); loc(Rr[n - 1] + SHX[n - 1], top - n * hgt + SHY[n - 1]);
      for (i = n - 1; i >= 0; i--) loc(Rr[i] + SHX[i], top - (i + 0.5) * hgt + SHY[i]);
      loc(Rr[0] + SHX[0], top + SHY[0]);
    } else {
      loc(L[0], top);
      for (i = 0; i < n; i++) loc(L[i], top - (i + 0.5) * hgt);
      loc(L[n - 1], top - n * hgt); loc(Rr[n - 1], top - n * hgt);
      for (i = n - 1; i >= 0; i--) loc(Rr[i], top - (i + 0.5) * hgt);
      loc(Rr[0], top);
    }
    poly(m, t, sh);
  }

    water: true,              // 吃完饭喝水，玩累了也喝
    lucky: true,              // 很少很少的"狗屎运"
    meals: ['08:00', '18:30'],
    biscuitTime: '15:30',     // 每天一块饼干；null = 没有
    nightSleep: [0, 7],
    tune: {

      gapSec: 90,                 // 两次 tick 隔了这么久以上 = 刚才没在跑（补算）
      minGapMin: 180,             // 两顿自动的正餐至少隔多久
      quietMealMin: [4, 10],      // 刚醒 / 刚打开：这么久以内不自动开饭
      quietPottySec: [90, 240],   // 刚醒 / 今天头一回出来：这么久以内不上厕所
      returnPottySec: [60, 240],  // 她走开又回来：这么久以内不上厕所（回来看到的第一件事不能是便便）

      biscuitAfterMealMin: 90,    // 但正餐以后这么久以内不给

      resumeMax: 0.95,            // 补算完 bowel 最多到这里：一打开绝不马上出事
      resumeThirstMax: 0.60,      // 渴也一样
      morningGapHours: 6,         // 早上那一泡：离上一次至少这么久
      snackFull: 0.35, snackBolus: 0.10, biscuitFull: 0.05,
      mealThirst: 0.35, fetchThirst: 0.004,
      waterGapMin: 45, waterCap: 4,
      biscuitPerHour: 3, biscuitPerDay: 8, snackPerDay: 2,
      feedNowSnackAfterMin: 150,  // "开饭"：上一顿正餐这么久以前 = 小份的一顿，不然只给饼干

<script>// 球球 · 玩法引擎（第三版）
//
// 一个穿西装的小人、一只小腊肠、一只大金毛，和一颗小球。
//   · 可以满屏幕到处跑（roam），也可以只待在屏幕最下面一条

//   · 没事的时候它们自己会找事做：一段一段的"戏"写在 scenes/ 下面的戏包里（见下面"怎么写一场戏"）
//   · 晚上或者她说"回家"时，它们会跑回屏幕顶上的"灵动岛"里睡觉

// 画图的活在别的文件里：dogs.js（狗）、person.js（小人）、fx.js（小球、表情、影子、道具……）；

//

//   然后 scenes/ 下面所有 .js（按文件名排；每个往全局数组 PET_SCENES 里放戏），最后才 PET_ENGINE.create。
//   哪个文件读的时候出错：跳过它，接着读别的。
//
//   var eng = PET_ENGINE.create(host, cfg);
//
//   host（除了 now 都可以不给）：
//     now()                    现在几秒了（只要一直往前走就行）
//     date()                   墙上的钟：从 1970 年起的毫秒（不给就用电脑的钟；测试时拿它拨钟）
//     storage.get(k) / set(k, v)   存几小份东西（都是 JSON 字符串）：qiuqiu-stats 今天丢了几次球、
//                              qiuqiu-world 戏的记性（每段戏今天演了几次、草地上的小印子）、qiuqiu-care 喂饭拉粑粑
//     haptic(kind)             'light' | 'soft'：手机上震一下
//     island                   屏幕顶上有没有岛：{ center() 岛的中心在哪（世界单位的 x）, visible() 现在显示着吗,
//                              hit(x, y) 把谁拎到这里放下算不算"放到岛上"，
//                              rim() 可以不给：岛下沿 { x0, x1, y }，pulse(kind) 可以不给：岛弹一下
//                              （rummage | drop | gulp | shake | bulge）}；没有岛就给 null
//     log(msg)                 画图的文件或者戏包出了错时会说一声（引擎自己顶上 / 跳过那一段，不会停）
//   cfg：config.js 里的设定，外壳可以再加几样：
//     res（R，默认 2）、rigFps（原地做动作时每秒重画几次，默认 12）、auto（自动丢球，默认开）、
//     roam、grass（有草地：影子深一点，打滚会带起草屑）、lang（小人说话用 'hant' 繁体 | 'hans' 简体 | 'en'，默认 hans）、
//     entrance（刚打开时从岛里跳出来，默认开）、lawnTap（点空地 = 往那儿丢球；只有网页版开）
//
//   eng.configure({ view: { w, h }, insets: { top, bottom, left, right }, res, roam, auto, grass, soft, feeding, potty })
//       画面多大、四边各让出多少（都是世界单位）。第一次给 view 时角色才摆到场地上。
//       feeding / potty：她菜单里的两个开关（自动喂饭、拉粑粑）；不给就用 config.js 里 care.feeding / care.potty
//   eng.sense(o)        外面的事（SPEC 8.4 / 8.8；每样都可以不给，不给就当没变；一秒最多十来次）：
//       cursor [x, y] | null（她的鼠标在哪；null = 不知道 / 在别的屏幕）、idle 她几秒没碰键盘鼠标了、
//       woke: true（屏幕刚亮 / 电脑刚醒，说一次）、asleep: true | false、battery { level 0..1, charging } | null、
//       frontApp、dock { x, y, w, h } | null（程序坞在哪）、statusItem x | null（菜单栏上我们那个图标的 x）、menu: true（她打开了菜单）
//       从来没说过的：当她在、鼠标不知道在哪
//   eng.step(dt)        往前走 dt 秒（每画一帧调一次就行；隔得久它自己会拆成几小步走；墙上的钟跳了 90 秒以上 = 刚醒）
//   eng.compose()       这一帧该画什么 → { items, hot, drag, bubble, decals }
//       items   从后到前排好的清单，每一项 { id, img, x, y, flip, a, clip? }：
//               img = { w, h, data(RGBA), scale, ox, oy, key, ver }；(x, y) 是图的左上角（世界单位，不取整）；
//               flip = 左右镜像（绕图自己的中线）；a = 不透明度；clip = [x, y, w, h]（有的话只画图在这个框里的部分）。
//               id 每个东西固定不变：gold / person / dax / ball / held（他右手里的小东西）/ held2（左手）/ held:dax（嘴里）/
//               prop:编号（道具）/ shadow:gold… / shadow:prop:编号 / puff:编号 / px:编号 / item:编号 / bfly / emote:编号
//               三个角色各自一直用同一张 img：像素变了它的 ver 才加一（key 是 null）；其余的图 key 不变就不会变
//       hot     可以点的范围 [x, y, w, h]（已经留好边）：先是球（抓得到的时候），然后金毛、小人、小腊肠（藏起来的不算），
//               再后面是鼠标在上面停够了的道具（所以长度会变，别当成固定 4 个）
//       drag    她正拖着球 / 拎着谁
//       bubble  小人在说话：{ text, x, y, id }，(x, y) 是他头顶；换了一句 id 会变；没在说就是 null
//       decals  草地上的小印子 [{ id, img, x, y, overlay, flip }]：画在草地那一层（她的窗口后面）；草地关着的时候只画 overlay: true 的
//       顺便会更新"可以点的范围"和嘴、手的位置，所以每画一帧调一次就好
//   eng.pointer(type, x, y)   'down' | 'move' | 'up' | 'hover' | 'leave'（世界单位）；返回 true = 点在球、谁、或者能点的道具上了
//   eng.command(name)   'throw' | 'wave' | 'home' | 'out' | 'toggleHome' | 'love' | 'gather' | 'feed'（她说开饭）| 'tuck'（她点了岛里睡觉的那一格）
//   eng.status()        { home: 'out' | 'going' | 'in' | 'leaving', fetch, pets, night, auto, roam, scene（正在演的 scene 的名字）,
//                         phase: 'day' | 'dusk' | 'night'（草地该用哪套颜色）, drag,
//                         care（有喂饭那一套时才有）: { meal: 'idle' | 'due' | 'serving', kind, meals, poops, fedByHer, byHer, lucky, feeding, potty } }
//   eng.busy()          0 没什么在动 / 1 鼠标在附近、有蝴蝶 / 2 正在动（外壳据此决定画得多勤）
//   eng.den(R)          它们在岛里睡觉时，岛上那一小格里画什么 → { w, h, items }（坐标相对那一格的左上角；
//                       id 是 den:gold / den:person / den:dax / den:z / den:blanket）
//   eng.setQuality(q)   0..1：机器吃力时调低，角色就少重画几次
//   eng._t              给测试脚本用的（state boxes set scene endScene raise list events ends beats stuck props sceneErrors sense care cost errors perf）
//
// ================================================================
//  怎么写一场戏（写 scenes/*.js 的人只看这一节就够了）
// ================================================================
// 一、戏包
//   一个文件就是一个戏包，放在 scenes/ 下面，只做一件事：往全局数组 PET_SCENES 里放记录。照 scenes/examples.js 的样子写：
//     (function (G) {
//       var L = G.PET_SCENES = G.PET_SCENES || [];
//       L.push({ name: 'nose_boop', kind: 'react', on: 'click', cast: 'who', tag: 'hers',
//                when: function (S, ev) { return ev.zone === 'nose'; },
//                run: function* (S, ev) { S.hold(S.who, 'sit'); S.emote('spark', S.who); yield 1; } });
//     })(typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : this));
//   只能用语言自带的东西（ES2017，generator 可以）：没有 window / document / console / 定时器；不改别的全局；不碰引擎里面。
//   一条记录写错了（没名字、重名、cast 不认得……）：这一条跳过、告诉外壳一声，别的照常。
//
// 二、一条记录有哪些字段（只有 name、cast、run 必须写）
//   name      全局唯一的名字（英文、下划线）                    zh       中文名（给人看的）
//   kind      'scene'（默认，几个角色一起演，导演闲着时挑）| 'solo'（一个角色自己的小动作，1-6 秒）|
//             'react'（出了什么事才演，要写 on）| 'care'（喂饭、拉粑粑那一套，由照料导演开演）
//   cast      谁来演：'man' 'dax' 'gold' 随便组合（'dax gold' 或 ['man', 'dax']）；
//             'dog' = 哪只狗都行（事件里带了狗就是那只）、'other' = 另一只狗、'who' = 事件落在谁身上就是谁
//             solo 只写一个：'man' | 'dax' | 'gold' | 'dog'（两只都可以）
//   weight    多常挑到它：数字（老的十一段是 2-3），或者 function (S) { return 数字; }；默认 2；0 = 这会儿不演
//   when      function (S, ev) { return true / false; }：这会儿能不能演（S 是"探路用"的，只能读，不能下指令）
//   on        react 回应哪个事件（名字见"六、事件"；可以是几个：['click', 'dblclick']）
//   at        'HH:MM' 或几个：只在这一分钟演（自动等于 on: 'minute'）；比如 at: '15:30'
//   chance    0..1：事件来了以后演的几率（默认 1）
//   keep      秒：事件来了演员一时没空，最多再等这么久（默认 0 = 不等）
//   cool      秒：演完以后至少隔多久才能再演          cap   一天最多演几次（本地时间过了半夜重新算）
//   timeout   秒：最长演多久，到了就当被打断（默认 scene 70、solo 20、react 30、care 110）
//   tag       'calm'（不跑远，她在忙也可以演）| 'lively'（跑来跑去：她不在时不演，傍晚以后少演）|
//             'seek'（会跑到她鼠标那儿去：只有她在玩、鼠标在附近又没在打字时才演）| 'hers'（她亲手引起的：总是可以演，
//             还能打断正在演的普通戏）| 'cursor'（要看她鼠标的小动作）| 'fetch'（丢球中途也能演）
//   mood      'funny' | 'playful' | 'mischievous' | 'tender' | 'proud' | 'sleepy'：一天里不同时候多演 / 少演（早上热闹、下午犯困……）
//   family    一家子（'tug' 'carry' 'sleep' 'nose' 'biscuit' 'island' 'cursor'……）：同一家子的三段里不连着来
//   cat       抽签袋的类别（默认：有小人的 'B'，只有狗的 'A'）：同一类里每段都轮过一遍才会重复
//   hours     [[9, 12], [14, 18]]：只在这几个钟点里演          fromDay  第几天起才演（第一次打开那天是 0；设定 discovery: false 就不管）
//   overlay   react 专用：true = 不占演员，只在他们身上叠表情 / 心情 / 眼神（S.face / S.mood / S.look / S.rig），谁都不挪
//   aware     solo 专用：演的时候鼠标凑过来还会看鼠标、摇尾巴（默认 true）
//   anytime   react 专用：丢球玩到一半也能演（默认只在休息时演）
//   care      care 专用：这段戏管哪件事（'meal' 'water' 'potty' 'cleanup' 'feednow' 'thanks' ……，见"照料"）
//   run       function* (S, ev) { ... }：剧本本身（必须是 generator）
//   end       function (S, cancelled, why) { ... }：演完 / 被打断以后调一次，收尾用（why：'input' 'ball' 'carried' 'home' 'timeout' 'error' ……）
//
// 三、导演怎么排
//   · 她的事永远先办：拖球、丢球、点人、拎人一来，正在演的戏马上让路（S.commit 说过"别打断"的那一小段演完再让，拎人不等）。
//   · 休息时（没在丢球）每隔 6-15 秒挑一段 scene；狗和小人闲下来就挑一个自己的 solo；出了事就看有没有 react 接。
//   · 挑的时候看：weight × 一天里的时候（mood / tag）× 她在不在（idle）；冷却（cool）、每天几次（cap）、抽签袋、一家子不连着来。
//   · 设定（config.js）里可以调：liveliness（0.5 安静 … 1.5 热闹，默认 1）、quietHours（[[9, 12]]：这几个钟点只演 calm 的）、
//     cursorPlay（false = 不演 seek / cursor 的戏）、discovery（false = fromDay 不管用）、lines（小人的台词，见 S.say）、dates（特别的日子）。
//   · 一段戏演完 / 被打断以后，引擎负责收拾：角色放回去（站好、不再骑在谁背上）、它放的道具收走、球回到小人手里。
//
// 四、run 怎么写：generator 里每一个 yield 都是"等一下"
//   yield 1.5;                       等 1.5 秒
//   yield S.go(S.dax, x, y, 'run');  等她跑到（S 上的走位函数都返回"等它做完"）
//   yield [a, b];  yield S.all(a, b);   都好了再往下        yield S.any(a, b);  有一样好了就往下
//   yield function () { return S.dax.z === 0; };          等这个条件成立        yield;  只等下一步（1/60 秒）
//   yield* S.run('treat');           把别的一段戏接进来演          yield* S.enterIsland(S.dax);   一个角色自己钻进岛里
//
// 五、S 上有什么（S = 这段戏拿到的舞台；ev = 引起它的那件事，没有就是 null）
//   —— 谁 ——
//   S.man / S.dax / S.gold        三个角色（S.dogs = [金毛, 小腊肠]）     S.me = 第一个演员（solo 就是它自己）
//   S.dog / S.other               cast 里那只狗 / 另一只          S.who = 事件落在谁身上          S.cast  演员列表
//   S.name / S.kind / S.ev        这段戏的名字 / 种类 / 事件
//   角色身上能读的：x y z（脚下的位置、离地多高）face（1 朝右 -1 朝左）half（半个身子多宽）mx（嘴离身体中心多远）
//     top（头顶的屏幕 y）kind（'man' | 'dax' | 'gold'）pose（狗现在的姿势）energy（金毛还有多少力气 0..1）hidden carried
//   自己演员身上能写的：wag（摇尾巴 0..1）pant（喘气）happy（1 = 开心的脸）bark（秒：叫几声）look（-1..1 低头 / 抬头）
//     lift（往上抬多少，比如坐在别人腿上）face（朝向）
//   —— 等、随机 ——
//   S.wait(2)  S.all(..)  S.any(..)  S.until(fn, 最多几秒)  S.each(秒, function (t, dt) {...})：这几秒里每一步都调一下
//   S.t()  这段戏演了几秒        S.now()  引擎时间（秒）
//   S.rand(a, b)  S.randInt(a, b)  S.pick([..])  S.chance(0.3)：每段戏有自己的随机数（不要用 Math.random）
//   —— 走位（只能指挥自己的演员；返回值可以 yield）——
//   S.go(who, x, y, 速度, 姿势, 最多几秒)  或  S.go(who, { x, y }, 速度, 姿势)
//       速度：数字（世界单位/秒）或名字——狗 'walk' 'trot' 'run' 'back' 'sniff'；小人 'stroll' 'brisk' 'hurry'（也认 walk trot run）
//       姿势：走的时候摆什么（狗：'sniff' 低头闻着走；小人：画面名字）；最多几秒默认 8；停的地方会自己躲开她的鼠标和地上的东西
//   S.follow(who, 跟着谁, 落后多远, dy, 速度)        S.track(who, function () { return { x, y }; }, 速度, 姿势)：追着会动的东西
//   S.stop(who)  停下                S.stage(dog)  它正挤在小人身边的话先小跑到旁边空地（狗狗之间的戏开头用）
//   S.orbit(who, 中心 {x, y}, rx, ry, 几圈, 速度)    绕圈跑               S.slide(who, dx, dy, 秒)  不迈步地挪（被拖着、蹭过去）
//   S.hop(who, 力气)   跳（60 ≈ 3 高、110 ≈ 10、150 ≈ 18、190 ≈ 29）     S.faceTo(who, 角色 | 道具 | x | 'cursor' | 'left' | 'right')
//   S.turn(who)  转身         S.spd(who, 'run')  这个速度名字是多少
//   S.backUp(dog, x, y, 速度, 最多几秒)  倒着退过去（脸不转过来，骨架收到 reverse）
//   S.echo(who, 学谁, 慢几秒, 速度)  照着那个角色几秒以前走过的地方走（跟屁虫），一直到这段戏完或者 S.stop
//   S.attach(who, 安到谁身上, 锚点, dx, dz, 画在后面?, 朝向)  骑到背上（'seat'）、抱在怀里（'arms'）、叼在嘴边（'mouth'）……
//       之后那个角色走到哪它跟到哪；S.detach(who, 跳下来的力气)  放下来（0 = 直接落地）
//   yield* S.enterIsland(who) / yield* S.leaveIsland(who)    一个角色自己进出岛（别人不受影响；戏完了会自己出来）
//   —— 姿势、画面、表情、眼神（名字不认得也不会出错：狗画成站着，小人画成 p_idle）——
//   S.hold(dog, 'sit')          狗的姿势（PET_DOGS.POSES；画的人在加新的：'eat' 'squat' 'circle'……）
//   S.hold(S.man, 'p_watch')    小人的画面（PET_PERSON.FRAMES）；{ f: ['p_cheer', 'p_cheer2'], fps: 5 } = 几张轮着；null = 回到普通站姿
//   S.hold(who, ['squat', 'sit'])   给几个名字：用第一个画的人已经画了的（都没有就用最后一个）
//   S.has(who, 名字)  画的人有没有这个姿势 / 画面 / 动作 / 表情 / 心情          S.hasFx('bowl_full')  有没有这张道具图
//   S.face(S.man, 'smile')      小人的表情（PET_PERSON.FACES：smile grin laugh soft surprised wink blush sleepy yawn focus proud oops pout kiss wistful…）
//   S.mood(dog, 'happy')        狗的心情（PET_DOGS.MOODS：happy sleepy guilty curious proud worried focused）
//   S.look(who, 目标)           看哪儿：角色 / 道具 / 'ball' / 'cursor' / 'camera'（看她）/ { x, y, z } / null = 引擎自己挑
//   S.act(who, 'yawn', 最多几秒)   骨架自己演的一小段动作（PET_DOGS.ACTS / PET_PERSON.ACTS：伸懒腰、甩毛、打哈欠……）：
//       返回"演完了"；画的人还没做这个动作就马上算完（所以随便写，不会卡住）。不给秒数就按画的人给的长度（ACT_TIME / ACT_LEN）。
//       小人的 whistle / man_hum / beckon 引擎会配音符，heart_hands / blow_kiss 配爱心，画面 p_pocket 配一团灰和小星星
//   狗被她拎着时画成 'held'；抱在小人怀里用 S.attach(dax, S.man, 'arms') + S.hold(dax, 'cradle')（cradle 的原点就在他手臂上）
//   S.rig(who, { tilt: 1, eyes: 'closed' })   直接递别的输入给骨架（画的人新加的那些）；S.rig(who, null) 收回
//   S.clip(who, [x, y, w, h])   只画这个框里的部分（躲在程序坞后面、从岛沿上探出头）；null = 整个画
//   不用收：戏一完，姿势、表情、心情、眼神、安在谁身上、裁切都会自己还原
//   S.wear(S.man, { tie: 'neat' | 'askew' | 'loose', mussed: true, specks: 0..1 }, 秒)  戏完了也留在他身上的样子（不给秒数 = 到明天），
//       每一步交给他的骨架；S.wear(S.man, null) 收回       S.worn()  现在身上留着什么
//   —— 身上的位置、地方 ——
//   S.anchor(who, 'mouth')  → { x, y, z }：狗 mouth nose back seat head chin tailTip forepaw；小人 hand hand2 grip arms lap chest tie tieTip pocket knee cuff shoe head mouth
//   S.hand('hand2')  小人的手现在在哪 → { x, y, z }       S.handPos()  他把东西丢出去那一下手在哪
//   S.beside(a, b, 空隙, dy)  a 站到 b 旁边（鼻尖之间留空隙）    S.inFront(b, 多远, dy) / S.behind(b, 多远, dy)
//   S.atHand(dog, dy)  狗站到小人手边    S.manAt(dog, 多远, dy)  小人站到狗旁边够得着它    S.ry(v)  满屏模式才有的前后偏移
//   S.pr(n)  按小人手长放大的距离    S.randPt(至少离多远, 离谁)  场地里随便一点    S.clear(x, y, r)  这附近地上没东西
//   S.field  脚能踩的范围 { x0, x1, y0, y1 }      S.view  画面 { w, h }      S.roam  是不是满屏跑      S.SK  小屏幕上的速度比例
//   S.island() → { x, y, on, rim } | null  岛     S.pulse('gulp')  岛弹一下     S.edge('left' | 'right' | 'top' | 'bottom')

      carry: function (p, who, anchor) { if (p && !p.dead && who) { p.holder = { who: who, anchor: anchor || (who.isPerson ? 'hand' : 'mouth') }; p.vx = p.vy = p.vz = 0; p.live = false; } },
      // 放到地上：不给位置就放在拿着它的那一点正下方
      drop: function (p, x, y) {
        if (!p || p.dead) return;
        var h = p.holder;
        if (x === undefined && h) { var q = anchorOf(h.who, h.anchor); x = h.who.x + q[0]; y = h.who.y + ry(1); }
        else if (x && typeof x === 'object') { y = x.y; x = x.x; }
        p.holder = null;
        if (x !== undefined) { p.x = clamp(+x, F.x0 + 2, F.x1 - 2); p.y = clamp(+y, F.y0, F.y1); }
        p.z = 0; p.vz = 0;
      },
      // 扔出去 / 掉下来：给它一个速度（世界单位/秒），落地会弹一下、滚一点
      fling: function (p, vx, vy, vz) { if (!p || p.dead) return; if (p.holder) { var g = PROP.where(p); p.holder = null; p.x = g.x; p.y = g.y; p.z = g.z; } p.vx = +vx || 0; p.vy = +vy || 0; p.vz = +vz || 0; if (p.z <= 0) p.z = 0.01; },
      remove: function (p, poof) { propRemove(p, poof !== false); },
      // 这一个道具现在在哪：{ x, y（地上那一点）, z }
      where: function (p) { if (!p) return null; var h = p.holder; if (h) { var q = anchorOf(h.who, h.anchor); return { x: h.who.x + q[0], y: h.who.y, z: q[1] + h.who.z + h.who.lift }; } return { x: p.x, y: p.y, z: p.z }; },
      find: function (kind) { for (var i = 0; i < props.length; i++) if (!props[i].dead && props[i].kind === kind) return props[i]; return null; },
      all: function (kind) { return props.filter(function (p) { return !p.dead && (!kind || p.kind === kind); }); },
      // 让不让她点：false / null = 不让；true 或 { w, h, dwell } = 让（鼠标停在上面 dwell 秒以后才算数）
      hot: function (p, h) { if (p && !p.dead) { p.hot = hotOf(h); if (!p.hot) p.live = false; } },
      // 这段戏演完以后它还留着（导演管，到 cap 秒自己没）；keep(p, false) = 跟着这段戏一起收走
      keep: function (p, on) { if (p && !p.dead) p.owner = on === false ? CUR : null; },
      alive: function (p) { return !!p && !p.dead; },
    };

    // ------------------------------------------------------------
    //  草地上的小印子（decal）：外壳画在草地那一层（她的窗口后面）。草地关着的时候只画 overlay: true 的
    // ------------------------------------------------------------
    var decals = [], decalSerial = 0;
    function decalAdd(spr, x, y, o) {
      o = o || {};
      var d = { id: 'decal:' + (++decalSerial), spr: String(spr), x: +x, y: +y, overlay: !!o.overlay, until: o.days > 0 ? clk.ms + o.days * 86400000 : 0, flip: !!o.flip };
      decals.push(d);
      if (d.until) { world.decals.push({ spr: d.spr, x: d.x, y: d.y, overlay: d.overlay, until: d.until, flip: d.flip, id: d.id }); if (world.decals.length > 25) world.decals.shift(); worldDirty = true; }
      if (decals.length > 40) decals.shift();
      return d.id;
    }
    function decalRemove(id) {
      for (var i = decals.length - 1; i >= 0; i--) if (decals[i].id === id) decals.splice(i, 1);
      for (i = world.decals.length - 1; i >= 0; i--) if (world.decals[i].id === id) { world.decals.splice(i, 1); worldDirty = true; }
    }
    API.decal = function (spr, x, y, o) { if (x && typeof x === 'object') { o = y; y = x.y; x = x.x; } return decalAdd(spr, x, y, o); };
    API.decalRemove = decalRemove;

    // ------------------------------------------------------------
    //  球：剧本里用的。pocket 收进口袋（两只手都要用的时候；不画、不能抓）· home 回到他手里 ·
    //  give(狗) 叼在狗嘴里 · take() 从狗嘴里拿回他手里 · lay(x, y) 放在地上（她可以抓）· toss(去哪, 秒, 多高) 扔过去
    //  这段戏结束时球一定回到他手里（她正拖着、正在玩丢球的时候除外）
    // ------------------------------------------------------------
    function ballHome() {
      if (ball.st === 'drag' || ball.st === 'free' || ball.st === 'tug' || ball.st === 'handing' || (ball.st === 'mouth' && !ball.owner)) { ball.owner = null; return; }
      ball.st = 'hand'; ball.holder = null; ball.other = null; ball.vx = ball.vy = ball.vz = 0; ball.owner = null; ball.fly = null;
    }
    function ballMine() { return !!CUR && (ball.owner === CUR || ball.st === 'hand' || ball.st === 'pocket') && play.phase === 'rest'; }
    var BALL = {
      where: function () { return { st: ball.st, x: ball.x, y: ball.y, z: ball.z, holder: ball.holder }; },
      inHand: function () { return ball.st === 'hand'; },
      pocket: function () { if (!ballMine() || (ball.st !== 'hand' && ball.st !== 'pocket')) return false; ball.st = 'pocket'; ball.owner = CUR; return true; },
      home: function () { if (CUR && ball.owner === CUR) ballHome(); return ball.st === 'hand'; },
      give: function (d) { if (!ballMine() || !d || d.isPerson || !owns(d)) return false; ball.st = 'mouth'; ball.holder = d; ball.other = null; ball.owner = CUR; ball.fly = null; return true; },
      take: function () { if (!CUR || ball.owner !== CUR) return false; ballHome(); return true; },
      lay: function (x, y) {
        if (!ballMine()) return false;
        if (x && typeof x === 'object') { y = x.y; x = x.x; }
        ball.st = 'rest'; ball.holder = null; ball.owner = CUR; ball.fly = null;
        ball.x = clamp(+x, F.x0 + BALL_R, F.x1 - BALL_R); ball.y = clamp(+y, F.y0, F.y1); ball.z = BALL_R; ball.vx = ball.vy = ball.vz = 0;
        return true;
      },
      // 扔过去：to = 角色（狗 = 嘴里，小人 = 手里）/ { x, y } 地上一点。返回"到了"
      toss: function (to, dur, peak) {
        if (!ballMine() || !to) return YES;
        var f = ball.st === 'hand' || ball.st === 'pocket' ? handNow() : (ball.st === 'mouth' && ball.holder ? pointOf(ball.holder) : { x: ball.x, y: ball.y, z: ball.z });
        ball.st = 'script'; ball.holder = null; ball.owner = CUR;
        var fl = ball.fly = { x0: f.x, y0: f.y, z0: Math.max(BALL_R, f.z), to: to, t: 0, dur: dur > 0 ? dur : 0.6, peak: peak === undefined ? 14 : peak };
        return function () { return ball.fly !== fl || fl.t >= fl.dur; };
      },
    };
    // 剧本扔的球：沿着弧线飞，到了就落进嘴里 / 手里 / 地上
    function updateBallFly(dt) {
      var fl = ball.fly;
      if (!fl || ball.st !== 'script') { ball.fly = null; return; }
      fl.t += dt;
      var k = clamp(fl.t / fl.dur, 0, 1), to = pointOf(fl.to) || { x: ball.x, y: ball.y, z: BALL_R };
      ball.x = fl.x0 + (to.x - fl.x0) * k; ball.y = fl.y0 + (to.y - fl.y0) * k;
      ball.z = Math.max(BALL_R, fl.z0 + ((to.z || BALL_R) - fl.z0) * k + Math.sin(Math.PI * k) * fl.peak);
      ball.rot += dt * 6;
      if (k >= 1) {
        ball.fly = null;
        if (fl.to === person) { ball.st = 'hand'; ball.holder = null; }
        else if (fl.to.K && !fl.to.hidden) { ball.st = 'mouth'; ball.holder = fl.to; }
        else { ball.st = 'rest'; ball.z = BALL_R; }
      }
    }

    // ------------------------------------------------------------
    //  狗狗自己的日常：闲下来就从登记过的 solo 里挑一个小动作（scenes/classic.js 里是最早那一套）；
    //  一个 solo 都没有登记（没装戏包）的时候，用下面引擎自己原来那一套
    // ------------------------------------------------------------
    function think(d) {
      d.pant = false; d.wag = 0.3; d.happy = 0; d.look = 0;
      if (sleepyTime()) { setPose(d, 'sleep', rand(20, 40)); return; }
      if (careThink(d)) return;                                         // 饭还没吃完：回碗边去
      if (d.kind === 'gold' && d.energy < 0.45) { setPose(d, 'lie', rand(8, 14)); d.pant = true; return; }
      if (SOLO[d.name].length) { if (!pickSolo(d)) setPose(d, 'stand', rand(1.2, 3)); return; }
      var r = Math.random();
      var idleFor = now - Math.max(lastTouch, play.lastPlay);
      if (d.kind === 'dax') {
        if (r < 0.20) walkTo(d, person.x + rand(-90, 90) * SK, person.y + ry(rand(-30, 30)), rand(26, 60) * SK);
        else if (r < 0.30) { var p = randPt(0); walkTo(d, p.x, p.y, spd(d, 'trot')); }
        else if (r < 0.38) { faceTo(d, person.x); setPose(d, 'bow', rand(1.4, 2.6)); d.wag = 1; }
        else if (r < 0.47) { faceTo(d, person.x); setPose(d, 'sit', rand(3, 6)); d.wag = 0.5; }
        else if (r < 0.54) {   // 满场疯跑
          d.st = 'zoom'; d.t = 0; d.pose = 'stand';
          var a = randPt(80 * SK, d), b = randPt(80 * SK, a);
          d.way = [a, b, a, { x: d.x, y: d.y }];
        }
        else if (r < 0.58) { d.st = 'spin'; d.t = 0; d.pose = 'stand'; d.wag = 0.9; }      // 追自己的尾巴
        else if (r < 0.65) { setPose(d, 'scratch', rand(1.6, 2.6)); }
        else if (r < 0.74) { p = randPt(0); walkTo(d, d.x + clamp(p.x - d.x, -60, 60), d.y + clamp(p.y - d.y, -40, 40), 14 * SK, 'sniff'); }
        else if (r < 0.80) { setPose(d, 'dig', rand(1.8, 2.8)); d.wag = 0.9; }
        else if (r < 0.85) { setPose(d, 'roll', rand(1.8, 3)); }
        else if (r < 0.93 && bfly.on) { d.st = 'bfly'; d.t = 0; d.pose = 'stand'; d.wag = 0.9; emote('bang', d, 0, 0.6); }
        else if (r < 0.96 && idleFor > 40) setPose(d, 'lie', rand(6, 14));
        else if (idleFor > 180 && r < 0.99) setPose(d, 'sleep', rand(25, 60));
        else setPose(d, 'stand', rand(1.2, 3));
      } else {
        if (d.energy < 0.45) { setPose(d, 'lie', rand(8, 14)); d.pant = true; return; }
        if (r < 0.18) { faceTo(d, person.x); setPose(d, 'sit', rand(5, 10)); d.wag = 0.5; }
        else if (r < 0.34) setPose(d, 'lie', rand(8, 18));
        else if (r < 0.52) walkTo(d, person.x + pick([-1, 1]) * rand(28, 60), person.y + ry(rand(-14, 14)), spd(d, 'walk') * 1.3);
        else if (r < 0.60) { p = randPt(0); walkTo(d, p.x, p.y, spd(d, 'walk') * 1.3); }
        else if (r < 0.66) setPose(d, 'scratch', rand(1.8, 2.8));
        else if (r < 0.75) { p = randPt(0); walkTo(d, d.x + clamp(p.x - d.x, -50, 50), d.y + clamp(p.y - d.y, -30, 30), 12 * SK, 'sniff'); }
        else if (r < 0.80) setPose(d, 'roll', rand(2, 3.2));
        else if (r < 0.86 && bfly.on) { d.look = 0.6; faceTo(d, bfly.x); setPose(d, 'sit', rand(3, 5)); d.wag = 0.6; }
        else if (idleFor > 120 && r < 0.95) setPose(d, 'sleep', rand(30, 80));
        else { setPose(d, 'stand', rand(2, 4)); d.wag = 0.5; }
      }
    }

    // 站在小人 / 另一只狗的正后方会被挡住（看起来像骑在人家头上）：返回挡住它的那个
    function blocker(d) {
      if (!person.hidden && !person.carried && Math.abs(d.x - person.x) < d.half * 0.7 + P_HALF - 1 && d.y <= person.y && d.y > person.y - (P_H - 1)) return person;
      var o = other(d);
      if (!o.hidden && !o.carried && (!o.scene || o.scene.kind === 'solo') && !o.att && o.z === 0 && Math.abs(d.x - o.x) < o.half * 0.75 &&
          (d.y < o.y || (d.y === o.y && d === dax)) && d.y > o.y - 13) return o;
      return null;
    }
    function sidestep(d, b) {
      var s = d.x >= b.x ? 1 : -1, gap = (b.isPerson ? P_HALF + 1 : b.half) + d.half + rand(6, 14);
      var tx = b.x + s * gap;
      if (tx < F.x0 + d.half + 4 || tx > F.x1 - d.half - 4) tx = b.x - s * gap;
      walkTo(d, tx, b.y + ry(rand(1, 7)), spd(d, 'trot'));
    }

    function grab(d) {
      var o = other(d);
      ball.vx = ball.vy = ball.vz = 0;
      haptic('light');
      // 另一只也到了嘴边 → 拔河
      if (o.st === 'chase' && hyp(o.x - d.x, o.y - d.y) < 30 && Math.random() < 0.6 && d.z < 2) {
        ball.st = 'tug'; ball.holder = d; ball.other = o; ball.tugEnd = now + rand(1.3, 2.1);
        ball.x = mouthX(d); ball.y = d.y; ball.z = BALL_R + 2;
        d.st = 'tug'; d.t = 0; d.pose = 'tug'; d.wag = 0.9;
        o.st = 'tugGo'; o.t = 0; o.pose = 'stand'; o.wag = 0.9;
        play.phase = 'back'; play.fetcher = d;
        emote('bang', o, 0, 0.6);
        return;
      }
      if (d.z > 3 && !person.scene && (person.st === 'idle' || person.st === 'follow')) { personAct({ f: ['p_cheer', 'p_cheer2'], fps: 6 }, 0.8); emote('spark', d); }
      if (d.z > 3) raise('catch', { who: d, z: d.z });
      carry(d);
    }
    function carry(d) {
      ball.st = 'mouth'; ball.holder = d; ball.other = null;
      play.phase = 'back'; play.fetcher = d;
      d.st = 'return'; d.t = 0; d.pose = 'stand'; d.wag = 0.9;
      if (d.kind === 'gold') d.energy = Math.max(0, d.energy - 0.2);
      dogs.forEach(function (o) {
        if (o !== d && (o.st === 'chase' || o.st === 'alert' || o.st === 'tug' || o.st === 'tugGo')) { o.st = 'follow'; o.t = 0; o.pose = 'stand'; }
      });
      if (person.st === 'walk') personIdle();
    }
    // 球刚被丢出去：醒着的狗都去追
    function onBallFree() {
      ball.freeT = 0; ball.owner = null; ball.fly = null;
      endScene(false, 'ball');
      dogs.forEach(function (d) {
        if (!awake(d) || d.hidden || d.carried) return;
        if (d.st === 'eat' && d.kind === 'gold') return;      // 金毛吃饭的时候不去追（小腊肠会去，回来接着吃）
        if (d.kind === 'gold' && d.energy < 0.3) {   // 金毛累了，趴着看
          if (!(d.st === 'pose' && d.pose === 'lie')) setPose(d, 'lie', 12);
          d.pant = true; d.wag = 0.6;
          return;
        }
        d.st = 'alert'; d.t = 0; d.pose = 'alert'; d.wag = 0.9; d.pant = false; d.happy = 0;
        d.react = d.kind === 'dax' ? rand(0.04, 0.16) : rand(0.22, 0.5);
      });
      if (awake(dax) && !dax.hidden) emote('bang', dax, 0, 0.7);
    }
    function landing() {
      var disc = ball.vz * ball.vz + 2 * GRAV * Math.max(0, ball.z - BALL_R);
      var t = (ball.vz + Math.sqrt(disc)) / GRAV;
      return { x: clamp(ball.x + ball.vx * t * 1.12, F.x0 + BALL_R + 2, F.x1 - BALL_R - 2), y: clamp(ball.y + ball.vy * t * 1.12, F.y0, F.y1) };
    }

    function updateDog(d, dt) {
      var K = d.K;
      d.t += dt;
      if (d.hype > 0) { d.hype -= dt; if (d.hype <= 0) { d.happy = 0; } }
      if (d.bark > 0) d.bark -= dt;
      if (d.land > 0) d.land = Math.max(0, d.land - dt * 4);
      // 跳
      if (d.z > 0) {
        d.vz -= GRAV * 1.5 * dt; d.z += d.vz * dt;
        if (d.z <= 0) { d.z = 0; d.vz = 0; d.land = 1; if (!d.hidden) puff(d.x, d.y, false); }
      }
      // 金毛体力
      if (d.kind === 'gold' && d.st !== 'chase') {
        d.energy = Math.min(1, d.energy + dt * (d.pose === 'lie' || d.pose === 'sleep' ? 0.03 : 0.012));
      }
      if (d.hidden) { d.vx = d.vy = 0; d.sp = 0; d.pose = 'sleep'; return; }

      if (d.carried) {
        d.vx = d.vy = 0;
      } else if (d.att) {
        d.vx = d.vy = 0;                    // 安在别人身上：位置由 placeAttached 管
        if (d.pose === 'sleep' && now > d.zAt) { emote(Math.random() < 0.5 ? 'z' : 'zs', d, d.face * 8, 1.8); d.zAt = now + 1.7; }
      } else if (d.scene) {
        var c = d.cmd;
        d.noTurn = !!(c && c.back);
        if (c && c.k === 'go') { d.pose = c.pose; if (drive(d, c.x, c.y, c.spd, dt)) c.done = true; }
        else if (c && c.k === 'follow') {
          d.pose = c.pose || 'stand';
          drive(d, c.target.x - (c.target.face || 0) * c.back, c.target.y + c.dy, c.spd, dt);
        }
        else if (c && c.k === 'track') { var tp = trackPt(d, c); d.pose = c.pose || 'stand'; if (tp) drive(d, tp.x, tp.y, c.spd, dt); else coast(d, dt); }
        else coast(d, dt);
        if (d.pose === 'sleep' && now > d.zAt) { emote(Math.random() < 0.5 ? 'z' : 'zs', d, d.face * 8, 1.8); d.zAt = now + 1.7; }
        if (d.pose === 'dig' && Math.random() < dt * 14) bits(d.x + d.face * 10, d.y - 1, 1, ['#8a6a4a', '#6f5238', '#a98a62'], 26, 60);
        if (d.pose === 'roll' && opt.grass && Math.random() < dt * 6) bits(d.x + rand(-8, 8), d.y - 2, 1, grassBits(), 18, 40);
        // 自己找事做的时候：站到小人 / 另一只狗的正后方被挡住了，就先不演了，挪到旁边去
        if (d.scene && d.scene.kind === 'solo' && !d.cmd && d.pose !== 'sleep' && d.t > 0.5 && d.z === 0 && now > d.sideAt && now >= d.scene.commitTo) {
          var blk0 = blocker(d);
          if (blk0) { d.sideAt = now + 2.5; endScript(d.scene, true, 'blocked'); sidestep(d, blk0); }
        }
      } else switch (d.st) {
        case 'idle':
          coast(d, dt);
          think(d);
          break;

        case 'eat':      // 饭碗还在：接着吃（见"照料"那一节）
          eatStep(d, dt);
          break;

        case 'pose':
          coast(d, dt);
          if (d.pose === 'sleep') {
            if (now > d.zAt) { emote(Math.random() < 0.5 ? 'z' : 'zs', d, d.face * 8, 1.8); d.zAt = now + 1.7; }
            if (d.t > d.dur) { if (sleepyTime()) d.t = 0; else think(d); }
          } else {
            if (d.pose === 'dig' && Math.random() < dt * 14) bits(d.x + d.face * 10, d.y - 1, 1, ['#8a6a4a', '#6f5238', '#a98a62'], 26, 60);
            if (d.pose === 'roll' && opt.grass && Math.random() < dt * 6) bits(d.x + rand(-8, 8), d.y - 2, 1, grassBits(), 18, 40);
            var blk = (d.t > 0.5 && d.z === 0 && now > d.sideAt) ? blocker(d) : null;
            if (blk) { d.sideAt = now + 2.5; sidestep(d, blk); break; }
            if (d.t > d.dur) think(d);
          }
          break;

        case 'walk':
          if (drive(d, d.tx, d.ty, d.spd, dt) || d.t > 14) think(d);
          break;

        case 'zoom':
          d.pant = true;
          if (!d.way || !d.way.length || d.t > 12) { think(d); break; }
          if (drive(d, d.way[0].x, d.way[0].y, spd(d, 'run'), dt)) d.way.shift();
          break;

        case 'spin':
          coast(d, dt);
          d.face = (Math.floor(d.t * 9) % 2) ? 1 : -1;
          if (d.t > 1.3) { setPose(d, 'sit', rand(1.5, 3)); d.wag = 0.8; emote('q', d, 0, 0.8); }
          break;

        case 'bfly': {   // 追蝴蝶
          if (!bfly.on || d.t > 9) { setPose(d, 'sit', rand(1.5, 3)); d.pant = true; break; }
          var by = opt.roam ? clamp(bfly.y + 16, F.y0, F.y1) : d.y;
          drive(d, bfly.x - sgn(bfly.x - d.x) * 6, by, spd(d, 'run') * 0.8, dt);
          d.look = 0.8;
          if (hyp(bfly.x - d.x, (bfly.y + 16) - d.y) < 20 && d.z === 0 && now > d.hopAt) {
            hop(d, 150); d.hopAt = now + rand(0.7, 1.2); d.bark = 0.25;
            bfly.vx += sgn(bfly.x - d.x || 1) * 50; bfly.vy -= 40; bfly.tx = rand(F.x0 + 20, F.x1 - 20); bfly.ty = rand(Math.max(12, F.y0 - 40), F.y1 - 30);

        case 'home': {  // 回岛

          else if (d.hq && (d.t > 0.22)) { d.hq = false; d.hidden = true; d.z = 0; d.vz = 0; puff(d.x, d.y - 20, true); emoteAt('spark', d.x, d.y - 30, 0.5); }

    // ------------------------------------------------------------
    //  眼神：每个角色看哪儿。剧本说了就听剧本的（S.look）；没说就引擎自己挑：
    //  球在飞 / 在她手里 → 球；在戏里 → 一起演的那一个；她的鼠标停在旁边 → 鼠标；隔一阵 → 看看她（camera）

    function lookPt(a, t) {
      if (!t) return null;
      if (t === 'ball') { lookTmp.x = ball.x; lookTmp.y = ball.y - ball.z; return lookTmp; }
      if (t === 'cursor') { if (!cur.known) return null; lookTmp.x = cur.x; lookTmp.y = cur.y; return lookTmp; }
      if (t === 'camera') { lookTmp.x = a.x + a.face * 0.01; lookTmp.y = a.y - a.z - (a.isPerson ? P_H * 0.8 : 14) - 0.01; lookTmp.cam = true; return lookTmp; }
      if (t.isProp) { var w = PROP.where(t); lookTmp.x = w.x; lookTmp.y = w.y - w.z - 2; return lookTmp; }
      if (t === person) { lookTmp.x = t.x; lookTmp.y = t.y - t.z - P_H * 0.8; return lookTmp; }
      if (t.K) { lookTmp.x = t.x + t.face * (t.mx || 10) * 0.7; lookTmp.y = (t.top || t.y - 12) + 4; return lookTmp; }

      return null;

    // 把目标点变成骨架要的 [往旁边多远, 多高]（相对脚下），朝着上一回的值慢慢转过去

    function layerOf(a, k) { var o = a.ov && a.o; return o && o[k] !== undefined && o[k] !== null ? o[k] : a[k]; }

    // ------------------------------------------------------------
    //  小人
    // ------------------------------------------------------------

    // 小人闲着：隔一阵挑一个自己的小动作（solo：走两步、转过来、整理领带、看手表……都在 scenes/ 里）；也有时候就只是站着。
    // 一个 solo 都没登记的时候用下面原来那一套
    function personThink() {

        person.msgAt = now + range(CFG.messageMinutes, 40) * 60;
        personWave(String(pick(CFG.messages)));
        return;
      }
      // 登记的小动作多（十几个以上）：他几乎不干站着，隔 3-7 秒就找点事做；少的时候照老样子，一半时间站着
      if (SOLO.person.length > 12) { person.next = now + rand(3, 7) / LIVELY; if (r >= 0.2) pickSolo(person); return; }
      if (SOLO.person.length) { if (r >= 0.44) pickSolo(person); return; }

    function throwDir() { return person.x < (F.x0 + F.x1) / 2 ? 1 : -1; }

    function startSession(n, target) {

    function personThrow() {

    // 狗把球叼回来了

<script>// 球球 · 戏包：照料（喂饭、喝水、上厕所、收拾）
