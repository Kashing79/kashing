      yield 0.5;
    },
  });

  // ============================================================
  //  D10 周末野餐：小腊肠半个身子钻进篮子里
  // ============================================================
  add({ name: 'weekend_picnic', zh: '周末野餐', cast: 'man dax gold', weight: 6, tag: 'calm', mood: 'tender', timeout: 50,
    when: function (S) {
      var wk = S.cfg.weekend || [6, 0], wd = S.time.wd, h = S.time.h;
      if (wk.indexOf(wd) < 0 || h < 11 || h >= 14 || !S.her.present) return false;
      // 一个周末只野餐一次：记下这个周末的星期六是哪天
      var sat = new Date(S.time.ms - ((wd + 1) % 7) * 86400000), key = sat.getFullYear() + '-' + (sat.getMonth() + 1) + '-' + sat.getDate();
      return S.mem.get('picnic') !== key && (!S.cursor.known || S.cursor.speed < 80);
    },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, F = S.field, i;
      var wd = S.time.wd, sat = new Date(S.time.ms - ((wd + 1) % 7) * 86400000);
      S.mem.set('picnic', sat.getFullYear() + '-' + (sat.getMonth() + 1) + '-' + sat.getDate());
      S.ball.pocket();
      var p = lowPt(S, S.cursor.known && Math.abs(S.cursor.x - man.x) < 120 ? (S.cursor.x < (F.x0 + F.x1) / 2 ? F.x1 - 120 : F.x0 + 120) : man.x);
      yield S.go(man, p, 24, null, 8);
      var f = man.face;
      // 1. 从口袋里拉出一块格子野餐布，往前一抖：布飘下来铺好（布是平铺在地上的一块：它的近边就在他们脚后面，画在他们底下）
      //    小腊肠正好从布底下钻过去，从另一头冒出来
      S.hold(man, ['p_pocket', 'p_hold']); S.item(man, S.hasFx('blanket_folded') ? 'blanket_folded' : null);
      yield 0.6;
      S.item(man, null); S.hold(man, ['p_reach', 'p_cheer']); S.face(man, 'grin');
      var by = man.y + 3, bx = cx(S, man.x + f * 16, 30);
      // 布用"草地上的小印子"来画（画在所有角色底下，平平地铺在地上）；戏一完（包括被打断）就收走，见 end
      S.puff(bx, by - 8, true);
      picnicBlanket = S.decal('blanket', bx, by, { overlay: true });
      yield S.go(dax, cx(S, bx + f * 40), man.y + S.ry(3), S.spd(dax, 'run'), null, 2);
      S.emote('spark', dax, 0, 0.5);
      // 2. 他在布边上坐下，放下一只小篮子，给自己倒一杯茶
      S.hold(man, 'p_sit'); S.face(man, 'soft');
      var bk = S.prop.spawn('basket', '', cx(S, man.x + f * 13), man.y + 0.3, {});
      yield 0.6;
      S.item(man, 'cup');
      yield 0.8;
      // 3. 金毛在布的另一头趴下，很有礼貌地看别处，又看看篮子；小腊肠的前半截已经钻进篮子里了，尾巴摇个不停
      yield S.go(gold, cx(S, man.x + f * 36), man.y + S.ry(-7), S.spd(gold, 'walk') * 1.4, null, 4);
      gold.face = -f; S.hold(gold, 'lie'); S.look(gold, { x: gold.x + f * 40, y: gold.y, z: 10 });
      var q = S.prop.where(bk);
      yield S.go(dax, cx(S, q.x + f * (dax.half - 4)), man.y + 0.6, S.spd(dax, 'trot'), null, 3);
      dax.face = -f; S.hold(dax, 'sniff'); dax.wag = 1;
      S.clip(dax, f > 0 ? [q.x + 1, -9999, 99999, 99999] : [-99999, -9999, q.x - 1 + 99999, 99999]);
      yield 1.2;
      S.look(gold, bk);
      yield 1.0;
      S.look(gold, { x: gold.x + f * 40, y: gold.y, z: 10 });
      yield 1.2;
      // 4. 他把它从中间拎出来放好，一只一块饼干——金毛先，因为它乖
      S.clip(dax, null); S.item(man, null);
      S.hold(man, 'p_sit'); S.face(man, 'laugh');
      yield S.slide(dax, f * 8, 0, 0.4);
      S.hold(dax, 'sit');
      S.toss('bone', { x: man.x, y: man.y, z: 12 }, gold, 0.4, 10);
      yield 0.45;
      S.emote('heart', gold, 0, 0.8);
      S.toss('bone', { x: man.x, y: man.y, z: 12 }, dax, 0.4, 10);
      yield 0.45;
      S.emote('heart', dax, 0, 0.8);
      // 5. 三个都朝同一个方向坐着；安安静静，偶尔一个音符
      S.faceTo(dax, { x: man.x + f * 100 }); S.hold(dax, 'sit'); S.hold(gold, 'sit'); gold.face = f;
      S.item(man, 'cup'); S.face(man, 'soft'); S.look(man, { x: man.x + f * 100, y: man.y, z: 20 });
      for (i = 0; i < 3; i++) { yield S.rand(2, 2.8); S.emote(i === 1 ? 'hs' : 'note', S.pick([man, gold, dax]), 0, 1.0); }
      // 6. 叠起野餐布（小腊肠骑在布卷上一秒钟），全都收回口袋，一颗小星星
      S.item(man, null); S.hold(man, null);
      yield 0.4;
      S.prop.remove(bk, true);
      if (picnicBlanket) { S.decalRemove(picnicBlanket); picnicBlanket = S.decal('blanket_edge', bx, by, { overlay: true }); }
      yield 0.6;
      if (picnicBlanket) { S.decalRemove(picnicBlanket); picnicBlanket = null; }
      S.puff(bx, by - 6, false);
      if (S.hasFx('blanket_folded')) S.item(man, 'blanket_folded');
      yield 0.4;
      S.item(man, null);
      S.hold(man, ['p_pocket', 'p_hold']); S.emote('spark', man, 0, 0.6);
      yield 0.8;
      S.hold(man, null);
    },
    end: function (S) { if (picnicBlanket) { S.decalRemove(picnicBlanket); picnicBlanket = null; } },
  });

  // ============================================================
  //  D11 撕日历：离见面又近了一天，被他撕下来、被小腊肠撕碎
  // ============================================================
  add({ name: 'tear_the_page', zh: '撕日历', cast: 'man dax gold', weight: 6, cap: 1, tag: 'calm', mood: 'proud', hours: [[6, 14]],
    when: function (S) { var n = S.reunion(); return n !== null && n > 0 && S.her.present; },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, n = S.reunion(), mile = [100, 50, 30, 10, 3].indexOf(n) >= 0, s = man.face;
      S.ball.pocket();
      // 1. 从口袋里拿出一本小小的撕页日历，举起来看
      S.hold(man, ['p_pocket', 'p_hold']); S.item(man, 'calendar');
      yield 0.6;
      S.hold(man, ['p_gaze', 'p_hold']); S.face(man, 'focus');
      yield 0.9;
      // 2. 潇洒地撕下最上面一页：那一页左右飘着落下来
      S.hold(man, ['p_show', 'p_hold']); S.face(man, 'grin');
      var h = S.hand();
      var sh = S.prop.spawn('calendar', 'sheet', cx(S, h.x + s * 4), man.y + S.ry(2), { z: h.z + 4, shadow: false });
      var t0 = S.t(), x0 = sh.x;
      yield S.each(0.9, function (t) { S.prop.move(sh, cx(S, x0 + s * t * 18 + Math.sin(t * 9) * 4), man.y + S.ry(2), Math.max(6, h.z + 4 - t * 22)); });
      // 3. 小腊肠一跳，半空中叼住，叼着它跑一圈胜利圈；金毛看看那页纸，再看看他
      S.faceTo(dax, sh); dax.wag = 1;
      var w = S.prop.where(sh);
      yield S.go(dax, S.beside(dax, { x: w.x, y: w.y, half: 3, mx: 3 }, 0), S.spd(dax, 'run'), null, 2);
      S.hop(dax, 125);
      yield 0.25;
      S.prop.carry(sh, dax, 'mouth');
      S.look(gold, dax);
      yield S.orbit(dax, { x: dax.x - s * 20, y: dax.y }, 26, 10, 1, S.spd(dax, 'run') * 0.7);
      S.look(gold, man);
      S.prop.remove(sh, false); S.bits(dax.x + dax.face * dax.mx, dax.y, 5, ['#ffffff', '#f7f5e9', '#d0353f'], 14, 26);
      // 4. 他看看新的一页，点点头，放回贴着心口的口袋；一颗小心。（里程碑：举高日历，两只都跳起来，一串星星）
      S.hold(man, ['p_gaze', 'p_hold']); S.face(man, 'soft');
      yield 0.8;
      if (mile) {
        S.hold(man, ['p_cheer', 'p_cheer2']); S.face(man, 'grin');
        S.hop(dax, 110); S.hop(gold, 70);
        S.bits(man.x, man.y - 30, 8, 'spark', 26, 40);
        yield 1.0;
      }
      S.act(man, 'proud_nod', 0.8);
      S.hold(man, ['p_pocket', 'p_hold']); S.item(man, null); S.emote('hs', man, 0, 1.0);
      yield 0.8;
      S.hold(man, null);
    },
  });

  // ============================================================
  //  D12 见面前一天：坐在岛下面等（狗会在窗口等它爱的人；这三个在等那个日子）
  // ============================================================
  add({ name: 'waiting_at_the_window', zh: '见面前一天：坐在岛下面等', cast: 'dax gold man', weight: 8, cap: 3, cool: 10800, tag: 'calm', mood: 'tender', timeout: 70,
    when: function (S) {
      var n = S.reunion(), I = S.island();
      return (n === 1 || (n === 0 && !S.mem.get('reunionDone'))) && !!(I && I.on && S.roam) && S.her.present;
    },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, man = S.man, I = S.island(), F = S.field, i;
      if (!I) return;
      S.ball.pocket();
      // 1. 两只走到岛底下（倒数就显示在那儿），并排坐好往上看；金毛稳稳的，尾巴像节拍器；小腊肠坐下、站起、又坐下
      var a = S.go(dax, I.x + 12, I.y + 6, S.spd(dax, 'trot'), null, 8);
      var b = S.go(gold, I.x - 18, I.y + 4, S.spd(gold, 'walk') * 1.5, null, 8);
      yield S.all(a, b);
      S.hold(dax, 'sit'); S.hold(gold, 'sit'); dax.look = 1; gold.look = 1; gold.wag = 0.5;
      yield 0.8;
      S.hold(dax, 'stand');
      yield 0.5;
      S.hold(dax, 'sit');
      // 2. 小腊肠小声哼了一下，扒在金毛肩膀上想看得更高
      S.emote('note', dax, 0, 0.8);
      S.faceTo(dax, gold); S.hold(dax, ['rear', 'beg']); S.rig(dax, { pawAt: [dax.face * 10, 16] });
      yield 1.6;
      // 3. 金毛低头看它一眼，又抬头看那个数字。他背着手走到它们后面，也抬头看
      S.look(gold, dax);
      yield 0.6;
      S.look(gold, null); gold.look = 1;
      S.rig(dax, null); S.hold(dax, 'sit'); dax.look = 1;
      yield S.go(man, I.x - 2, cy(S, I.y), 22, ['p_behind', 'p_walk0'], 6);
      S.hold(man, ['p_behind', 'p_idle']); S.look(man, { x: I.x, y: I.y, z: 60 }); S.face(man, 'soft');
      // 4. 三个一动不动地抬头看；每过一阵子小腊肠跑到近的那边屏幕边上看看"门"，再跑回来
      var end = S.t() + S.rand(30, 45);
      while (S.t() < end) {
        yield 12;
        if (S.t() >= end) break;
        var ex = dax.x < (F.x0 + F.x1) / 2 ? F.x0 + 20 : F.x1 - 20;
        S.hold(dax, 'stand'); dax.look = 0;
        yield S.go(dax, ex, dax.y, S.spd(dax, 'trot'), null, 4);
        S.look(dax, { x: ex + (ex < I.x ? -40 : 40), y: dax.y, z: 10 });
        yield 0.8;
        S.look(dax, null);
        yield S.go(dax, I.x + 12, I.y + 6, S.spd(dax, 'trot'), null, 4);
        S.hold(dax, 'sit'); dax.look = 1;
      }
      S.hold(man, null);
    },
  });

  // ============================================================
  //  D13 纪念日：把礼物送到她鼠标边（金毛天生就是干这个的：把东西轻轻地送到人手里）
  // ============================================================
  function giftOf(kind) { return kind === 'birthday' ? 'cake' : (kind === 'anniversary' ? 'flower' : (kind === 'note' ? 'envelope' : 'gift')); }
  add({ name: 'special_delivery', zh: '纪念日：把礼物送到她鼠标边', kind: 'react', on: 'date', cast: 'man gold dax', tag: 'calm', mood: 'proud', keep: 300, timeout: 70,
    when: function (S, ev) { return !!ev && ev.kind !== 'reunion' && !!S.cursor.known; },
    run: function* (S, ev) {
      var man = S.man, gold = S.gold, dax = S.dax, kind = ev.kind || 'gift', g = giftOf(kind), courier = g === 'envelope' ? dax : gold, other = courier === gold ? dax : gold;
      var spr = g === 'cake' ? (S.hasFx('cake_lit') ? 'cake' : null) : (g === 'gift' ? 'gift' : g), state = g === 'cake' ? 'lit' : (g === 'gift' ? 'wrapped' : '');
      S.ball.pocket();
      // 1. 从西装内袋里拿出礼物，弯腰递给送信的那只（蛋糕他自己端）
      S.hold(man, ['p_pocket', 'p_hold']);
      yield 0.5;
      var box = S.prop.spawn(g, state, man.x, man.y, { hot: false });
      S.prop.carry(box, man, g === 'cake' ? 'arms' : 'hand');
      S.face(man, 'smile');
      if (courier !== null && g !== 'cake') {
        yield S.go(courier, S.atHand(courier), S.spd(courier, 'trot'), null, 5);
        S.faceTo(courier, man); S.faceTo(man, courier);
        S.hold(man, ['p_place', 'p_crouch']);
        yield 0.5;
        // 2. 它用最轻的嘴接过去，尾巴转成螺旋桨；另一只头上多了一个蝴蝶结
        S.prop.carry(box, courier, 'mouth'); S.rig(courier, { jaw: 0.3 }); courier.wag = 1;
        if (S.hasFx('ribbon')) { var rb = S.prop.spawn('ribbon', '', other.x, other.y, { shadow: false }); S.prop.carry(rb, other, 'headTop'); }
        S.hold(man, null);
        yield 0.6;
      } else {
        S.hold(man, ['p_carry', 'p_hold']);
      }
      // 3. 小心翼翼地横穿屏幕送到她鼠标下面；另一只在旁边护送
      var carrier = g === 'cake' ? man : courier;
      var to = S.toCursor(carrier, 16) || { x: carrier.x, y: carrier.y };
      S.follow(other, carrier, other.half + 14, S.ry(3), S.spd(other, 'walk') * 1.3);
      yield S.go(carrier, to, carrier === man ? 18 : S.spd(carrier, 'walk') * 1.2, carrier === man ? ['p_carry', 'p_hold'] : null, 12);
      S.stop(other);
      // 4. 坐下，把礼物放在她鼠标下面 30 的地方，用鼻子往前拱一下，往后退；另一只坐好作揖
      S.faceTo(carrier, 'cursor');
      var c30 = S.below(30) || { x: carrier.x, y: carrier.y };
      if (carrier !== man) S.hold(carrier, 'sit'); else S.hold(man, ['p_place', 'p_crouch']);
      yield 0.4;
      S.prop.drop(box, cx(S, carrier.x + carrier.face * ((carrier.mx || 6) + 4)), c30.y);
      S.rig(carrier, null);
      if (carrier !== man) { yield S.act(carrier, 'nudge', 0.6); yield S.slide(carrier, -carrier.face * 8, 0, 0.6); }
      else { S.hold(man, null); yield S.go(man, cx(S, man.x - man.face * 20), man.y, 20, null, 2); }
      S.faceTo(other, 'cursor'); S.hold(other, ['beg', 'sit']);
      S.prop.hot(box, { dwell: 0.2 });
      // 5. 都看看礼物，再看看她。她点（或者在蛋糕上一扫：吹蜡烛）——丝带弹开 / 火苗一歪灭了；心和星星；狗狗蹦；他挥手（纪念日鞠躬），说那天写好的话
      note.gift = 0;
      S.look(gold, box); S.look(dax, box);
      var t0 = S.t();
      yield S.until(function () { if (S.t() - t0 > 1.5) { S.look(gold, 'cursor'); S.look(dax, 'cursor'); } return note.gift === 1; }, 30);
      if (note.gift === 1) {
        note.gift = 0;
        var w = S.prop.where(box);
        if (g === 'cake') { S.prop.set(box, 'bent'); yield 0.3; S.prop.set(box, 'out'); S.emoteAt('wisp', w.x, w.y - 12, 1.0); }
        else if (g === 'gift') S.prop.set(box, 'open');
        S.emoteAt('heart', w.x - 6, w.y - 16, 1.2); S.emoteAt('spark', w.x + 6, w.y - 14, 0.8);
        S.bits(w.x, w.y - 6, 8, 'heart', 22, 40);
        S.hold(gold, 'stand'); S.hold(dax, 'stand'); S.hop(dax, 110); S.hop(gold, 70); gold.wag = 1; dax.wag = 1;
        S.look(man, 'camera');
        S.hold(man, kind === 'anniversary' ? ['p_bow', 'p_front'] : { f: ['p_wave_a', 'p_wave_b'], fps: 5 }); S.face(man, 'blush');
        if (ev.line) S.sayText(ev.line);
        yield 2.0;
        S.prop.hot(box, false);
        S.mem.set('giftDue', null);
        yield 1.0;
        return;
      }
      // 6. 她没点：金毛趴下，把礼物护在两只前爪中间，安安静静地等一会儿（不催）；
      //    还是没点：他把礼物收回口袋——晚上再送一次（屏幕上不留东西）
      S.hold(gold, 'lie'); S.rig(gold, { chin: true }); S.look(gold, 'cursor');
      var w2 = S.prop.where(box);
      if (gold.x !== undefined) yield S.go(gold, S.beside(gold, { x: w2.x, y: w2.y, half: 4, mx: 4 }, -4), S.spd(gold, 'walk'), null, 3);
      S.hold(gold, 'lie'); S.rig(gold, { chin: true });
      yield S.until(function () { return note.gift === 1; }, 20);
      if (note.gift === 1) {
        note.gift = 0;
        S.prop.set(box, g === 'cake' ? 'out' : (g === 'gift' ? 'open' : ''));
        S.emoteAt('heart', w2.x, w2.y - 16, 1.2); S.bits(w2.x, w2.y - 6, 8, 'heart', 22, 40);
        S.rig(gold, null); S.hold(gold, 'stand'); gold.wag = 1; S.look(man, 'camera'); S.face(man, 'blush');
        if (ev.line) S.sayText(ev.line);
        S.mem.set('giftDue', null);
        yield 1.6;
        return;
      }
      S.rig(gold, null); S.hold(gold, 'stand');
      yield S.go(man, S.beside(man, { x: w2.x, y: w2.y, half: 4, mx: 4 }, 2), 24, null, 4);
      S.hold(man, ['p_place', 'p_crouch']);
      yield 0.5;
      S.prop.remove(box, false); S.hold(man, ['p_pocket', 'p_hold']); S.emote('spark', man, 0, 0.5);
      if (!S.mem.get('giftDue') || S.mem.get('giftDue').day !== S.time.ymd) S.mem.set('giftDue', { day: S.time.ymd, kind: kind, line: ev.line || '' });
      else S.mem.set('giftDue', null);
      yield 0.6;
    },
    end: function () { note.gift = 0; },
  });
  // 白天没打开的礼物：晚上再送一次（只送这一次）
  add({ name: 'special_delivery_evening', zh: '纪念日：晚上再送一次礼物', cast: 'man gold dax', weight: 8, cap: 1, tag: 'calm', mood: 'proud', timeout: 70,
    when: function (S) { var d = S.mem.get('giftDue'); return !!d && d.day === S.time.ymd && S.time.h >= 19 && !S.night() && !!S.cursor.known && S.her.present; },
    run: function* (S) {
      var d = S.mem.get('giftDue');
      S.mem.set('giftDue', { day: '', kind: '', line: '' });
      var def = null;
      for (var i = 0; i < L.length; i++) if (L[i].name === 'special_delivery') def = L[i];
      if (def) yield* def.run(S, { name: 'date', kind: d.kind, line: d.line, days: 0 });
      S.mem.set('giftDue', null);
    },
  });
  // 礼物 / 蛋糕 / 花被点了（或者在蛋糕上扫了一下）：告诉正在演的那一段；那一段已经演完了的话，就在这里打开。
  // 只是叠在他身上的小反应（overlay）：不抢演员，不打断正在演的戏
  add({ name: 'gift_opened', zh: '她打开了礼物', kind: 'react', on: ['click', 'sweep'], cast: 'man', overlay: true, tag: 'hers', mood: 'proud', timeout: 6,
    when: function (S, ev) { var k = ev && ev.kind; return !!ev.prop && (k === 'gift' || k === 'cake' || k === 'flower' || k === 'envelope' || k === 'bouquet'); },
    run: function* (S, ev) {
      var p = ev && ev.prop;
      if (!p) return;
      if (p.kind === 'bouquet' && S.playing('reunion_day')) { note.bouquet = 2; return; }
      if (S.playing('special_delivery')) { note.gift = 1; return; }
      var w = S.prop.where(p);
      if (p.kind === 'cake') { S.prop.set(p, 'out'); S.emoteAt('wisp', w.x, w.y - 12, 1.0); }
      else if (p.kind === 'gift') S.prop.set(p, 'open');
      S.emoteAt('heart', w.x, w.y - 16, 1.2); S.bits(w.x, w.y - 6, 6, 'heart', 18, 34);
      S.look(S.man, 'camera'); S.face(S.man, 'blush');
      S.prop.hot(p, false); p.cap = Math.max(1, (S.now() - p.born) + 20);
      yield 1.4;
    },
  });

  // ============================================================
  //  D14 见面那天（那块一直在看的表，终于收进口袋）
  // ============================================================
  add({ name: 'reunion_day', zh: '见面那天', kind: 'react', on: 'date', cast: 'man dax gold', tag: 'calm', mood: 'proud', keep: 300, timeout: 60,
    when: function (S, ev) { return !!ev && ev.kind === 'reunion' && ev.days === 0 && S.mem.get('reunionDone') !== S.time.ymd; },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, F = S.field, i;
      S.mem.set('reunionDone', S.time.ymd);
      S.ball.pocket();
      // 1. 岛鼓一下；两只狗戴着蝴蝶结冲出来，各自全速跑一整圈
      S.pulse('bulge');
      if (S.hasFx('ribbon')) {
        var r1 = S.prop.spawn('ribbon', '', dax.x, dax.y, { shadow: false }); S.prop.carry(r1, dax, 'headTop');
        var r2 = S.prop.spawn('ribbon', '', gold.x, gold.y, { shadow: false }); S.prop.carry(r2, gold, 'headTop');
      }
      var mid = { x: (F.x0 + F.x1) / 2, y: (F.y0 + F.y1) / 2 }, rx = (F.x1 - F.x0) / 2 - 40, ryy = (F.y1 - F.y0) / 2 - 10;
      var a = S.orbit(dax, mid, rx, ryy, 1, S.spd(dax, 'run'));
      var b = S.orbit(gold, mid, rx * 0.8, ryy * 0.8, 1, S.spd(gold, 'run') * 0.8);
      // 2. 他拿着一束花；最后看一次表，摘下来收进口袋：不用再数了
      S.item(man, 'bouquet'); S.hold(man, 'p_hold'); S.face(man, 'proud');
      yield 0.8;
      S.hold(man, 'p_watch'); S.face(man, 'soft');
      yield 1.0;
      S.hold(man, ['p_pocket', 'p_hold']); S.face(man, 'grin');
      yield 0.8;
      // 3. 走到下面正中间，正对着她，鞠一躬，双手把花递出来
      yield S.go(man, lowPt(S, (F.x0 + F.x1) / 2), 26, null, 8);
      S.hold(man, ['p_offer', 'p_front']); S.look(man, 'camera'); S.face(man, 'blush');
      yield S.any(S.all(a, b), 4);
      S.stop(dax); S.stop(gold);
      yield S.go(dax, cx(S, man.x + 30), man.y + S.ry(4), S.spd(dax, 'trot'), null, 4);
      yield S.go(gold, cx(S, man.x - 36), man.y + S.ry(2), S.spd(gold, 'trot'), null, 4);
      S.faceTo(dax, man); S.faceTo(gold, man); S.hold(dax, 'sit'); S.hold(gold, 'sit');
      // 4. 他弯腰把花轻轻放在她面前的草地上（她可以点）。她点了：花瓣和星星；三个各冒一颗心；他说那句话
      S.hold(man, ['p_place', 'p_crouch']);
      yield 0.5;
      S.item(man, null);
      var bq = S.prop.spawn('bouquet', '', cx(S, man.x + man.face * 10), cy(S, man.y + S.ry(6)), { hot: { dwell: 0.15 } });
      S.hold(man, ['p_offer', 'p_front']); S.look(man, 'camera'); S.face(man, 'blush');
      note.bouquet = 1;
      yield S.until(function () { return note.bouquet === 2 || !S.prop.alive(bq); }, 25);
      var clicked = note.bouquet === 2;
      note.bouquet = 0;
      S.prop.hot(bq, false);
      if (clicked) {
        var w = S.prop.where(bq);
        S.bits(w.x, w.y - 4, 10, ['#ff99aa', '#ffc2cc', '#ff5c85'], 26, 34);
        S.emoteAt('spark', w.x, w.y - 10, 0.8);
        S.emote('heart', man, 0, 1.2);
        yield 0.3;
        S.emote('heart', dax, 0, 1.2);
        yield 0.3;
        S.emote('heart', gold, 0, 1.2);
        S.say('reunion', ['終於等到今天了', '终于等到今天了', 'Today, at last']);
        yield 0.6;
      }
      S.prop.remove(bq, true);
      // 5. 狗狗围着他跳；他把小腊肠高高举起来，金毛扑在他身上；下面半个屏幕飘彩纸
      S.item(man, null);
      S.hold(dax, 'stand'); S.hold(gold, 'stand'); dax.wag = 1; gold.wag = 1;
      yield S.go(dax, S.manAt(dax, 8), S.spd(dax, 'trot'), null, 2);
      S.hold(man, ['p_reach', 'p_cheer']); S.face(man, 'laugh');
      S.attach(dax, man, 'hand', 0, 2, false, 1); S.hold(dax, ['held', 'stand']); S.rig(dax, { stiff: true });
      yield S.go(gold, cx(S, man.x - man.face * 14), man.y + S.ry(1), S.spd(gold, 'trot'), null, 2);
      S.faceTo(gold, man); S.hold(gold, ['rear', 'beg']); S.rig(gold, { pawAt: [gold.face * 6, 22] });
      var conf = ['#ff5c85', '#ffd342', '#67adeb', '#8fd16a', '#ffffff'];
      for (i = 0; i < 8; i++) {
        S.bits(S.rand(F.x0 + 20, F.x1 - 20), F.y1 - (F.y1 - F.y0) * S.rand(0.3, 0.5), 5, conf, 20, 10);
        yield 0.6;
      }
      S.rig(dax, null); S.detach(dax, 40); S.rig(gold, null); S.hold(gold, 'stand');
      S.hold(man, null);
      yield 0.8;
    },
    end: function () { note.bouquet = 0; },
  });
})(typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : this));
</script>
<script>// 球球 · 浏览器外壳
//
// 玩法在 pet.js 里（它不碰网页）。这个文件负责网页这一头的事：
//   · 一张画布：每一帧问引擎"现在该画什么"，照着清单一张一张贴上去
//   · 鼠标 / 手指事件、网址里的选项（?scale= roam= grass= auto= entrance= res=）
//   · 小人说话的气泡、屏幕顶上的岛（island.js）、预览 / 手机版用的草地
// 手机网页版、在线预览、直接用浏览器打开 index.html，用的都是这一份。
(function () {
  'use strict';

  var CFG = window.PET_CONFIG || {};
  var QS = new URLSearchParams(location.search);
  // 旧版的 Mac 外壳把网页放在一个网页视图里；第三版的 Mac 外壳不用网页了，这几行只是让旧外壳也还能用
  var NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet);
  function send(o) { try { window.webkit.messageHandlers.pet.postMessage(JSON.stringify(o)); } catch (e) {} }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var cfg = Object.assign({}, CFG);
  if (QS.has('roam')) cfg.roam = QS.get('roam') !== '0';
  if (QS.has('grass')) cfg.grass = QS.get('grass') !== '0';
  if (QS.has('res')) cfg.res = parseInt(QS.get('res'), 10) || 2;
  cfg.auto = QS.get('auto') !== '0';
  cfg.entrance = QS.get('entrance') !== '0';
  cfg.lawnTap = !NATIVE;            // 浏览器里点空地 = 往那儿丢球；Mac 上"空地"是她的桌面，不归我们管
  // 小人说话用哪种文字：设定里没写就看浏览器的语言（繁体 / 简体 / 英文）
  if (!cfg.lang) {
    var nl = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    cfg.lang = /^zh-(tw|hk|mo|hant)/.test(nl) ? 'hant' : (/^zh/.test(nl) || !nl ? 'hans' : 'en');
  }
  if (QS.has('lang')) cfg.lang = QS.get('lang');

  var R = clamp(Math.round(+cfg.res) || 2, 1, 4);      // 一个世界单位画成几个像素
  var grass = !!cfg.grass;
  var optScale = parseInt(QS.get('scale') || '0', 10) || 0;   // 0 = 自动
  var optInsets = null;      // Mac 外壳告诉我们：菜单栏、程序坞各占多少
  var paused = false;
  var lastInput = performance.now(), lastSense = 0;     // 她上一次碰键盘 / 鼠标是什么时候（告诉引擎"她在不在"）

  var canvas = document.getElementById('stage');
  if (!canvas) { canvas = document.createElement('canvas'); canvas.id = 'stage'; document.body.appendChild(canvas); }
  var ctx = canvas.getContext('2d');
  var bubbleLayer = document.getElementById('bubbles');

  var S = 3;                 // 一个世界单位放大成几个 CSS 像素
  var LW = 300, LH = 110;    // 画面的大小（世界单位）
  var offX = 0, offY = 0;    // 画布左上角在页面里的位置（CSS 像素）
  var last = null;           // 上一帧的清单

  // ------------------------------------------------------------
  //  引擎
  // ------------------------------------------------------------
  var ISL = window.PET_ISLAND || null;
  var eng = window.PET_ENGINE.create({
    now: function () { return performance.now() / 1000; },
    storage: {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    },
    haptic: function (k) { if (NATIVE) send({ t: 'haptic', k: k }); },
    log: function (m) { if (window.console) console.error('[pet] ' + m); },      // 画图的文件出了错
    island: ISL ? {
      center: function () { return ((ISL.center ? ISL.center() : window.innerWidth / 2) - offX) / S; },
      visible: function () { return !ISL.visible || ISL.visible(); },
      // 把谁拎到岛上（或者岛附近）放下
      hit: function (x, y) {
        var ir = ISL.rects ? ISL.rects() : null, px = x * S + offX, py = y * S + offY;
        return !!(ir && ir.length >= 4 && px >= ir[0] - 12 && px <= ir[0] + ir[2] + 12 && py <= ir[1] + ir[3] + 30);
      },
    } : null,
  }, cfg);

  // ------------------------------------------------------------
  //  版面
  // ------------------------------------------------------------
  var probe = null;
  function cssInsets() {
    var ex = CFG.insets || {};
    if (optInsets) return optInsets;
    if (!probe) {
      probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
        'padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
      document.body.appendChild(probe);
    }
    var cs = getComputedStyle(probe);
    return {
      top: (parseFloat(cs.paddingTop) || 0) + (ex.top || 0), right: (parseFloat(cs.paddingRight) || 0) + (ex.right || 0),
      bottom: (parseFloat(cs.paddingBottom) || 0) + (ex.bottom || 0), left: (parseFloat(cs.paddingLeft) || 0) + (ex.left || 0),
    };
  }
  function layout() {
    var box = canvas.parentElement || document.body;
    var vw = box.clientWidth || window.innerWidth, vh = box.clientHeight || window.innerHeight;
    var autoS = typeof CFG.autoScale === 'function' ? CFG.autoScale(vw, vh) : 0;
    S = optScale || autoS || (vw < 520 ? 2 : (vw < 1150 ? 3 : 4));
    LW = Math.max(150, Math.floor(vw / S));
    LH = Math.max(70, Math.floor(vh / S));
    // 画布里一格是一个像素（LW*R × LH*R），再整体放大到 LW*S × LH*S
    canvas.width = LW * R; canvas.height = LH * R;
    canvas.style.width = (LW * S) + 'px';
    canvas.style.height = (LH * S) + 'px';
    var rect = canvas.getBoundingClientRect();
    offX = rect.left; offY = rect.top;
    ctx.imageSmoothingEnabled = false;
    var ins = cssInsets();
    eng.configure({ view: { w: LW, h: LH }, insets: { top: ins.top / S, bottom: ins.bottom / S, left: ins.left / S, right: ins.right / S } });
    if (grass) makeLawn();
  }

  // ------------------------------------------------------------
  //  把一张图（一块 RGBA 像素）变成可以直接贴的小画布；像素没变就一直用同一张。
  //  有名字（key）的图内容不会变，按名字记；没名字的（三个角色）按 ver 看变没变
  // ------------------------------------------------------------
  var byKey = {}, byImg = new WeakMap();
  function canvasOf(im) {
    var c = im.key ? byKey[im.key] : byImg.get(im);
    if (!c) {
      c = { cv: document.createElement('canvas'), cx: null, id: null, ver: -1 };
      c.cx = c.cv.getContext('2d');
      if (im.key) byKey[im.key] = c; else byImg.set(im, c);
    }
    if (c.cv.width !== im.w || c.cv.height !== im.h) { c.cv.width = im.w; c.cv.height = im.h; c.id = null; c.ver = -1; }
    if (c.ver === -1 || (!im.key && c.ver !== im.ver)) {
      if (!c.id) c.id = c.cx.createImageData(im.w, im.h);
      c.id.data.set(im.data);
      c.cx.putImageData(c.id, 0, 0);
      c.ver = im.key ? 1 : (im.ver == null ? -1 : im.ver);
    }
    return c.cv;
  }
  // 照着清单画：位置对齐到像素；图自己的精细度和画布不一样时（比如旧图），照比例放大，不抹匀
  function paint(c, items, RR) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i], im = it.img, cv = canvasOf(im), k = RR / (im.scale || 1);
      var x = Math.round(it.x * RR), y = Math.round(it.y * RR), w = im.w * k, h = im.h * k;
      var cl = it.clip;
      if (cl) {       // 只画这一块里面的部分（屏幕上的一个矩形，世界单位）
        c.save(); c.beginPath();
        c.rect(Math.round(cl[0] * RR), Math.round(cl[1] * RR), Math.round(cl[2] * RR), Math.round(cl[3] * RR));
        c.clip();
      }
      if (it.a < 1) c.globalAlpha = it.a;
      if (it.flip) {       // 左右镜像
        c.setTransform(-1, 0, 0, 1, x + w, y);
        c.drawImage(cv, 0, 0, w, h);
        c.setTransform(1, 0, 0, 1, 0, 0);
      } else if (k === 1) c.drawImage(cv, x, y);
      else c.drawImage(cv, x, y, w, h);
      if (it.a < 1) c.globalAlpha = 1;
      if (cl) c.restore();
    }
  }

  // ------------------------------------------------------------
  //  草地（手机版 / 预览用；Mac 上草地是桌面上另一个窗口）
  // ------------------------------------------------------------
  var lawn = null, lawnKey = '';
  function makeLawn() {
    var ph = eng.status().phase, key = LW + 'x' + LH + ph + '@' + R;
    if (key === lawnKey) return;
    lawnKey = key;
    var L = window.PET_LAWN;
    var im = (L && L.render) ? L.render(LW, LH, ph, R, { mode: 'full' }) : oldLawn(LW, LH, ph);
    if (!lawn) lawn = document.createElement('canvas');
    lawn.width = im.w; lawn.height = im.h;
    var c = lawn.getContext('2d'), id = c.createImageData(im.w, im.h);
    id.data.set(im.data);
    c.putImageData(id, 0, 0);
  }
  // 没有 lawn.js 时的旧草地：一条深一条浅的底色，上面撒草丛和小花（一个世界单位一个像素）
  function oldLawn(w, h, ph) {
    var P = { day: ['#8fca78', '#84c06e', '#9ad584', '#77b363', '#ffffff', '#ffe27a', '#ff9fc0'],
              dusk: ['#86b96e', '#7bae65', '#94c57c', '#6c9f59', '#fff1dc', '#ffd07a', '#ff9aa8'],
              night: ['#2f5a45', '#2a5340', '#37664f', '#234737', '#b9d6c9', '#c9c27a', '#b98aa6'] }[ph];
    var d = new Uint8ClampedArray(w * h * 4), seed = 1234567;
    function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
    function rect(col, x0, y0, rw, rh) {
      var r = parseInt(col.substr(1, 2), 16), g = parseInt(col.substr(3, 2), 16), b = parseInt(col.substr(5, 2), 16);
      for (var y = Math.max(0, y0); y < Math.min(h, y0 + rh); y++) {
        for (var x = Math.max(0, x0); x < Math.min(w, x0 + rw); x++) { var o = (y * w + x) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255; }
      }
    }
    rect(P[0], 0, 0, w, h);
    // 一条深一条浅，像刚割过的草坪
    for (var y = 0; y < h; y += 26) rect(P[1], 0, y + 13, w, 13);
    // 草丛
    var n = Math.round(w * h / 260), i, x, yy, k, col;
    for (i = 0; i < n; i++) {
      x = Math.floor(rnd() * w); yy = Math.floor(rnd() * h); k = rnd();
      col = k < 0.5 ? P[2] : P[3];
      rect(col, x, yy, 1, 2); rect(col, x + 2, yy + 1, 1, 1);
      if (k > 0.8) rect(col, x - 1, yy + 1, 1, 1);
    }
    // 小花
    n = Math.round(w * h / 2600);
    for (i = 0; i < n; i++) {
      x = Math.floor(rnd() * w); yy = Math.floor(rnd() * h);
      col = P[4 + Math.floor(rnd() * 3)];
      rect(col, x, yy, 1, 1); rect(col, x - 1, yy + 1, 3, 1); rect(col, x, yy + 2, 1, 1);
      rect(P[5], x, yy + 1, 1, 1);
    }
    return { w: w, h: h, data: d, scale: 1, ox: 0, oy: 0, key: null, ver: 1 };
  }

  // ------------------------------------------------------------
  //  小人说话的气泡
  // ------------------------------------------------------------
  var bub = null;            // { el, id }
  function placeBubble(b) {
    if (!bubbleLayer) return;
    if (bub && (!b || b.id !== bub.id)) {
      var old = bub.el; bub = null;
      if (b) old.remove();                // 换了一句：旧的马上拿掉
      else { old.classList.remove('on'); setTimeout(function () { old.remove(); }, 400); }
    }
    if (!b) return;
    if (!bub) {
      var el = document.createElement('div');
      el.className = 'bubble';
      el.textContent = b.text;
      bubbleLayer.appendChild(el);
      bub = { el: el, id: b.id };
      requestAnimationFrame(function () { el.classList.add('on'); });
    }
    var lr = bubbleLayer.getBoundingClientRect();
    bub.el.style.left = clamp(b.x * S + offX - lr.left, 130, Math.max(130, lr.width - 130)) + 'px';
    bub.el.style.top = (b.y * S + offY - lr.top - 14) + 'px';
  }

  // ------------------------------------------------------------
  //  画
  // ------------------------------------------------------------
  function draw() {
    var fr = eng.compose();
    last = fr;
    if (grass && lawn) ctx.drawImage(lawn, 0, 0, LW * R, LH * R); else ctx.clearRect(0, 0, LW * R, LH * R);
    // 草地上的小印子（花、小土堆……）：有草地的时候画在草地上；没草地时只画说了 overlay 的
    if (fr.decals && fr.decals.length) paint(ctx, grass ? fr.decals : fr.decals.filter(function (d) { return d.overlay; }), R);
    paint(ctx, fr.items, R);
    drawIsland();
    placeBubble(fr.bubble);
  }
  // 告诉岛现在的状态；在岛里睡觉的时候，把它们画到岛上的小画布里
  function drawIsland() {
    if (!ISL) return;
    var cv = ISL.canvas ? ISL.canvas() : null;
    if (ISL.state) ISL.state(eng.status());
    if (!cv) return;
    var d = eng.den(R), w = Math.round(d.w * R), h = Math.round(d.h * R);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    var c = cv.getContext('2d');
    c.clearRect(0, 0, w, h);
    c.imageSmoothingEnabled = false;
    paint(c, d.items, R);
  }

  // 告诉旧版 Mac 外壳：现在哪些地方是"可以点的"（其余地方鼠标直接穿过去）
  var lastPost = 0, lastMsg = '';
  function post() {
    if (!NATIVE || !last) return;
    var rects = [], hot = last.hot, i;
    for (i = 0; i < hot.length; i++) {
      rects.push(Math.round(hot[i][0] * S + offX), Math.round(hot[i][1] * S + offY), Math.round(hot[i][2] * S), Math.round(hot[i][3] * S));
    }
    if (ISL && ISL.rects) { var ir = ISL.rects(); for (i = 0; i < ir.length; i++) rects.push(Math.round(ir[i])); }
    var msg = JSON.stringify({ t: 'hot', r: rects, d: eng.status().drag ? 1 : 0 });
    if (msg === lastMsg) return;
    lastMsg = msg;
    try { window.webkit.messageHandlers.pet.postMessage(msg); } catch (e) {}
  }

  // ------------------------------------------------------------
  //  主循环
  // ------------------------------------------------------------
  var lastMs = 0, raf = 0, tmo = 0, MINF = 1000 / 36;
  function frame(ms) {
    raf = 0;
    if (paused) return;
    if (lastMs && ms - lastMs < MINF - 2) { raf = requestAnimationFrame(frame); return; }   // 最多每秒画三十几次
    var dt = lastMs ? (ms - lastMs) / 1000 : 0.016;
    lastMs = ms;
    dt = clamp(dt, 0, 0.25);
    var n = Math.max(1, Math.ceil(dt / (1 / 60)));
    // 告诉引擎她多久没碰键盘鼠标了（一秒说一次就够）
    if (eng.sense && ms - lastSense > 1000) { lastSense = ms; eng.sense({ idle: Math.max(0, (performance.now() - lastInput) / 1000) }); }
    for (var i = 0; i < n; i++) eng.step(dt / n);
    draw();
    if (ms - lastPost > 80) { lastPost = ms; post(); }
    schedule();
  }
  function schedule() {
    if (raf || tmo || paused) return;
    // 没事的时候慢一点画，省电；都在岛里睡觉时每秒只画两次
    var b = eng.busy();
    if (b === 2) raf = requestAnimationFrame(frame);
    else tmo = setTimeout(function () { tmo = 0; if (!raf && !paused) raf = requestAnimationFrame(frame); }, b === 1 ? 40 : (eng.status().home === 'in' ? 450 : 80));
  }
  // 她碰了一下 / 按了按钮：别等慢速的那一拍，马上画
  function kick() {
    if (tmo) { clearTimeout(tmo); tmo = 0; }
    if (!raf && !paused) raf = requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------
  //  对外接口（灵动岛、测试脚本、旧版 Mac 外壳会调用这些）
  // ------------------------------------------------------------
  var down = false;          // 手指 / 鼠标是不是按着（按在岛上的不算）
  window.pet = {
    configure: function (o) {
      if (!o) return;
      var relayout = false, redraw = false, e = {};
      if (typeof o.auto === 'boolean') e.auto = o.auto;
      if (typeof o.scale === 'number' && o.scale !== optScale) { optScale = o.scale; relayout = true; }
      if (typeof o.roam === 'boolean') { e.roam = o.roam; redraw = true; }
      if (o.insets) { optInsets = o.insets; relayout = true; }
      if (typeof o.soft === 'boolean') { MINF = 1000 / (o.soft ? 20 : 36); e.soft = o.soft; }   // 不用显卡画的时候少画几帧，省一点电
      if (typeof o.grass === 'boolean' && o.grass !== grass) { grass = o.grass; e.grass = grass; lawnKey = ''; if (grass) makeLawn(); redraw = true; }
      if (typeof o.res === 'number' && clamp(Math.round(o.res) || 2, 1, 4) !== R) { R = clamp(Math.round(o.res) || 2, 1, 4); e.res = R; relayout = true; }
      eng.configure(e);
      if (relayout) layout();
      if (relayout || redraw) draw();
      if (typeof o.paused === 'boolean') {
        paused = o.paused;
        if (!o.paused) { lastMs = 0; schedule(); }
      }
    },
    command: function (name) { eng.command(name); kick(); },
    sense: function (o) { if (eng.sense) eng.sense(o); },
    // type: down | move | up | hover | leave ；坐标是页面里的 CSS 像素
    pointer: function (type, x, y) {
      // 手里正拖着球 / 拎着谁的时候，岛先不要展开挡住视线
      if (ISL && ISL.pointer && !eng.status().drag && ISL.pointer(type, x, y)) { schedule(); return; }
      if (type === 'down') down = true; else if (type === 'up') down = false;
      if (type !== 'leave') lastInput = performance.now();
      eng.pointer(type, (x - offX) / S, (y - offY) / S);
      if (type === 'down' || type === 'up') { post(); kick(); } else schedule();
    },
    status: function () { return eng.status(); },
    // 给测试用
    _t: {
      step: function (dt) { eng.step(dt); },
      draw: draw,
      state: function () { var s = eng._t.state(); s.S = S; return s; },
      boxes: function () { var b = eng._t.boxes(); b.S = S; b.offX = offX; b.offY = offY; return b; },
      set: eng._t.set,
      scene: eng._t.scene,
      endScene: eng._t.endScene,
      perf: eng._t.perf,
      list: eng._t.list,
      raise: eng._t.raise,
      events: eng._t.events,
      props: eng._t.props,
      sceneErrors: eng._t.sceneErrors,
      care: eng._t.care,
      ends: eng._t.ends,
      beats: eng._t.beats,
      stuck: eng._t.stuck,
      engine: eng,
    },
  };

  // 浏览器 / 手机：直接用网页自己的鼠标 / 触摸事件
  if (!NATIVE) {
    window.addEventListener('pointerdown', function (e) { window.pet.pointer('down', e.clientX, e.clientY); if (e.cancelable) e.preventDefault(); });
    window.addEventListener('pointermove', function (e) { window.pet.pointer(down ? 'move' : 'hover', e.clientX, e.clientY); });
    window.addEventListener('pointerup', function () { window.pet.pointer('up', 0, 0); });
    window.addEventListener('pointercancel', function () { window.pet.pointer('up', 0, 0); });
    document.addEventListener('mouseleave', function () { window.pet.pointer('leave', 0, 0); });
  }
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function () { lastInput = performance.now(); });
  // 改变大小会清空画布，所以马上重画一次，免得闪一下空白
  window.addEventListener('resize', function () { layout(); draw(); schedule(); });
  setInterval(function () { if (grass) { makeLawn(); schedule(); } }, 5 * 60 * 1000);

  layout();
  // 引擎有喂饭那一套的时候，岛上多一个"喂饭"按钮（没有就藏着）
  (function () {
    var fb = document.getElementById('isl-feed'), st = eng.status();
    if (!fb || !st.care) return;
    var nl = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    fb.textContent = /^zh-(tw|hk|mo|hant)/.test(nl) ? '餵飯' : (/^zh/.test(nl) ? '喂饭' : 'Feed');
    fb.classList.remove('off');
    if (fb.parentElement) fb.parentElement.classList.add('five');
  })();

  schedule();

  // 画布到底能不能用：画一块红色再读回来。读不回来 = 这台机器上显卡画布是坏的，
  // 告诉旧版 Mac 外壳换一种画法重新载入。
  function canvasOK() {
    try {
      var t = document.createElement('canvas'); t.width = 96; t.height = 64;
      var x = t.getContext('2d'); x.fillStyle = '#f00'; x.fillRect(0, 0, 96, 64);
      var d = x.getImageData(20, 20, 1, 1).data;
      return d[3] === 255 && d[0] > 200;
    } catch (e) { return false; }
  }
  if (NATIVE) send({ t: 'ready', canvas: canvasOK() });
})();
</script>
<script>
// 页面底色、状态栏的颜色，跟着草地这个时段的颜色走（草地换了新画法以后，和原来写死的绿色不一样了）
(function () {
  function tint() {
    var L = window.PET_LAWN;
    if (!L || !L.palette || !window.pet) return;
    var p = L.palette(window.pet.status().phase);
    if (!p || !p.base) return;
    document.documentElement.style.setProperty('--grass', p.base);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', p.base);
  }
  tint(); setInterval(tint, 5 * 60 * 1000);
})();
</script>
</body>
