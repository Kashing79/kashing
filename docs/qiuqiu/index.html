  // ============================================================
  add({ name: 'sorry_bow', zh: '撞到了，马上鞠躬赔礼', cast: 'dax gold', weight: 1, cool: 300, mood: 'playful', tag: 'lively', timeout: 14,
    when: function (S) { return awake2(S) && S.gold.energy > 0.3; },
    run: function* (S) {
      var dax = S.dax, gold = S.gold;
      yield S.stage(gold);
      S.hold(gold, 'stand'); gold.wag = 0.4;
      // 金毛屁股朝着小腊肠，小腊肠从后面冲过去
      var s = dax.x < gold.x ? -1 : 1;
      if (!room(S, gold.x, s, gold.half + 80)) s = -s;
      if (!room(S, gold.x, -s, gold.half + 50)) return;
      gold.face = -s;
      var y = gold.y + S.ry(3);
      yield S.go(dax, at(S, gold.x + s * (gold.half + 70), y, dax), 'trot', null, 5);
      S.faceTo(dax, gold); dax.wag = 1; dax.pant = true;
      yield 0.2;
      var rump = gold.x + s * gold.half * 0.55;
      S.go(dax, at(S, gold.x - s * (gold.half + 80), y, dax), 'run', null, 4);
      yield S.until(function () { return (dax.x - rump) * s <= 0; }, 3);
      // 0-0.6 秒：蹭到了后腿
      S.puff(rump, gold.y + 1, false);
      S.hop(gold, 60); S.slide(gold, s * 3, S.ry(-4), 0.3);
      S.rig(gold, { lookBack: true }); S.emote('bang', gold, 0, 0.7);
      yield 0.3;
      // 0.6-1.4 秒：刹车（一大团灰），掉头，马上伏下身子：对不起！还玩吗？
      S.stop(dax); S.puff(dax.x + dax.face * 8, dax.y, true);
      yield 0.25;
      S.faceTo(dax, gold); S.hold(dax, 'bow'); S.look(dax, gold); dax.wag = 1;
      yield 0.6;
      // 1.4-2.2 秒：金毛耳朵一软，打个"玩耍喷嚏"，也伏下来
      S.rig(gold, null); S.faceTo(gold, dax); S.mood(gold, 'happy');
      S.act(gold, 'sneeze', 0.6);
      yield 0.2;
      achoo(S, gold);
      yield 0.35;
      S.hold(gold, 'bow'); gold.wag = 0.9;
      yield 0.6;
      // 2.2-4 秒：一起蹦起来跑开，金毛追 1.5 秒就散了
      var away = at(S, dax.x + (dax.x >= gold.x ? 1 : -1) * 70, dax.y + S.ry(S.rand(-18, 18)), dax);
      S.hold(dax, 'stand'); S.hold(gold, 'stand'); S.mood(gold, null);
      var c = S.go(dax, away, 'run', null, 3);
      S.follow(gold, dax, 16, S.ry(2), S.spd(gold, 'run') * 0.8);
      yield 1.5;
      S.stop(gold); S.hold(gold, 'stand'); gold.pant = true;
      yield c;
      S.hold(dax, 'stand'); dax.pant = true;
      yield 0.4;
    },
  });

  // ============================================================
  //  A02 从大狗肚子底下钻过去
  // ============================================================
  add({ name: 'tunnel_run', zh: '从大狗肚子底下钻过去', cast: 'dax gold', weight: 2, cool: 600, mood: 'mischievous', tag: 'lively', timeout: 14,
    when: function (S) { return awake2(S) && S.dist(S.dax, S.gold) < 160; },
    run: function* (S) {
      var dax = S.dax, gold = S.gold;
      yield S.stage(gold);
      S.hold(gold, 'stand'); gold.wag = 0.3;
      var s = dax.x < gold.x ? -1 : 1;
      if (!room(S, gold.x, s, 80)) s = -s;
      if (!room(S, gold.x, s, 70) || !room(S, gold.x, -s, 70)) return;
      var y = gold.y + S.ry(-1);           // 在金毛身后一点点：金毛近处的腿画在它前面
      yield S.go(dax, at(S, gold.x + s * 72, y, dax), 'trot', null, 5);
      S.faceTo(dax, gold); dax.wag = 1; dax.pant = true;
      yield 0.25;
      // 第一趟：低着头，从前后腿中间冲过去
      dax.look = -0.6;
      var c = S.go(dax, at(S, gold.x - s * 70, y, dax), 'run', null, 3);
      yield S.until(function () { return (dax.x - gold.x) * s <= 0; }, 2);
      S.hold(gold, 'alert'); S.rig(gold, { pawUp: true }); gold.look = -0.8;
      yield c;
      dax.look = 0;
      // 金毛低头往肚子底下看，再回头看
      S.rig(gold, { pawUp: true, lookBack: true }); gold.look = 0;
      yield S.go(dax, at(S, gold.x - s * 86, cy(S, y + S.ry(22)), dax), 'run', null, 2);
      S.rig(gold, null); S.faceTo(gold, dax); S.hold(gold, 'stand');
      yield S.go(dax, at(S, gold.x - s * 66, y, dax), 'run', null, 2);
      // 第二趟，反过来：金毛吓得四脚一蹦
      dax.look = -0.6;
      var stopX = gold.x + s * (gold.mx + dax.mx + 16);
      c = S.go(dax, at(S, stopX, y, dax), 'run', null, 3);
      yield S.until(function () { return (dax.x - gold.x) * s >= 0; }, 2);
      S.hop(gold, 70); S.emote('bang', gold, 0, 0.7);
      yield c;
      dax.look = 0;
      S.puff(dax.x + dax.face * 8, dax.y, true);
      // 金毛冲着出口伏下身子；小腊肠掉头，鼻子对鼻子
      S.faceTo(gold, dax); S.hold(gold, 'bow'); gold.wag = 0.9;
      S.faceTo(dax, gold); S.hold(dax, 'stand');
      yield S.slide(dax, -s * 8, 0, 0.25);
      S.hold(dax, 'bow'); dax.wag = 1; S.look(dax, gold); S.look(gold, dax);
      yield 0.5;                                          // 定住，只有尾巴在动
      // 小腊肠一蹦，散开追一秒
      S.hold(dax, 'stand'); S.hold(gold, 'stand'); S.hop(dax, 110);
      yield 0.3;
      c = S.go(dax, at(S, dax.x + s * 60, dax.y + S.ry(S.rand(-16, 16)), dax), 'run', null, 2);
      S.follow(gold, dax, 18, 0, S.spd(gold, 'trot') * 1.3);
      yield 1.0;
      S.stop(gold); S.hold(gold, 'stand'); gold.pant = true;
      yield c;
      dax.pant = true;
      yield 0.3;
    },
  });

  // ============================================================
  //  A03 绕着大狗疯跑，突然定格
  // ============================================================
  add({ name: 'orbit_and_freeze', zh: '绕着大狗疯跑，突然定格', cast: 'dax gold', weight: 2, cool: 360, mood: 'playful', tag: 'lively', timeout: 18,
    when: function (S) { return awake2(S); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold;
      yield S.stage(gold);
      if (!room(S, gold.x, 1, 50) || !room(S, gold.x, -1, 50)) return;
      S.hold(gold, 'lie'); gold.wag = 0.4;
      var c = { x: gold.x, y: gold.y }, rx = 38, ryy = S.ry(15), dir = dax.x < gold.x ? 1 : -1;
      yield S.go(dax, at(S, c.x + (dax.x < c.x ? -rx : rx), c.y, dax), 'run', null, 3);
      // 0-3 秒：一圈一圈地跑，金毛的头跟着转（看网球的人）
      S.look(gold, dax); dax.wag = 1; dax.pant = true;
      var T = ring(S, dax, c, rx, ryy, 2.2, 'run', dir);
      yield T * 0.45;
      S.emote('dizzy', gold, 0, 1.0);
      yield T * 0.55;
      // 3-3.4 秒：金毛两只前爪往前一拍，正好拦在它的路上
      S.faceTo(gold, dax); S.hold(gold, 'bow');
      S.puff(gold.x + gold.face * gold.half, gold.y, false);
      S.stop(dax); S.puff(dax.x + dax.face * 8, dax.y, true);
      // 3.4-4.2 秒：刹住，伏下来对着金毛；眼对眼，只有尾巴在动
      yield 0.2;
      S.faceTo(dax, gold); S.hold(dax, 'bow'); S.look(dax, gold); gold.wag = 0.8;
      yield 0.8;
      // 4.2-6 秒：炸开！小腊肠反着跑，金毛蹦起来颠颠地追半圈，追不上就算了
      S.hold(dax, 'stand'); S.hold(gold, 'stand');
      T = ring(S, dax, c, rx, ryy, 1.5, 'run', -dir);
      S.follow(gold, dax, 18, 0, S.spd(gold, 'trot') * 1.2);
      yield T * 0.4;
      S.stop(gold); S.hold(gold, 'stand'); gold.pant = true; S.look(gold, dax);
      yield T * 0.6;
      S.stop(dax);
      // 6-7 秒：金毛甩甩毛、叹口气趴下；小腊肠青蛙趴，喘
      S.hold(dax, 'lie'); dax.pant = true; S.look(dax, gold);
      yield S.act(gold, ['shakeoff', 'shake_off'], 1.8);
      S.hold(gold, 'lie'); sigh(S, gold);
      yield 1.2;
    },
  });

  // ============================================================
  //  A04 大尾巴逗小狗
  // ============================================================
  add({ name: 'tail_toy', zh: '大尾巴逗小狗', cast: 'dax gold', weight: 3, cool: 480, mood: 'mischievous', tag: 'calm', timeout: 16,
    when: function (S) { return awake2(S) && S.dist(S.dax, S.gold) < 150; },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, i;
      yield S.stage(gold);
      var s = dax.x < gold.x ? -1 : 1;                  // 小腊肠在哪边：金毛的尾巴朝那边
      if (!room(S, gold.x, s, gold.half + 60)) s = -s;
      if (!room(S, gold.x, s, gold.half + 50)) return;
      gold.face = -s; S.hold(gold, 'lie'); gold.wag = 0.6;
      yield 0.5;
      var tip = S.anchor(gold, 'tailTip');
      // 0-1.5 秒：走到尾巴尖后面，盯着它看：左、右、左
      yield S.go(dax, at(S, tip.x + s * (16 + dax.mx), gold.y + S.ry(1), dax), 'trot', null, 5);
      S.faceTo(dax, gold); dax.wag = 0.2;
      for (i = 0; i < 3; i++) {
        tip = S.anchor(gold, 'tailTip');
        S.look(dax, { x: tip.x + (i % 2 ? 4 : -4), y: gold.y, z: tip.z });
        yield 0.3;
      }
      S.look(dax, null);
      S.hold(dax, 'stalk'); S.rig(dax, { wiggle: 1 }); S.mood(dax, 'focused');
      yield 0.55;
      // 1.5-2.2 秒：扑！落地趴下，两只前爪按在尾巴尖上
      S.rig(dax, null); S.hold(dax, 'stand'); S.hop(dax, 100);
      yield S.slide(dax, -s * 12, 0, 0.35);
      S.hold(dax, 'bow'); S.rig(dax, { pawAt: [dax.mx * 0.6, 0] });
      yield 0.5;
      // 2.2-3.2 秒：金毛回头看，冒个问号，把尾巴竖起来；小腊肠跳两下，够不着
      S.rig(gold, { lookBack: true, tailSet: 80 }); S.emote('q', gold, 0, 0.9);
      S.rig(dax, null); S.hold(dax, 'stand'); dax.look = 0.8; S.mood(dax, null);
      yield 0.25;
      S.hop(dax, 90); dax.wag = 1;
      yield 0.45;
      S.hop(dax, 90);
      yield 0.45;
      // 3.2-4.5 秒：尾巴"啪"地落下来，正好拍在它头顶
      S.rig(gold, { lookBack: true, tailSet: -20 });
      yield 0.15;
      S.emote('spark', dax, 0, 0.5); S.rig(dax, { ears: 1 }); dax.look = 0;
      yield 0.35;
      S.rig(dax, null);
      S.act(dax, 'sneeze', 0.6);
      yield 0.15;
      achoo(S, dax);
      yield 0.5;
      // 4.5-6.5 秒：一口叼住尾巴上的长毛，被尾巴甩得左右晃；金毛一甩就甩开了
      S.rig(gold, { lookBack: true }); gold.wag = 1;
      S.rig(dax, { jaw: 0.4 });
      S.track(dax, function () { var t = S.anchor(gold, 'tailTip'); return { x: t.x + s * dax.mx, y: dax.y }; }, 'trot', 'tug');
      yield 0.9;
      S.stop(dax); S.rig(dax, null); S.hold(dax, 'stand');
      tip = S.anchor(gold, 'tailTip');
      S.bits(tip.x, tip.y - tip.z, 3, 'fur', 14, 30);
      yield 0.15;
      dax.face = -dax.face;
      yield 0.2;
      dax.face = -dax.face;
      yield 0.15;
      S.hold(dax, 'bow'); dax.wag = 1;
      S.act(gold, 'nudge', 0.6);
      S.emote('heart', dax, 0, 1.1);
      yield 1.0;
      S.rig(gold, null); gold.wag = 0.5;
      yield 0.3;
    },
  });

  // ============================================================
  //  A05 大狗趴下来，让你赢
  // ============================================================
  add({ name: 'down_to_your_level', zh: '大狗趴下来，让你赢', cast: 'dax gold', weight: function (S) { return S.gold.energy < 0.45 ? 5 : 3; },
    cool: 480, mood: 'tender', tag: 'calm', timeout: 22,
    when: function (S) { return awake2(S); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, hopAt = 0;
      yield S.stage(gold);
      S.faceTo(gold, dax);
      if (!room(S, gold.x, gold.face, gold.mx + 70)) gold.face = -gold.face;
      // 0-1 秒：小腊肠在金毛脸前 12 处伏下身子，叫一声；金毛不站起来，反而趴下，前爪伸向它
      yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + 12 + dax.mx), gold.y + S.ry(1), dax), 'trot', null, 5);
      S.faceTo(dax, gold); S.hold(dax, 'bow'); dax.wag = 1; woof(S, dax);
      S.hold(gold, 'lie'); gold.wag = 0.7; S.rig(gold, { pawAt: [gold.mx * 0.7, 1] });
      yield 0.5;
      S.hop(dax, 40);
      yield 0.5;
      // 1-4 秒：张着嘴"过招"：两个头绕着对方画 8 字，小腊肠前半身一蹦一蹦，前爪拍了两下金毛的嘴
      S.rig(gold, { jaw: 0.5 });
      yield S.each(3, function (t) {
        var a = mouth(S, gold), b = mouth(S, dax);
        S.look(dax, { x: a.x + Math.sin(t * 9.4) * 4, y: gold.y, z: a.z + Math.sin(t * 18.8) * 2.5 });
        S.look(gold, { x: b.x + Math.sin(t * 5) * 4, y: dax.y, z: b.z + Math.sin(t * 10) * 2.5 });
        var tap = (t > 0.9 && t < 1.2) || (t > 2.0 && t < 2.3);
        S.rig(dax, { jaw: 0.5, pawAt: tap ? [dax.mx + 3, 7] : null });
        if (t - hopAt > 0.6 && dax.z === 0) { hopAt = t; S.hop(dax, 40); }
      });
      // 4-5 秒：叼住一口耳朵毛往后拽；金毛的头被拽过去一点，眯着眼乐
      S.look(dax, null); S.look(gold, null);
      S.hold(dax, 'tug'); S.rig(dax, { jaw: 0.6 }); S.rig(gold, { eyes: 'happy', jaw: 0.3 }); grr(S, dax);
      yield S.slide(dax, -dax.face * 3, 0, 0.8);
      // 5-6.5 秒：金毛干脆翻过来肚皮朝天；小腊肠立起来两只前爪按在它胸口，尾巴竖得笔直，叫一声：我赢了
      S.rig(gold, null); S.hold(gold, 'roll'); gold.happy = 1; gold.wag = 0.8;
      S.rig(dax, null); S.hold(dax, 'rear'); S.rig(dax, { pawAt: [dax.mx * 0.7, 9], tailSet: 75 }); S.mood(dax, 'proud');
      yield 0.4;
      woof(S, dax);
      yield 1.1;
      // 6.5-8 秒：一只大爪子轻轻一拨：小腊肠也翻过去，并排在地上扭
      S.rig(gold, { pawAt: [12, 8] });
      yield 0.35;
      S.rig(dax, null); S.mood(dax, null); S.hold(dax, 'roll'); dax.happy = 1;
      yield S.slide(dax, -dax.face * 5, 0, 0.3);
      S.rig(gold, null);
      yield 1.1;
      // 8-9 秒：都翻起来趴着，喘
      S.hold(gold, 'lie'); S.hold(dax, 'lie'); dax.pant = true; gold.pant = true; dax.happy = 0; gold.happy = 0;
      yield 1.0;
      // 三成：鼻子对鼻子愣 0.4 秒，然后接着你追我赶
      if (gold.energy >= 0.45 && S.chance(0.3)) {
        S.hold(gold, 'stand'); S.hold(dax, 'stand'); S.look(dax, gold); S.look(gold, dax);
        yield 0.4;
        yield* S.run('chase');
      }
    },
  });

  // ============================================================
  //  A06 拔河，大狗故意放水（要有绳子：岛里掉出来的，或者地上剩下的；都没有就在场地边上找到一根）
  // ============================================================
  add({ name: 'tug_let_win', zh: '拔河，大狗故意放水', cast: 'dax gold', weight: function (S) { return S.prop.find('rope') ? 4 : 2; },
    cool: 720, mood: 'proud', tag: 'calm', family: 'tug', timeout: 24,
    when: function (S) { var r = S.prop.find('rope'); return awake2(S) && (!r || !r.holder); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, rope = toy(S, 'rope', dax), i, sc;
      yield S.stage(gold);
      // 先叼上绳子
      var w = S.prop.where(rope);
      yield S.go(dax, S.beside(dax, w, 5), 'run', null, 5);
      S.faceTo(dax, rope); S.hold(dax, 'sniff');
      yield 0.3;
      carryToy(S, rope, dax); dax.wag = 1;
      // 0-1 秒：叼着绳子跑到金毛跟前，拿绳子甩它的前腿，伏下来：来呀
      var s = dax.x < gold.x ? -1 : 1;
      if (!room(S, gold.x, s, 60)) s = -s;
      S.faceTo(gold, { x: gold.x + s });
      yield S.go(dax, at(S, gold.x + s * (gold.mx + dax.mx + 6), gold.y + S.ry(1), dax), 'run', null, 5);
      S.faceTo(dax, gold); rope.face = dax.face; S.hold(dax, 'stand'); S.rig(dax, { shake: 1 });
      yield 0.5;
      S.rig(dax, null); S.hold(dax, 'bow');
      yield 0.5;
      // 1-2 秒：金毛趴下，轻轻叼住另一头：绳子在两张嘴中间拉直
      S.hold(gold, 'lie'); S.rig(gold, { jaw: 0.4 }); S.faceTo(gold, dax);
      yield 0.6;
      S.hold(dax, 'tug'); dax.wag = 0.9;
      yield S.slide(dax, s * 4, 0, 0.3);
      dropToy(S, rope);
      sc = S.each(function () {          // 每一步：绳子挂在两张嘴中间
        if (!S.prop.alive(rope) || rope.holder) return;
        var a = mouth(S, gold), b = mouth(S, dax);
        S.prop.move(rope, (a.x + b.x) / 2, (gold.y + dax.y) / 2, Math.max(1, (a.z + b.z) / 2 - 2));
      });
      // 2-5 秒：小腊肠使劲拽：身子压低、后脚刨地，0.4 秒猛地一拽，一秒低吼一下；金毛的头只让一点点
      for (i = 0; i < 7; i++) {
        S.slide(dax, s * 1.2, 0, 0.12);
        S.bits(dax.x - dax.face * dax.half * 0.7, dax.y, 1, 'dirt', 14, 24);
        gold.look = -0.15;
        if (i % 2 === 0) grr(S, dax);
        yield 0.2;
        S.slide(dax, -s * 0.6, 0, 0.15);
        gold.look = 0;
        gold.wag = 0.7;
        yield 0.2;
      }
      // 5-6 秒：金毛慢慢一拉：小腊肠撑着腿被拖过去 8
      yield S.slide(dax, -s * 8, 0, 0.9);
      // 6-7 秒：金毛故意松口：小腊肠往后一个跟头，抱着绳子坐起来
      S.rig(gold, null);
      carryToy(S, rope, dax);
      S.hold(dax, 'roll'); S.hop(dax, 60);
      yield S.slide(dax, s * 10, 0, 0.5);
      S.hold(dax, 'sit'); S.emote('bang', dax, 0, 0.7);
      yield 0.5;
      // 7-10 秒：得意地绕金毛小跑一圈，头抬得高高的，再狠狠甩两下；把绳子放在金毛跟前，伏下：再来一局？
      S.hold(dax, 'stand'); S.mood(dax, 'proud'); dax.look = 0.4; dax.wag = 1;
      var T = ring(S, dax, { x: gold.x, y: gold.y }, 48, S.ry(16), 1, 'trot', s);
      yield S.each(T, function () { rope.face = dax.face; });
      S.stop(dax); S.rig(dax, { shake: 1 });
      yield 0.5;
      S.rig(dax, null);
      yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + dax.mx + 8), gold.y + S.ry(1), dax), 'trot', null, 4);
      S.faceTo(dax, gold); rope.face = dax.face;
      dropToy(S, rope, mouth(S, dax).x, dax.y + S.ry(1));
      S.hold(dax, 'bow'); S.mood(dax, null); dax.look = 0;
      yield S.act(gold, 'yawn', 1.8);
      yield 0.4;
    },
    end: function (S) { endToy(S); },
  });

  // ============================================================
  //  A07 叼着球游行，你追我呀（丢球中途换不进来：引擎还没有"游行"这一段。现在：小人把球抛给金毛，金毛不还）
  // ============================================================
  add({ name: 'keep_away_parade', zh: '叼着球游行，你追我呀', cast: 'man dax gold', cat: 'A', weight: 1.5, cool: 600, mood: 'mischievous', timeout: 32,
    when: function (S) { return awake2(S) && S.ball.inHand() && S.gold.energy >= 0.4; },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, i;
      // 小人把球轻轻抛给金毛
      var s = gold.x < man.x ? -1 : 1;
      if (!room(S, man.x, s, 90)) s = -s;
      yield S.all(S.go(gold, at(S, man.x + s * 40, man.y + S.ry(-2), gold), 'trot', null, 5), S.go(dax, at(S, man.x + s * 22, man.y + S.ry(6), dax), 'trot', null, 5));
      S.faceTo(gold, man); S.faceTo(dax, man); S.faceTo(man, gold);
      S.hold(gold, 'sit'); S.hold(dax, 'sit'); gold.wag = 0.8; dax.wag = 1;
      S.hold(man, 'p_windup'); S.face(man, 'smile');
      yield 0.5;
      S.hold(man, 'p_release');
      S.hold(gold, 'stand');
      yield S.ball.toss(gold, 0.55, 16);
      S.hold(man, null);
      // 0-1 秒：金毛停在离他 40 的地方，球叼得高高的，尾巴翘着，回头看小腊肠
      S.mood(gold, 'proud'); gold.look = 0.4; S.rig(gold, { tailSet: 25 }); gold.wag = 0.9;
      S.look(man, gold);
      yield S.go(gold, at(S, man.x + s * 70, man.y + S.ry(-4), gold), 'walk', null, 3);
      S.rig(gold, { tailSet: 25, lookBack: true }); S.look(gold, dax);
      yield 0.6;
      // 1-2 秒：小腊肠伏下叫一声；金毛叼着球也伏下回应
      S.hold(dax, 'bow'); S.faceTo(dax, gold); woof(S, dax);
      S.rig(gold, { tailSet: 25 }); S.faceTo(gold, dax); S.hold(gold, 'bow');
      yield 0.9;
      // 2-5 秒：金毛慢慢跑一个"8"字（够小腊肠追上的速度），小腊肠在后面紧追，快追上就拐弯
      S.hold(gold, 'stand'); S.hold(dax, 'stand');
      var c0 = { x: cx(S, gold.x + s * 30, gold), y: gold.y };
      var t0 = S.now(), per = 3.0;
      S.track(gold, function () {
        var k = (S.now() - t0) / per * 2 * Math.PI;
        return { x: c0.x + Math.sin(k) * 40, y: cy(S, c0.y + S.ry(Math.sin(2 * k) * 14)) };
      }, S.spd(gold, 'trot') * 1.1);
      S.follow(dax, gold, gold.half + 10, S.ry(2), 'run');
      yield 3.0;
      // 5-7 秒：停下来，把球放低到小腊肠的高度；小腊肠一扑，球又抬起来了。两次
      S.stop(gold); S.stop(dax);
      S.faceTo(dax, gold); S.faceTo(gold, dax);
      yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + dax.mx + 4), gold.y + S.ry(1), dax), 'trot', null, 2);
      S.faceTo(dax, gold);
      for (i = 0; i < 2; i++) {
        gold.look = -0.5;
        yield 0.5;
        S.hop(dax, 80); gold.look = 0.6;
        yield 0.5;
      }
      // 7-8.5 秒：金毛趴下，球护在两只前爪中间，下巴压在上面；小腊肠左边试一下、右边试一下
      gold.look = 0; S.hold(gold, 'lie'); S.rig(gold, { chin: true, tailSet: 10 }); S.mood(gold, 'happy');
      for (i = 0; i < 2; i++) {
        yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + 8) + (i ? 6 : -6), gold.y + S.ry(i ? 6 : -6), dax), 'run', null, 1.2);
        S.faceTo(dax, gold);
        S.look(gold, dax);
        yield 0.25;
      }
      // 8.5-10.5 秒：小腊肠趴在 14 外，扭头看别处，舔舔嘴：装作不在乎。金毛抬起下巴歪头看它——小腊肠一个冲刺抢走了球
      yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + dax.mx + 14), gold.y + S.ry(2), dax), 'walk', null, 2);
      S.faceTo(dax, gold); dax.face = -dax.face; S.hold(dax, 'lie'); dax.look = 0.4;
      yield 0.6;
      S.act(dax, 'lickchops', 0.8);
      yield 0.8;
      S.rig(gold, { tilt: 1 }); S.look(gold, dax);
      yield 0.5;
      S.faceTo(dax, gold); S.hold(dax, 'stand');
      yield S.go(dax, at(S, gold.x + gold.face * (gold.mx + dax.mx - 2), gold.y + S.ry(1), dax), 'run', null, 0.6);
      S.ball.give(dax); S.emote('spark', dax, dax.face * 8, 0.5);
      S.rig(gold, null); S.mood(gold, null);
      // 10.5-12 秒：小腊肠叼着大大的球，尾巴竖着，昂首挺胸走回小人那儿；金毛拍拍尾巴，无所谓
      S.mood(dax, 'proud'); dax.look = 0.4; dax.wag = 1;
      gold.wag = 0.7;
      yield S.go(dax, S.atHand(dax), 'trot', null, 4);
      S.faceTo(dax, man); S.faceTo(man, dax);
      S.hold(dax, 'sit');
      S.hold(man, 'p_pat'); S.face(man, 'laugh');
      S.ball.take();
      S.emote('heart', dax, 0, 1.0); dax.happy = 1;
      yield 1.2;
      S.hold(man, null); dax.happy = 0;
    },
  });

  // ============================================================
  //  A08 一根树枝两只抬
  // ============================================================
  add({ name: 'two_on_a_stick', zh: '一根树枝两只抬', cast: 'dax gold', weight: 2, cool: 1200, cap: 3, mood: 'funny', tag: 'calm', hours: [7, 20], timeout: 30,
    when: function (S) { var p = S.prop.find('stick'); return awake2(S) && (!p || !p.holder); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, stick = toy(S, 'stick', dax), man = S.man;
      yield S.stage(gold);
      // 0-2 秒：小腊肠一路闻过去，叼住树枝的一头往后拖，尾巴转得飞快——几乎拖不动
      var w = S.prop.where(stick);
      yield S.go(dax, S.beside(dax, w, 11), 'sniff', 'sniff', 6);
      S.faceTo(dax, stick); S.hold(dax, 'sniff'); sniffs(S, dax);
      yield 0.4;
      carryToy(S, stick, dax); stick.face = 1;
      S.hold(dax, 'tug'); dax.wag = 1;
      var back = -dax.face;
      yield S.slide(dax, back * 5, 0, 1.0);
      // 2-3.5 秒：金毛走过来，低头闻一闻，叼住另一头：树枝横在两张嘴中间
      S.faceTo(gold, dax);
      yield S.go(gold, at(S, dax.x - dax.face * 4, cy(S, dax.y + S.ry(-8)), gold), 'walk', null, 5);
      S.faceTo(gold, { x: gold.x + dax.face }); dax.face = gold.face;
      S.hold(gold, 'sniff'); sniffs(S, gold);
      yield 0.6;
      S.hold(gold, 'stand'); gold.look = -0.6; S.rig(gold, { jaw: 0.4 });       // 大狗把自己那头放低到小狗的高度
      S.hold(dax, 'stand');
      // 小腊肠站到金毛前面一点、靠近观众这一侧：两张嘴差不多一样高
      yield S.go(dax, at(S, gold.x + gold.face * 22, cy(S, gold.y + S.ry(8)), dax), 6, null, 2);
      dax.face = gold.face;
      dropToy(S, stick);
      var hook = function () {
        if (!S.prop.alive(stick) || stick.holder) return;
        var a = mouth(S, gold), b = mouth(S, dax);
        S.prop.move(stick, (a.x + b.x) / 2, (gold.y + dax.y) / 2 + 0.02, Math.max(1, (a.z + b.z) / 2 - 1));
      };
      S.each(hook);
      // 3.5-4 秒：都愣住，互相看一眼；尾巴开始摇
      S.look(gold, dax); S.look(dax, gold);
      yield 0.5;
      gold.wag = 0.8; dax.wag = 1;
      // 4-9 秒：一起抬着走 100：金毛慢慢走，小腊肠腿都快抡成一团了
      var dir = gold.face, dist = room(S, gold.x, dir, 130) ? 100 : -100;
      if (dist < 0) { dir = -dir; gold.face = dir; dax.face = dir; yield S.go(dax, at(S, gold.x + dir * 22, dax.y, dax), 8, null, 3); }
      S.look(gold, null); S.look(dax, null);
      var gx = cx(S, gold.x + dir * 100, gold);
      S.go(gold, gx, gold.y, 20, null, 7);
      S.follow(dax, gold, -22, S.ry(8), 26);
      yield 2.5;
      // 9-10.5 秒：小腊肠停下来闻东西，被拖着走了 5，松了口；金毛回头等它，把那头放得更低，它又叼上
      S.stop(gold); S.stop(dax); S.hold(dax, 'sniff');
      yield S.slide(dax, dir * 5, 0, 0.5);
      S.rig(gold, { jaw: 0.4, lookBack: true }); gold.look = -0.8;
      yield 0.8;
      S.hold(dax, 'stand');
      yield 0.3;
      S.rig(gold, { jaw: 0.4 }); gold.look = -0.6;
      S.go(gold, cx(S, gold.x + dir * 40, gold), gold.y, 20, null, 3);
      S.follow(dax, gold, -22, S.ry(8), 26);
      yield 2.0;
      S.stop(gold); S.stop(dax);
      // 10.5-12 秒：他就在附近：一起放到他脚边；不然就各趴一头啃
      if (S.free(man) && S.dist(man, gold) < 120 && S.join(man)) {
        S.faceTo(man, gold);
        S.hold(man, 'p_pat'); S.face(man, 'smile');
        dropToy(S, stick);
        S.hold(gold, 'sit'); S.hold(dax, 'sit'); gold.look = 0.3;
        S.emote('hs', gold, 0, 1.0);
        yield 1.4;
        S.hold(man, null);
      } else {
        dropToy(S, stick);
        S.hold(gold, 'lie'); S.hold(dax, 'lie'); S.rig(gold, { chew: true }); S.rig(dax, { chew: true }); gold.look = -0.3;
        yield 3.0;
      }
      if (S.prop.alive(stick)) S.prop.set(stick, 'chewed');
    },
    end: function (S) { endToy(S); },
  });

  // ============================================================
  //  A09 趁大狗打盹偷玩具
  // ============================================================
  add({ name: 'stealth_heist', zh: '趁大狗打盹偷玩具', cast: 'dax gold', weight: 2, cool: 900, mood: 'mischievous', tag: 'calm', family: 'nose', timeout: 28,
    when: function (S) { return awake2(S) && S.dist(S.dax, S.gold) > 40; },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, i;
      yield S.stage(gold);
      // 金毛趴着打盹，下巴压在玩具上
      var p = S.prop.find('rope') || S.prop.find('stick');
      if (p && p.holder) p = null;
      if (p && S.dist(gold, S.prop.where(p)) > 120) p = null;
      if (p) {
        yield S.go(gold, S.beside(gold, S.prop.where(p), 2), 'walk', null, 5);
        S.faceTo(gold, p);
      } else {
        p = S.prop.spawn('rope', '', gold.x + gold.face * (gold.mx - 4), gold.y + S.ry(0.5), { keep: true, cap: 300, data: { toy: true } });
      }
      touchToy(S, p);
      S.hold(gold, 'lie'); S.rig(gold, { chin: true, eyes: 'closed' }); gold.wag = 0.1;
      // 小腊肠在 60 外
      var s = dax.x < gold.x ? -1 : 1;
      if (!room(S, gold.x, s, 70)) s = -s;
      if (Math.abs(dax.x - gold.x) < 50) yield S.go(dax, at(S, gold.x + s * 66, gold.y + S.ry(4), dax), 'trot', null, 4);
      // 0-1 秒：发现了宝贝：竖起来、歪头
      S.faceTo(dax, gold); S.hold(dax, 'alert'); S.rig(dax, { tilt: 1 }); S.look(dax, p); S.mood(dax, 'curious');
      yield 0.9;
      // 1-5 秒：一步一停地挪过去（伏着身子），金毛耳朵一动就举着一只爪子定住
      S.rig(dax, null); S.mood(dax, 'focused');
      var goal = gold.x + gold.face * (gold.mx + dax.mx + 2);
      if ((goal - gold.x) * s < 0) goal = gold.x + s * (gold.mx + dax.mx + 2);
      for (i = 0; i < 3; i++) {
        var nx = dax.x + (goal - dax.x) * (i < 2 ? 0.4 : 1);
        yield S.go(dax, nx, gold.y + S.ry(1), 10, 'stalk', 2);
        S.stop(dax); S.hold(dax, 'alert');
        S.rig(gold, { chin: true, eyes: 'closed', earFlick: true });
        S.rig(dax, { pawUp: true });
        yield 0.5;
        S.rig(gold, { chin: true, eyes: 'closed' }); S.rig(dax, null);
      }
      S.faceTo(dax, p);
      // 5-6.5 秒：咬住玩具一头，小口小口往外拽三下；金毛叹口气，赶紧趴平
      for (i = 0; i < 3; i++) {
        S.hold(dax, 'tug');
        S.prop.move(p, p.x - dax.face * 2, p.y, 0);
        yield 0.22;
        S.hold(dax, 'stalk');
        yield 0.18;
        if (i === 1) { sigh(S, gold); S.hold(dax, 'lie'); S.rig(dax, { chin: true }); yield 0.6; S.rig(dax, null); }
      }
      // 6.5-7.5 秒：叼上就往后退，转身，尾巴竖得笔直，迈着高步走掉
      carryToy(S, p, dax);
      S.hold(dax, 'stand');
      yield S.slide(dax, -dax.face * 15, 0, 0.7);
      dax.face = -dax.face; p.face = dax.face;
      S.rig(dax, { tailSet: 75 }); S.mood(dax, 'proud');
      var off = at(S, dax.x + dax.face * 80, dax.y + S.ry(S.rand(-10, 10)), dax);
      var c = S.go(dax, off, 34, null, 4);
      // 7.5-9 秒：金毛睁开一只眼看着它，拍两下尾巴，又闭上。它都知道
      yield 0.4;
      S.rig(gold, { chin: true, eyes: 'slit' }); S.look(gold, dax);
      yield 0.5;
      gold.wag = 0.7;
      yield 0.6;
      gold.wag = 0.1; S.rig(gold, { chin: true, eyes: 'closed' });
      yield c;
      // 9-12 秒：趴在 80 外啃，回头看两次
      p.face = dax.face; dropToy(S, p, mouth(S, dax).x, dax.y + S.ry(1));
      S.hold(dax, 'lie'); S.rig(dax, { chew: true }); S.mood(dax, null);
      for (i = 0; i < 2; i++) {
        yield 1.0;
        S.rig(dax, { chew: true, lookBack: true });
        yield 0.5;
        S.rig(dax, { chew: true });
      }
      yield 0.5;
    },
    end: function (S) { endToy(S); },
  });

  // ============================================================
  //  A10 学大狗的跟屁虫
  // ============================================================
  add({ name: 'copycat_convoy', zh: '学大狗的跟屁虫', cast: 'dax gold', weight: 2, cool: 600, mood: 'funny', tag: 'calm', timeout: 20,
    when: function (S) { return awake2(S); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, F = S.field;
      yield S.stage(gold);
      var dir = (gold.x - F.x0) > (F.x1 - gold.x) ? -1 : 1;
      if (!room(S, gold.x, dir, 110)) return;
      // 0-1 秒：金毛慢慢出发巡视；小腊肠贴着它的尾巴跟上（鼻子离尾巴 4）
      gold.face = dir;
      var gap = gold.half + dax.mx + 4;
      var leg1 = S.go(gold, at(S, gold.x + dir * 45, gold.y + S.ry(S.rand(-8, 8)), gold), 'walk', null, 4);
      yield S.go(dax, at(S, gold.x - dir * gap, gold.y + S.ry(1), dax), 'trot', null, 3);
      S.follow(dax, gold, gap, S.ry(1), 'walk');
      yield leg1;
      // 1-5 秒：金毛停下闻一个地方；它一走，小腊肠闻同一个地方；金毛用后腿蹬两下草，小腊肠也蹬，小小的
      S.hold(gold, 'sniff'); var spot = mouth(S, gold);
      yield 0.8;
      S.hold(gold, 'stand');
      var leg2 = S.go(gold, at(S, gold.x + dir * 30, gold.y, gold), 'walk', null, 3);
      yield S.go(dax, at(S, spot.x - dir * dax.mx, gold.y + S.ry(1), dax), 'walk', null, 3);
      S.hold(dax, 'sniff'); sniffs(S, dax);
      yield leg2;
      S.act(gold, 'kick', 1.2); S.bits(gold.x - dir * gold.half, gold.y, 3, S.grass(), 18, 30);
      yield 0.6;
      S.hold(dax, 'stand');
      yield S.go(dax, at(S, gold.x - dir * gap, gold.y + S.ry(1), dax), 'walk', null, 2);
      S.act(dax, 'kick', 1.0); S.bits(dax.x - dir * dax.half, dax.y, 2, S.grass(), 10, 20);
      yield 0.9;
      // 5-6 秒：金毛走两步突然站住；小腊肠低着头直接撞上它的后腿，一屁股坐下
      S.follow(dax, gold, gap, S.ry(1), 'walk'); dax.look = -0.6;
      yield S.go(gold, at(S, gold.x + dir * 24, gold.y, gold), 'walk', null, 2);
      S.stop(gold);
      S.stop(dax);
      yield S.go(dax, gold.x - dir * (gold.half + dax.mx - 5), dax.y, 'walk', null, 1.5); S.puff(dax.x + dir * dax.mx, dax.y, false); S.emote('spark', dax, dir * 8, 0.5);
      S.hold(dax, 'sit'); dax.look = 0;
      yield 0.6;
      // 6-7 秒：金毛回头看它；小腊肠望天，舔舔嘴：刚才什么都没发生
      S.rig(gold, { lookBack: true }); S.look(gold, dax);
      dax.look = 0.4; S.look(dax, { x: dax.x - dir * 40, y: dax.y, z: 30 });
      S.act(dax, 'lickchops', 0.6);
      yield 1.0;
      // 7-8 秒：接着巡视；小腊肠隔着 10 规规矩矩地跟 3 秒
      S.rig(gold, null); S.look(gold, null); S.look(dax, null); dax.look = 0;
      S.hold(dax, 'stand');
      if (room(S, gold.x, dir, 70)) S.go(gold, at(S, gold.x + dir * 60, gold.y, gold), 'walk', null, 4);
      S.follow(dax, gold, gold.half + dax.half + 10, S.ry(1), 'walk');
      yield 3.0;
    },
  });

  // ============================================================
  //  A11 抢暖窝（小偷版 / 老大版），最后一起睡一会儿
  // ============================================================
  add({ name: 'warm_spot', zh: '抢暖窝', cast: 'dax gold', weight: 2, cool: 900, mood: 'sleepy', tag: 'calm', family: 'sleep', timeout: 150,
    when: function (S) { return awake2(S) && !S.night(); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, boss = S.chance(0.4), spot;
      yield S.stage(gold);
      if (!room(S, gold.x, 1, 50) || !room(S, gold.x, -1, 50)) return;
      if (!boss) {
        // 小偷版。金毛趴着；小腊肠在旁边好像睡着了
        S.hold(gold, 'lie'); S.rig(gold, { chin: true });
        var s = dax.x < gold.x ? -1 : 1;
        yield S.go(dax, at(S, gold.x + s * 52, gold.y + S.ry(6), dax), 'walk', null, 5);
        S.faceTo(dax, gold); S.hold(dax, 'sleep');
        yield 2.0;
        // 0-1 秒：金毛起来伸个懒腰，走开 30 去闻东西
        spot = { x: gold.x, y: gold.y, face: gold.face };
        S.rig(gold, null); S.hold(gold, 'stand');
        yield S.act(gold, 'stretch', 2.6);
        yield S.go(gold, at(S, gold.x - s * 34, gold.y + S.ry(-3), gold), 'walk', null, 3);
        S.hold(gold, 'sniff');
        // 1-2.5 秒：小腊肠睁开一只眼，一溜烟钻到那个位置上，转一圈，蜷起来，闭眼
        S.rig(dax, { eyes: 'slit' });
        yield 0.5;
        S.rig(dax, null); S.hold(dax, 'stand');
        yield S.go(dax, spot.x, spot.y, 'run', null, 2);
        yield S.act(dax, 'nest_circle');
        S.hold(dax, 'sleep');
        yield 0.5;

  // ============================================================

  // ============================================================

      // 3. 它和他一样长，头和尾巴从两边伸出去；他换一下手

      man.face = dir; S.rig(dax, { scent: true }); dax.wag = 0.7;
      S.follow(gold, man, gold.half + 12, S.ry(-3), S.spd(gold, 'walk') * 1.1);

      S.face(man, 'smile'); gold.look = 0.5;

      yield 1.4;
      // 6. 他弯腰，后脚先着地放下来——它像上了发条一样冲出去；他拍拍袖子上的狗毛
      S.hold(man, ['p_place', 'p_crouch']);
      yield 0.5;
      S.rig(dax, null); dax.look = 0; S.detach(dax, 0); S.hold(dax, 'stand');
      var run = S.go(dax, cx(S, dax.x + dir * 60, 24), dax.y + S.ry(S.rand(-10, 10)), S.spd(dax, 'run'), null, 2);
      S.hold(man, ['p_dust', 'p_idle']); S.face(man, 'proud');

  // ============================================================
  //  B12 三十公斤的"小狗"要坐腿上；然后被睡住了
  // ============================================================
  add({ name: 'lap_trap', zh: '三十公斤的"小狗"要坐腿上；然后被睡住了', cast: 'man gold dax', weight: 1, cool: 900, tag: 'calm', mood: 'sleepy', family: 'sleep', fromDay: 2,
    when: function (S) { return S.dist(S.gold, S.man) < 160; },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax, f = man.face, i;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）
      // 1. 他坐到草地上，两腿伸直
      S.hold(man, 'p_sit'); S.face(man, 'soft');

      // 2. 金毛走过来，转过身，倒着退，退到屁股正好在他腿上，坐下——整个把他挡住了
      var gx = cx(S, man.x + f * (gold.half * 0.55 + 14));

      yield 0.4;

      S.hold(man, ['p_sit_arm', 'p_sit']); S.face(man, 'laugh');
      // 4. 金毛坐得又高又得意，喘着气，尾巴扫过他的鞋

      yield 1.8;
      // 5. 小腊肠来了：腿上被占了，哼一声，爬到他小腿上，转两圈，蜷起来——一秒就睡着
      yield S.go(dax, cx(S, man.x + f * 22), man.y + S.ry(3), S.spd(dax, 'trot'), null, 4);

      S.hold(dax, ['sleep', 'lie']); S.rig(dax, { eyes: 'closed' });
      yield 0.6;
      // 6. 金毛下来，趴在他身边，下巴搁在他膝盖上。他一抬手，小腊肠的耳朵一抖——他僵住，手慢慢放下

      yield S.go(gold, cx(S, man.x - f * (gold.half * 0.6 + 6)), man.y + S.ry(2), S.spd(gold, 'walk'), null, 3);
      gold.face = f; S.hold(gold, 'lie'); S.rig(gold, { chin: true, eyes: 'closed' });
      S.hold(man, 'p_sit'); S.face(man, 'neutral');

      S.rig(dax, { eyes: 'closed', earFlick: 1 }); S.face(man, 'oops');
      yield 0.8;
      S.rig(dax, { eyes: 'closed' });
      // 两头都被压住，只有眼睛能动：朝她无奈地笑一笑
      glance(S, 'soft'); S.emote('hs', man, 0, 1.2);

      S.hop(man, 40);
      yield 0.5;
      S.hop(man, 40);
      yield 0.5;
      tieAskew(S);
      S.hold(man, ['p_dust', 'p_idle']); S.face(man, 'smile');
      yield 0.8;
    },
  });

  // ============================================================
  //  B13 梳毛：一身狗毛（藏青色西装对上金毛掉毛季）
  // ============================================================
  add({ name: 'brushing_day', zh: '梳毛：一身狗毛', cast: 'man gold dax', cool: 3600, cap: 4, tag: 'calm', mood: 'funny', fromDay: 1,
    // 掉毛的季节（北半球 3-5 月、9-11 月）多梳几次

      var man = S.man, gold = S.gold, dax = S.dax, i, s, fb = null;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）

      if (fb) {

        S.hold(dax, 'stand'); S.hop(dax, 100);
        yield 0.45;
        S.hold(dax, 'bow'); S.puff(dax.x + dax.face * dax.mx, dax.y, false);
        yield 0.35;
        S.prop.carry(fb, dax, 'headTop'); S.hold(dax, 'stand'); S.look(dax, null);
        yield S.act(dax, 'sneeze', 0.8);
        yield S.act(dax, 'shakeoff', 1.2);
        S.emote('q', dax, 0, 0.8);
        S.look(man, dax); S.face(man, 'laugh');

      S.bits(gold.x, gold.y - 16, 12, 'fur', 30, 40);
      S.hold(man, null); S.face(man, 'sleepy');
      yield 1.3;
      S.hold(man, 'p_pat'); S.face(man, 'soft'); S.emote('hs', man, 0, 0.9);

  add({ name: 'leash_and_brakes', zh: '自己叼牵引绳来；半路小狗死活不走', cast: 'man gold dax', weight: 2, cool: 1200, tag: 'calm', mood: 'funny', fromDay: 1,

      S.prop.drop(leash, man.x + man.face * 4, man.y + S.ry(1));
      yield 0.5;
      S.prop.carry(leash, gold, 'mouth');
      yield S.act(gold, 'nudge', 0.6);
      // 他接过来：小腊肠反应过来了，原地转一圈，叫一声。出发——金毛自己叼着绳子的另一头
      S.hold(man, null); S.item(man, S.hasFx('leash_handle') ? 'leash_handle' : null); S.face(man, 'grin');
      S.hold(dax, 'stand'); S.turn(dax);
      yield 0.25;
      S.turn(dax); dax.bark = 0.3; S.emote('woof', dax, dax.face * 10, 0.5); dax.wag = 1;
      yield 0.6;
      dir = roomy(S, man);
      S.follow(gold, man, gold.half + 12, S.ry(3), S.spd(gold, 'walk') * 1.2);
      S.follow(dax, man, -26, S.ry(-3), S.spd(dax, 'trot') * 0.6);
      yield S.go(man, cx(S, man.x + dir * 70, 40), man.y + S.ry(S.rand(-20, 20)), 24, null, 5);
      // 半路：小腊肠突然停住，鼻子粘在一个地方
      S.stop(dax); S.hold(dax, 'sniff'); S.emote('sniffs', dax, dax.face * 16, 0.5);
      S.stop(gold); S.hold(gold, 'sit');
      S.faceTo(man, dax); S.hold(man, ['p_call', 'p_hold']); S.face(man, 'neutral');
      yield 1.2;
      // 它绕着那一点闻成一个小螺旋，头都不抬；他看看表，金毛打个哈欠
      var spot = { x: dax.x, y: dax.y };
      var orb = S.orbit(dax, spot, 6, 3, 1.5, 'sniff');
      S.hold(dax, 'sniff');
      S.hold(man, 'p_watch');
      S.act(gold, 'yawn', 1.6);
      yield S.any(orb, 2.6);
      // 闻够了：往后蹬两下草，小跑到队伍最前面，好像是别人在耽误时间。他耸耸肩
      S.stop(dax); S.hold(dax, 'stand');
      yield S.act(dax, 'kick', 0.9);
      S.bits(dax.x - dax.face * dax.half, dax.y, 4, S.grass(), 16, 30);
      dax.face = dir;
      var d2 = S.go(dax, cx(S, man.x + dir * 34), man.y + S.ry(-3), S.spd(dax, 'trot'), null, 3);
      S.hold(man, ['p_shrug', 'p_idle']); S.face(man, 'wry');
      yield S.all(d2, 1.0);
      S.hold(gold, 'stand');
      // 走完了：绳子收回口袋
      S.hold(man, null);
      S.follow(gold, man, gold.half + 12, S.ry(3), S.spd(gold, 'walk') * 1.2);
      yield S.go(man, cx(S, man.x + dir * 40, 40), man.y, 24, null, 3);
      S.stop(gold); S.faceTo(gold, man); S.hold(gold, 'sit');
      S.hold(man, ['p_pocket', 'p_hold']); S.item(man, null);
      if (leash) S.prop.remove(leash, false);
      yield 0.6;
      S.hold(man, null);
    },
  });

  // ============================================================
  //  B15 叫你等着，偷偷往前蹭：每回头看一次，它就近了三步
  // ============================================================
  add({ name: 'creeping_stay', zh: '叫你等着，偷偷往前蹭', cast: 'man dax gold', weight: 1, cool: 1500, cap: 3, tag: 'lively', mood: 'mischievous', fromDay: 2,
    when: function (S) { var F = S.field; return (F.x1 - F.x0) > 220; },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, dir = roomy(S, man), i;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）
      // 狗狗排在他面前，他转身对着它们
      var a = S.go(dax, cx(S, man.x - dir * 22), man.y + S.ry(4), S.spd(dax, 'trot'), null, 4);
      var b = S.go(gold, cx(S, man.x - dir * 30), man.y + S.ry(-4), S.spd(gold, 'walk') * 1.5, null, 4);
      yield S.all(a, b);
      // 1. 他平举手掌：等着。金毛坐成一尊雕像；小腊肠坐是坐了，浑身发抖
      man.face = -dir; S.faceTo(dax, man); S.faceTo(gold, man);
      S.hold(man, ['p_stay', 'p_idle']); S.face(man, 'focus'); S.look(man, dax);
      S.hold(gold, 'sit'); gold.wag = 0.2; S.hold(dax, 'sit'); dax.wag = 1;
      yield 1.6;
      // 2. 他转身走开 70，背对着它们。小腊肠屁股贴地往前蹭了一下
      S.hold(man, null); S.face(man, 'proud');
      var w = S.go(man, cx(S, man.x + dir * 70, 30), man.y, 24, null, 4);
      yield 1.2;
      S.hop(dax, 20); S.slide(dax, dir * 6, 0, 0.3);
      yield S.any(w, 2);
      // 3. 他回头一看：小腊肠立刻定住，抬头研究天空。金毛一根毛都没动
      S.stop(man); S.turn(man); S.look(man, dax); S.face(man, 'neutral');
      dax.look = 0.8;
      yield 0.9;
      S.turn(man); S.look(man, null); dax.look = 0;
      // 4. 再往前走 30：又蹭了两下
      w = S.go(man, cx(S, man.x + dir * 30, 30), man.y, 24, null, 3);
      for (i = 0; i < 2; i++) { yield 0.7; S.hop(dax, 20); S.slide(dax, dir * 7, 0, 0.3); }
      yield S.any(w, 1);
      // 5. 他整个转过来，看见了这段距离：叉腰。小腊肠趴平，下巴贴地，眼睛看别处，舔舔嘴（心虚）
      S.stop(man); S.faceTo(man, dax); S.hold(man, ['p_hips', 'p_idle']); S.face(man, 'pout');
      S.hold(dax, 'lie'); S.rig(dax, { chin: true }); S.mood(dax, 'guilty');
      yield 0.5;
      S.act(dax, 'lickchops', 0.6);
      yield 1.0;
      // 6. 他摇摇头，笑了，单膝跪下张开手臂
      S.hold(man, ['p_kneel', 'p_crouch']); S.face(man, 'laugh');
      yield 0.8;
      // 7. 两只一起冲过来：小腊肠先到，一跳跳进他怀里；金毛晚一秒到，靠上来——把他撞得一屁股坐下
      S.rig(dax, null); S.mood(dax, 'happy'); S.hold(dax, 'stand'); dax.wag = 1; gold.wag = 1;
      var ds = dax.x < man.x ? -1 : 1;
      yield S.go(dax, cx(S, man.x + ds * 14), man.y + S.ry(2), S.spd(dax, 'run'), null, 3);
      S.hop(dax, 125);
      yield 0.3;
      S.attach(dax, man, 'arms', 0, 0, false, -1); S.hold(dax, ['cradle', 'sit']);
      yield S.go(gold, cx(S, man.x + ds * (gold.half * 0.5 + 8)), man.y + S.ry(1), S.spd(gold, 'run') * 0.7, null, 3);
      S.faceTo(gold, man); S.hold(gold, ['lean', 'stand']);
      S.hold(man, ['p_fall', 'p_sit']); S.puff(man.x, man.y, true); S.face(man, 'surprised');
      yield 0.6;
      // 8. 一堆：他坐着，小腊肠舔他下巴，金毛把头搁在他肩上。两三颗爱心；然后大家站起来
      S.hold(man, 'p_sit'); S.face(man, 'laugh'); S.hold(gold, 'sit'); S.rig(gold, { chin: true, eyes: 'closed' });
      for (i = 0; i < 3; i++) { S.emote(i % 2 ? 'hs' : 'heart', [dax, man, gold][i], 0, 0.9); yield 0.7; }
      yield 0.8;
      S.detach(dax, 60); S.rig(gold, null); S.hold(gold, 'stand'); S.hold(dax, 'stand');
      S.hold(man, null); S.face(man, 'smile');
      yield 0.8;
    },
  });

  // ============================================================
  //  B16 捉迷藏：他躲进岛里，小腊肠顺着气味找过来
  // ============================================================
  add({ name: 'hide_and_seek_island', zh: '捉迷藏：他躲进岛里', cast: 'man dax gold', weight: 2, cool: 10800, cap: 2, tag: 'lively', mood: 'playful', family: 'island', fromDay: 4,
    when: function (S) {
      var I = S.island();
      return !!(I && I.on && S.roam) && !S.night() && S.time.h >= 8 && S.her.present && !S.her.engaged && S.quietFor() > 120 &&
             S.dist(S.dax, S.man) > 60 && S.dist(S.gold, S.man) > 60;
    },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, I = S.island(), trail = [], i;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）
      if (!I) return;
      // 1. 他踮着脚溜到岛底下（一路留下气味），左右看看，冲她"嘘"一下，一跳钻进岛里
      S.face(man, 'grin');
      var last = { x: man.x, y: man.y };
      trail.push(last);
      var sneak = S.go(man, I.x + S.rand(-30, 30), I.y + 30, 16, ['p_sneak', 'p_walk0'], 12);
      yield S.any(sneak, S.each(12, function () {
        if (Math.abs(man.x - last.x) + Math.abs(man.y - last.y) > 26) { last = { x: man.x, y: man.y }; trail.push(last); }
      }));
      S.look(man, { x: man.x - 40, y: man.y, z: 20 });
      yield 0.5;
      S.look(man, { x: man.x + 40, y: man.y, z: 20 });
      yield 0.5;
      if (S.cursor.known && S.cursorNear(man, 250)) { S.hold(man, ['p_shh', 'p_front']); glance(S, 'wink'); yield 0.9; }
      S.hold(man, null);
      S.pulse('gulp');
      var inside = yield* S.enterIsland(man);
      if (!inside) return;
      // 2. 金毛抬起头：人呢？左看看右看看。小腊肠一下惊醒
      S.hold(gold, 'alert'); S.look(gold, { x: gold.x - 50, y: gold.y, z: 10 }); S.emote('q', gold, 0, 1);
      S.hold(dax, 'alert'); S.emote('bang', dax, 0, 0.5);
      yield 0.8;
      S.look(gold, { x: gold.x + 50, y: gold.y, z: 10 });
      yield 0.8;
      S.look(gold, null);
      // 3. 小腊肠低头顺着他走过的路一路闻过去，尾巴竖得像天线；金毛慢慢跟着，抬着鼻子闻空气
      S.rig(dax, { tailSet: 60, scent: true }); dax.wag = 0.3;
      S.follow(gold, dax, 36, S.ry(-4), S.spd(gold, 'walk'));
      S.rig(gold, { scent: true }); gold.look = 0.5;
      for (i = 0; i < trail.length && i < 8; i++) {
        var p = trail[i], over = (i === 2) ? 10 : 0;
        yield S.go(dax, p.x + S.rand(-3, 3) + over * (p.x > dax.x ? 1 : -1), p.y + S.ry(S.rand(-2, 2)), 24, 'sniff', 3);
      }
      yield S.go(dax, I.x + 12, I.y + 2, 24, 'sniff', 4);
      // 4. 气味断在岛底下：小腊肠抬头，叫两声，往上跳；金毛坐下仰着头，低低地"汪"一声
      S.rig(dax, null); S.hold(dax, 'stand'); dax.look = 1;
      dax.bark = 0.6; S.emote('woof', dax, 0, 0.5);
      yield 0.5;
      S.hop(dax, 110);
      S.stop(gold); S.rig(gold, null);
      yield S.go(gold, I.x - 22, I.y + 4, S.spd(gold, 'walk') * 1.4, null, 3);
      S.hold(gold, 'sit'); gold.look = 1; S.emote('bigwoof', gold, 0, 0.8);
      yield 1.0;
      // 5. 岛鼓了一下，他从岛里掉下来，正好落在两只中间
      S.pulse('bulge');
      yield* S.leaveIsland(man);
      // 6. 开派对：小腊肠转圈蹦，金毛整个后半身都在扭；他单膝跪下把两只都抱住
      dax.look = 0; gold.look = 0; S.hold(gold, 'stand'); gold.wag = 1; dax.wag = 1;
      S.faceTo(dax, man); S.faceTo(gold, man);
      for (i = 0; i < 3; i++) { S.turn(dax); S.hop(dax, 95); yield 0.45; }
      S.faceTo(dax, man);
      S.hold(man, ['p_kneel', 'p_crouch']); S.face(man, 'laugh');
      S.emote('heart', dax, 0, 0.9);
      yield 0.5;
      S.emote('heart', gold, 0, 0.9);
      yield 1.4;
    },
  });

  // ============================================================
  //  B17 午睡叠成一堆（她回来会想拍下来的那一幕）
  // ============================================================
  add({ name: 'nap_pile', zh: '午睡叠成一堆', cast: 'man gold dax', weight: 3, cool: 7200, cap: 2, tag: 'calm', mood: 'sleepy', family: 'sleep', timeout: 74, fromDay: 2,
    when: function (S) {
      var t = S.time.h * 60 + S.time.m;
      return ((t >= 13 * 60 && t < 15 * 60 + 30) || S.her.idle > 600) && !S.night();
    },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax, F = S.field, i, f;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）
      // 在下面三分之一、离她的鼠标远一点的地方
      var px = man.x, py = S.roam ? F.y1 - (F.y1 - F.y0) * S.rand(0.05, 0.25) : man.y;
      if (S.cursor.known && Math.abs(S.cursor.x - px) < 150) px = S.cursor.x < (F.x0 + F.x1) / 2 ? F.x1 - 80 : F.x0 + 80;
      yield S.go(man, cx(S, px, 60), py, 24, null, 8);
      f = man.face;
      // 1. 打个哈欠，松一松领带，往后一躺
      yield S.act(man, 'yawn', 1.8);
      S.rig(man, { tie: 'loose' });
      S.hold(man, 'p_sit'); S.face(man, 'sleepy');
      yield 0.8;
      S.hold(man, ['p_lie', 'p_sit']); S.face(man, 'soft');
      yield 0.8;
      // 2. 金毛转一圈，挨着他躺下，头搁在他胸口；他的手落在它脖子上
      // （挨着他、在他身后一点躺：他躺着的样子露在前面，金毛的头朝着他的胸口）
      yield S.go(gold, cx(S, man.x + f * 3), man.y + S.ry(-2), S.spd(gold, 'walk') * 1.4, null, 5);
      gold.face = -f; S.hold(gold, 'lie'); S.rig(gold, { chin: true, eyes: 'closed' }); gold.wag = 0.2;
      yield 1.2;
      // 3. 小腊肠爬上他的肚子，扒两下，转三圈，蜷成一个甜甜圈
      yield S.go(dax, cx(S, man.x + f * 18), man.y + S.ry(2), S.spd(dax, 'trot'), null, 5);
      S.attach(dax, man, 'lap', 0, 0, false, 1); S.hold(dax, 'dig');
      yield 0.5;
      S.hold(dax, 'stand');
      for (i = 0; i < 3; i++) { S.turn(dax); yield 0.3; }
      S.hold(dax, ['sleep', 'lie']); S.rig(dax, { eyes: 'closed' });
      yield 1.0;
      // 4. 三种呼吸，三种快慢；z、zs
      S.face(man, 'sleepy');
      S.emote('zs', dax, 0, 1.4);
      yield 1.2;
      S.emote('z', man, 0, 1.6);
      yield 1.6;
      // 5. 定格一会儿（她的鼠标凑过来：金毛不睁眼地拍拍尾巴，他懒懒地抬一下手）
      var end = S.t() + S.rand(26, 40), zAt = 0, waved = -99;
      yield S.until(function () {
        if (S.t() > zAt) { zAt = S.t() + S.rand(3, 5); S.emote(S.pick(['z', 'zs']), S.pick([man, gold, dax]), 0, 1.6); }
        if (S.cursor.known && S.cursorNear(man, 60) && S.t() - waved > 8) {
          waved = S.t(); gold.wag = 0.8; S.emote('hs', man, 0, 1.0);
        } else if (S.t() - waved > 1.2) gold.wag = 0.2;
        return S.t() > end || S.ball.where().st !== 'hand';
      }, 45);
      // 起来：小腊肠下来伸懒腰，金毛伸懒腰，他坐起来重新系好领带
      S.rig(dax, null); S.detach(dax, 40); S.hold(dax, 'stand');
      yield 0.4;
      S.act(dax, ['stretch', 'shakeoff'], 1.6);
      S.rig(gold, null); S.hold(gold, 'stand');
      S.act(gold, ['stretch', 'shakeoff'], 2.2);
      S.hold(man, 'p_sit'); S.face(man, 'sleepy');
      yield 1.2;
      S.rig(man, null); S.hold(man, ['p_knot', 'p_tie_a']); S.face(man, 'smile');
      yield 1.2;
    },
  });

  // ============================================================
  //  B18 偷偷跳舞被发现：她不在的时候，他在偷偷练习
  // ============================================================
  add({ name: 'caught_dancing', zh: '偷偷跳舞被发现', cast: 'man gold dax', weight: 4, cap: 1, fromDay: 3, tag: 'calm', mood: 'funny', timeout: 74,
    when: function (S) { return S.her.away && S.her.idle < 1150 && S.gold.energy > 0.4; },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax, s = man.face, back = false, i = 0;
      S.ball.pocket();                 // 两只手都要用：球先收进口袋（戏完了引擎会放回他手里）
      // 1. 他和金毛在跳华尔兹：金毛站起来，两只前爪搭在他手里；慢慢地转，他点着头数拍子。小腊肠坐着当观众，跟着晃
      yield S.go(gold, cx(S, man.x + s * (gold.half * 0.45 + 4)), man.y + S.ry(1), S.spd(gold, 'walk') * 1.5, null, 4);
      S.faceTo(gold, man); S.faceTo(man, gold);
      yield S.go(dax, cx(S, man.x - s * 34), man.y + S.ry(6), S.spd(dax, 'trot'), null, 4);
      S.faceTo(dax, man); S.hold(dax, 'sit'); dax.wag = 0.6;
      var hold = function () {
        S.hold(gold, ['rear', 'beg']); S.rig(gold, { pawAt: [gold.face * 10, 22] }); gold.wag = 0.7;
        S.hold(man, ['p_waltz', 'p_carry']); S.face(man, 'soft'); S.look(man, gold);
      };
      hold();
      // 一直跳，跳到她回来（最多一分钟）
      yield S.until(function () {
        if (!S.her.away || (S.cursor.known && S.cursor.still < 0.3)) { back = true; return true; }
        return false;
      }, 0.1);
      var t0 = S.t(), turnAt = 0;
      while (!back && S.t() - t0 < 58) {
        if (S.t() > turnAt) {
          turnAt = S.t() + 1.2; i++;
          var d = (i % 2 ? 1 : -1) * 4;
          S.slide(man, d, 0, 0.6); S.slide(gold, d, 0, 0.6); S.slide(dax, i % 2 ? 1 : -1, 0, 0.6);
          S.emote('note', man, 0, 0.8);
        }
        yield 0.1;
        if (!S.her.away || (S.cursor.known && S.cursor.still < 0.3 && S.her.idle < 2)) back = true;
      }
      if (!back) { S.hold(man, null); S.rig(gold, null); S.hold(gold, 'stand'); yield 0.5; return; }
      // 2. 小腊肠先发现了她：！汪
      S.faceTo(dax, 'cursor'); S.emote('bang', dax, 0, 0.6); dax.bark = 0.3; S.hold(dax, 'stand');
      yield 0.5;
      // 3. 他一步停在半空，转过来看着她：愣住。金毛还在晃
      S.hold(man, 'p_front'); glance(S, 'surprised');
      yield 0.6;
      // 4. 松开手，清清嗓子，正领带，看手表，吹个口哨：什么都没发生。脸红
      S.rig(gold, null); S.hold(gold, 'sit');
      S.hold(man, 'p_tie_a'); S.face(man, 'blush'); S.look(man, null);
      yield 0.6;
      S.hold(man, 'p_watch'); S.emote('note', man, 0, 0.9);
      yield 0.8;
      // 5. 金毛还没跳够，又把爪子搭上来；他认了，再转一圈，对她鞠一躬
      S.faceTo(man, gold); hold();
      yield 0.6;
      S.slide(man, 4, 0, 0.6); S.slide(gold, 4, 0, 0.6);
      yield 0.6;
      S.rig(gold, null); S.hold(gold, 'sit'); gold.wag = 1;
      S.hold(man, ['p_bow', 'p_front']); glance(S, 'blush');
      yield 1.1;
    },
  });

  // ============================================================
  //  B19 口袋里的照片（我们从来看不到照片上是谁；她知道）
  // ============================================================
  add({ name: 'pocket_photo', zh: '口袋里的照片', cast: 'man gold dax', cap: 1, tag: 'calm', mood: 'tender', fromDay: 3,
    weight: function (S) { return S.time.h >= 18 ? 2 : 0.5; },
    when: function (S) { return S.her.present && !S.her.engaged && S.dist(S.gold, S.man) < 180; },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax, s = man.face, gs;

        }
      }
      // 4-5.5 秒：坐下。往左歪头、往右歪头——三个点：在想
      S.hold(gold, 'sit');
      S.rig(gold, { tilt: -1 }); S.emote('dots', gold, 0, 1.2);
      yield 0.6;
      S.rig(gold, { tilt: 1 });
      yield 0.7;
      // 5.5-6.5 秒：亮了！歪着头一跳：树枝竖着送进去，然后是狗，然后是尾巴
      S.emote('spark', gold, 0, 0.6);
      S.rig(gold, { tilt: 1 });
      yield 0.3;
      S.hold(gold, 'stand');
      var ok2 = yield* S.enterIsland(gold);
      if (ok2) {
        S.pulse('gulp');
        S.faceTo(dax, I.x); S.hold(dax, 'sit'); S.rig(dax, { tilt: 1 });
        yield 2.0;
        S.rig(dax, null);
        yield* S.leaveIsland(gold);
        S.hold(gold, 'stand'); gold.wag = 1; S.emote('heart', gold, 0, 1.0);
        yield 0.8;
      }
    },
    end: function (S) { var p = S.prop.find('stick'); if (p && p.holder) { S.prop.drop(p); S.prop.set(p, ''); } } });

  // ============================================================
  //  E06 小狗对着屏幕外报警，大狗来撑腰（小腊肠走到屏幕左右边上的时候）
  // ============================================================
  function* sentinel(S, side) {
    var dax = S.dax, gold = S.gold, man = S.man, F = S.field, out = side === 'left' ? -1 : 1, i;
    var edgeX = out < 0 ? F.x0 : F.x1;
    // 0-1 秒：在边上停下，竖起来、举着一只爪，耳朵朝前，瞪着屏幕外面
    if (Math.abs(dax.x - edgeX) > dax.half + 30) yield S.go(dax, edgeX - out * (dax.half + 14), dax.y, 'trot', null, 4);
    dax.face = out; S.hold(dax, 'alert'); S.rig(dax, { pawUp: true, ears: -1 }); S.mood(dax, 'focused');
    S.look(dax, { x: edgeX + out * 60, y: dax.y, z: 10 });
    yield 0.8;
    // 1-2.5 秒：尖声叫三下，每叫一下往后一跳（隔得远远的才勇敢）
    S.rig(dax, { ears: -1 });
    for (i = 0; i < 3; i++) {
      woof(S, dax); S.hop(dax, 50); S.slide(dax, -out * 3, 0, 0.25);
      yield 0.5;
    }
    // 2.5-4.5 秒：金毛在哪儿都抬起头，叹口气，晃过来也往外看；小腊肠胆子大了，往前一步再叫
    S.look(gold, dax); sigh(S, gold);
    yield 0.4;
    yield S.go(gold, at(S, dax.x - out * 4, cy(S, dax.y + S.ry(-6)), gold), S.spd(gold, 'walk') * 1.6, null, 5);
    gold.face = out; S.hold(gold, 'stand'); S.look(gold, { x: edgeX + out * 80, y: gold.y, z: 14 });
    yield S.slide(dax, out * 6, 0, 0.3);
    woof(S, dax);
    yield 0.6;
    // 4.5-5.5 秒：金毛低低地"汪"一声
    woof(S, gold, true);
    yield 1.0;
    // 5.5-6.5 秒：都竖着耳朵听，头往两边歪。什么都没有
    S.rig(dax, { tilt: 1 }); S.rig(gold, { tilt: -1 });
    yield 1.0;
    // 6.5-8 秒：金毛低头看小腊肠（问号）；小腊肠得意地在边上蹬两下草，甩甩毛，挺着胸走回去，坐在他旁边，他摸摸它
    S.rig(gold, null); S.look(gold, dax); S.emote('q', gold, 0, 0.9);
    S.rig(dax, null); S.mood(dax, 'proud'); S.look(dax, null);
    yield S.act(dax, ['kick_scuff', 'kick'], 1.6);
    S.bits(dax.x - dax.face * dax.half, dax.y, 3, S.grass(), 16, 24);
    yield S.act(dax, ['shake_off', 'shakeoff'], 1.2);
    if (ok(S, man) && S.free(man) && S.join(man)) {
      yield S.go(dax, S.atHand(dax), 'trot', null, 6);
      S.faceTo(dax, man); S.faceTo(man, dax); S.hold(dax, 'sit');
      S.hold(man, 'p_pat'); S.face(man, 'smile'); S.emote('heart', dax, 0, 1.0); dax.happy = 1;
      yield 1.2;
      S.hold(man, null); dax.happy = 0;
    } else {
      S.rig(dax, { tailSet: 70 });
      yield S.go(dax, at(S, dax.x - out * 50, dax.y, dax), 'walk', null, 3);
    }
  }
  add({ name: 'sentinel_and_backup', zh: '小狗对着屏幕外报警，大狗来撑腰', kind: 'react', on: 'edge', cast: 'dax gold', cool: 900, chance: 0.6, mood: 'proud', tag: 'lively', timeout: 22,
    when: function (S, ev) { return !!ev && ev.who === S.dax && (ev.side === 'left' || ev.side === 'right') && !S.night() && S.time.h >= 7 && S.time.h < 20 && awake2(S); },
    run: function* (S, ev) { yield* sentinel(S, ev.side); } });

  // ============================================================
  //  E07 程序坞当沙发（金毛背靠着它睡）；小腊肠想在坞角底下打洞
  //  没有程序坞：靠着屏幕最下面那条边睡，在屏幕下面的角落里刨
  // ============================================================
  add({ name: 'dock_sofa', zh: '程序坞当沙发', kind: 'solo', cast: 'gold', mood: 'sleepy', timeout: 80,
    weight: function (S) { var q = S.quietFor(); return q > 60 ? (S.dock() ? 6 : 3) : 0; }, cool: 300,
    when: function (S) { return !S.night(); },
    run: function* (S) {
      var d = S.me, D = dockLine(S, false), F = S.field;
      if (!D) return;
      var x = Math.max(D.x0 + d.half, Math.min(D.x1 - d.half, d.x + S.rand(-40, 40)));
      yield S.go(d, cx(S, x, d), D.y, 'walk', null, 12);
      // 顺着它转一圈，背贴着它"咚"地躺下，尾巴搭在边上
      d.face = S.chance(0.5) ? 1 : -1;
      yield S.act(d, 'nest_circle');
      S.hold(d, 'lie'); S.rig(d, { tailSet: -60, chin: true }); sigh(S, d);
      yield 2.0;
      S.rig(d, { tailSet: -60, chin: true, eyes: 'closed' });
      yield 1.5;
      S.hold(d, 'sleep'); S.rig(d, { tailSet: -60 });
      yield S.rand(20, 45);
      S.rig(d, null); S.hold(d, 'stand');
      yield S.act(d, 'wake_stretch');
    } });
  add({ name: 'dock_dig', zh: '小腊肠想在程序坞的角底下打洞', kind: 'solo', cast: 'dax', weight: 1, cool: 1200, mood: 'mischievous', timeout: 20,
    run: function* (S) {
      var d = S.me, D = dockLine(S, false), F = S.field;
      if (!D) return;
      // 程序坞圆圆的那一头和桌面接缝的地方；没有程序坞就是屏幕下面的角
      var left = Math.abs(d.x - D.x0) < Math.abs(d.x - D.x1), ex = D.dock ? (left ? S.dock().x : S.dock().x + S.dock().w) : (left ? F.x0 : F.x1);
      var face = D.dock ? (left ? 1 : -1) : (left ? -1 : 1);
      yield S.go(d, cx(S, ex - face * (d.mx - 2), d), D.y, 'trot', null, 10);
      d.face = face; S.hold(d, 'sniff'); sniffs(S, d);
      yield 0.8;
      sniffs(S, d);
      yield 0.6;
      // 刨 2.5 秒：屁股撅着，土渣乱飞，鼻子塞在角里
      S.hold(d, 'dig'); d.wag = 1;
      yield S.each(2.5, function (t) { if (Math.floor(t * 12) % 2) S.bits(d.x + d.face * 6, d.y, 1, 'dirt', 22, 40); });
      // 退出来，打个喷嚏，小跑走开（改天去另一头试试）
      S.hold(d, 'stand'); S.rig(d, { dirty: true });
      yield S.slide(d, -face * 8, 0, 0.5);
      yield S.act(d, 'sneeze', 0.7);
      achoo(S, d);
      yield S.go(d, at(S, d.x - face * 60, d.y + S.ry(-20), d), 'trot', null, 3);
    } });

  // ============================================================
  //  E08 程序坞后面的潜望镜尾巴：小腊肠躲到程序坞"后面"沿着走，只有竖着的尾巴尖在上沿露着走；
  //  金毛盯着那根尾巴尖，跟着走；到了另一头小腊肠一蹦，正好蹦到金毛脸上
  //  （没有程序坞时：场地贴着屏幕下边的话，就躲在屏幕下边"后面"走）
  // ============================================================
  add({ name: 'dock_shark_fin', zh: '程序坞后面的潜望镜尾巴', cast: 'dax gold', weight: function (S) { return dockLine(S, !nearBottom(S)) ? 1.5 : 0; },
    cool: 1200, mood: 'mischievous', tag: 'calm', timeout: 40,
    when: function (S) { return awake2(S) && !!dockLine(S, !nearBottom(S)); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, D = dockLine(S, !nearBottom(S)), i;
      if (!D) return;
      var V = S.view, dir = Math.abs(dax.x - D.x0) < Math.abs(dax.x - D.x1) ? 1 : -1;
      var x0 = dir > 0 ? D.x0 : D.x1, x1 = dir > 0 ? D.x1 : D.x0, len = Math.abs(x1 - x0);
      if (len < 90) return;
      if (len > 200) {             // 太长了：只走离小腊肠近的那 200
        x0 = Math.max(Math.min(D.x0, D.x1), Math.min(Math.max(D.x0, D.x1) - 200, dax.x - 100));
        if (dir < 0) x0 += 200;
        x1 = x0 + dir * 200; len = 200;
      }
      // 金毛在附近趴着
      yield S.go(gold, at(S, x0 + dir * len * 0.35, D.y - S.ry(16), gold), 'walk', null, 8);
      S.hold(gold, 'lie');
      // 0-1 秒：小跑到程序坞的一头，一步"迈到后面"：身子沉下去，只剩竖着的尾巴
      yield S.go(dax, cx(S, x0, dax), D.y, 'trot', null, 10);
      dax.face = dir;
      S.clip(dax, [-10, -10, V.w + 20, D.y + 9.5]);
      S.rig(dax, { tailSet: 85 });
      yield S.each(0.5, function (t) { dax.lift = -14 * Math.min(1, t / 0.5); });
      S.look(gold, { x: dax.x, y: D.y, z: 6 });
      // 1-5 秒：尾巴尖沿着上沿走；走到三分之一、三分之二各停一下，耳朵和眼睛冒出来看一眼
      for (i = 1; i <= 3; i++) {
        var tx = x0 + dir * len * i / 3;
        var c = S.go(dax, cx(S, tx, dax), D.y, 'trot', null, 6);
        yield S.each(Math.min(6, len / 3 / S.spd(dax, 'trot') + 0.5), function () {
          S.look(gold, { x: dax.x, y: D.y, z: 6 });
          if (i === 2 && gold.pose === 'lie') { S.hold(gold, 'stand'); S.follow(gold, dax, -(gold.mx - 4), S.ry(-10), 'walk'); }
        });
        yield c;
        if (i < 3) {
          yield S.each(0.25, function (t) { dax.lift = -14 + 7 * Math.min(1, t / 0.25); });
          yield 0.4;
          yield S.each(0.25, function (t) { dax.lift = -7 - 7 * Math.min(1, t / 0.25); });
        }
      }
      // 5-6 秒：到了另一头一蹦出来，正好蹦到金毛脸上；金毛伏下身子
      S.stop(gold);
      dax.lift = 0; S.clip(dax, null); S.rig(dax, null);
      S.faceTo(dax, gold); S.hop(dax, 110);
      yield S.slide(dax, 0, S.ry(-8), 0.3);
      S.emote('bang', gold, 0, 0.6); S.faceTo(gold, dax); S.hold(gold, 'bow'); gold.wag = 1;
      S.hold(dax, 'bow'); dax.wag = 1;
      yield 0.9;
      if (gold.energy >= 0.45 && S.chance(0.5)) { S.hold(gold, 'stand'); S.hold(dax, 'stand'); yield* S.run('chase'); }
    },
    end: function (S) { S.dax.lift = 0; } });
  // 场地是不是一直铺到屏幕最下面（没有程序坞时，"躲到屏幕下边后面"才说得通）
  function nearBottom(S) { return S.view.h - S.field.y1 < 6; }

  // ============================================================
  //  E09 够不着的那颗球：菜单栏上我们自己那个网球图标（外壳告诉我们它在哪；不知道就不演）
  // ============================================================
  add({ name: 'menubar_ball', zh: '够不着的那颗球', cast: 'dax gold man', cat: 'E', weight: 2, cap: 1, cool: 86400, fromDay: 3, mood: 'funny', tag: 'calm', timeout: 30,
    when: function (S) { var x = S.statusItem(); return S.roam && x !== null && x !== undefined && isFinite(x) && x > S.field.x0 && x < S.field.x1 && awake2(S) && S.ball.inHand(); },
    run: function* (S) {
      var dax = S.dax, gold = S.gold, man = S.man, sx = S.statusItem(), F = S.field, i, menu0 = S.mem.get('menuAt') || -1;
      var icon = { x: sx, y: F.y0, z: F.y0 + 6 };
      var jumped = function () { var m = S.mem.get('menuAt'); return m && m !== menu0 && S.now() - m < 2 && S.now() >= m; };
      function* jumpAll() { S.hop(dax, 90); S.hop(gold, 90); S.emote('bang', dax, 0, 0.6); S.emote('bang', gold, 0, 0.6); menu0 = S.mem.get('menuAt'); yield 0.6; }
      // 0-2 秒：小腊肠小跑到图标正下方，坐下，仰着头瞪着它
      yield S.go(dax, cx(S, sx + 4, dax), F.y0, 'trot', null, 10);
      S.faceTo(dax, sx); S.hold(dax, 'sit'); dax.look = 1; S.look(dax, icon); S.mood(dax, 'focused');
      yield 1.0;
      // 2-5 秒：跳三下，一下比一下高，都差得远；冲它叫一声
      var pw = [100, 125, 150];
      for (i = 0; i < 3; i++) { S.hold(dax, 'stand'); S.hop(dax, pw[i]); yield 0.75; if (jumped()) yield* jumpAll(); }
      dax.bark = 0.3; S.emote('woof', dax, dax.face * 10, 0.6);
      yield 0.5;
      // 5-7 秒：把金毛叫来；金毛立起来也够不着。两只一起往上看
      S.faceTo(dax, gold);
      yield S.go(gold, at(S, sx - 26, F.y0 + S.ry(2), gold), 'trot', null, 8);
      S.faceTo(gold, sx); S.hold(gold, 'rear'); S.rig(gold, { pawAt: [10, 22] }); S.look(gold, icon);
      S.faceTo(dax, sx); S.hold(dax, 'sit'); S.look(dax, icon);
      yield 1.4;
      if (jumped()) yield* jumpAll();
      S.rig(gold, null); S.hold(gold, 'sit'); gold.look = 1;
      // 7-9 秒：他走过来，顺着它们的目光往上看，看看手里的球，再看看图标，再看看球；把真球举给它们看：没兴趣
      yield S.go(man, cx(S, sx + 40, null), F.y0 + S.ry(8), 'stroll', null, 10);
      S.faceTo(man, sx); S.look(man, icon);
      yield 0.8;
      S.look(man, 'ball');
      yield 0.5;
      S.look(man, icon);
      yield 0.5;
      S.look(man, 'ball'); S.face(man, 'wry');
      yield 0.4;
      S.hold(man, ['p_show', 'p_hold']); S.look(man, dax);
      yield 1.0;
      if (jumped()) yield* jumpAll();
      // 9-11 秒：他耸耸肩，把真球远远丢出去：本能赢了
      S.hold(man, ['p_shrug', 'p_idle']); S.face(man, 'smile');
      yield 0.7;
      S.hold(man, null);
      S.fetch(1);
    } });
  // 她打开了菜单：记一下时间（正在看图标的那段戏会全体吓一跳）
  add({ name: 'menubar_ball_menu', zh: '（记下她打开菜单的时间）', kind: 'react', on: 'menu', cast: 'dax', overlay: true, timeout: 1,
    run: function* (S) { S.mem.set('menuAt', S.now()); } });

  // ============================================================
  //  E10 各有各的窝：小腊肠睡屏幕下面的一个角，金毛睡岛底下（或者程序坞正中间）；六成的觉在自己的窝里睡。
  //  她把睡着的谁拎到别处：它眨眨眼，看看四周，小跑回自己的窝。一天里第三次放在同一个新地方（40 以内）：闻一闻，转一圈，就睡这儿了
  // ============================================================
  function spotOf(S, d) {
    var F = S.field, m = S.mem.get('spot_' + d.kind), w = F.x1 - F.x0, h = Math.max(0, F.y1 - F.y0);
    if (m && isFinite(m.fx)) return { x: cx(S, F.x0 + m.fx * w, d), y: cy(S, F.y0 + m.fy * h) };
    if (d.kind === 'dax') return { x: cx(S, F.x0 + w * 0.08, d), y: F.y1 };
    var I = isle(S);
    if (I) return { x: cx(S, I.x - 18, d), y: I.y };
    return { x: cx(S, F.x0 + w * 0.5, d), y: F.y1 };
  }
  function setSpot(S, d) {
    var F = S.field, w = Math.max(1, F.x1 - F.x0), h = Math.max(1, F.y1 - F.y0);
    S.mem.set('spot_' + d.kind, { fx: (d.x - F.x0) / w, fy: F.y1 > F.y0 ? (d.y - F.y0) / h : 1 });
  }
  function* spotNap(S, d, first) {
    if (first) { S.rig(d, { eyes: 'closed' }); yield 0.4; S.rig(d, null); }
    yield S.act(d, 'nest_circle');
    S.hold(d, 'sleep'); sigh(S, d, true);
    S.mem.set('zz_' + d.kind, S.now());
    var t0 = S.t(), len = S.rand(30, 70), dreamAt = t0 + S.rand(10, 20);
    while (S.t() - t0 < len) {
      if (S.t() >= dreamAt) { dreamAt = S.t() + S.rand(20, 40); S.emote('thought_' + S.pick(d.kind === 'gold' ? ['ball', 'bone', 'shoe'] : ['butterfly', 'hole', 'tail']), d, d.face * 8, 3.0); yield S.act(d, 'dream_bubble'); continue; }
      yield 0.5;
    }
    S.mem.set('zz_' + d.kind, undefined);
    if (S.t() - t0 >= 45) {
      var list = S.mem.get('napSpots') || [];
      list.push({ x: Math.round(d.x), y: Math.round(d.y), day: S.time.day, k: d.kind });
      while (list.length > 6) list.shift();
      S.mem.set('napSpots', list);
    }
    S.hold(d, 'stand');
    yield S.act(d, 'wake_stretch');
  }
  add({ name: 'favourite_spot_nap', zh: '回自己的窝睡觉', kind: 'solo', cast: 'dog', mood: 'sleepy', timeout: 130, cool: 60,
    weight: function (S) { var q = S.quietFor(); return q > 90 ? 9 : (q > 30 ? 4 : 0); },
    when: function (S) { return !S.night(); },
    run: function* (S) {
      var d = S.me, p = spotOf(S, d);
      yield S.go(d, p, S.dist(d, p) > 150 ? 'trot' : 'walk', null, 14);
      yield* spotNap(S, d, false);
    },
    end: function (S, cancelled, why) {
      var d = S.me, z = S.mem.get('zz_' + d.kind);
      S.mem.set('zz_' + d.kind, undefined);
      if (cancelled && why === 'carried' && z !== undefined) S.mem.set('lifted_' + d.kind, S.now());
    } });
  add({ name: 'favourite_spot_return', zh: '被拎走了：回自己的窝（或者就睡这儿了）', kind: 'react', on: 'drop', cast: 'who', mood: 'sleepy', timeout: 120, keep: 2,
    when: function (S, ev) {
      var d = ev && ev.who;
      if (!d || d.isPerson) return false;
      var t = S.mem.get('lifted_' + d.kind), dt = S.now() - (+t || -1e9);
      return dt >= 0 && dt < 30;
    },
    run: function* (S) {
      var d = S.me, p = spotOf(S, d), k = 'relearn_' + d.kind, r = S.mem.get(k) || {};
      S.mem.set('lifted_' + d.kind, undefined);
      yield 0.5;
      // 眨眨眼，看看四周
      S.hold(d, 'stand'); S.rig(d, { eyes: 'closed' });
      yield 0.25;
      S.rig(d, null); S.look(d, { x: d.x - 30, y: d.y, z: 8 });
      yield 0.4;
      S.look(d, { x: d.x + 30, y: d.y, z: 8 });
      yield 0.4;
      S.look(d, null);
      // 一天里第三次放在同一个新地方：就睡这儿了
      if (r.day !== S.time.day || !(Math.abs(r.x - d.x) < 40 && Math.abs(r.y - d.y) < 40)) r = { day: S.time.day, x: d.x, y: d.y, n: 0 };
      r.n++;
      S.mem.set(k, r);
      if (r.n >= 3 || S.dist(d, p) < 30) {
        S.hold(d, 'sniff'); sniffs(S, d);
        yield 0.8;
        if (r.n >= 3) { setSpot(S, d); S.emote('spark', d, 0, 0.6); S.mem.set(k, undefined); }
      } else {
        yield S.go(d, p, 'trot', null, 12);
      }
      yield* spotNap(S, d, false);

      S.rig(dax, null); S.hold(dax, 'stand');
      S.toss('bone', man, dax, 0.3, 6);
      yield 0.35;
      S.emote('heart', dax, 0, 0.8); S.hold(dax, 'sit');
      S.hold(man, ['p_shh', 'p_front']); S.look(man, 'camera'); S.face(man, 'wink');
      yield 1.0;
      // 5. 喝完最后一口，杯子收回口袋
      S.hold(man, ['p_sip', 'p_hold']); S.face(man, 'soft'); S.look(man, null);
      yield 0.8;
      S.hold(man, ['p_pocket', 'p_hold']); S.item(man, null);
      yield 0.6;
      S.hold(man, null); S.rig(gold, null);
    },
  });

  // ============================================================
  //  D04 一起看夕阳：他拍拍身边空着的那块草地（唯一一次说"想你"，说得很轻）
  // ============================================================
  add({ name: 'sunset_watch', zh: '一起看夕阳', kind: 'react', on: ['dayphase', 'hour'], cast: 'man gold dax', tag: 'calm', mood: 'tender', keep: 90, cap: 1, timeout: 40,
    when: function (S, ev) {
      if (!S.her.present || S.night()) return false;
      var sh = S.cfg.sunsetHour;
      if (sh !== null && sh !== undefined && sh !== '') return ev.name === 'hour' && ev.h === +sh;
      return ev.name === 'dayphase' && ev.phase === 'dusk' && S.time.h >= 15;
    },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax, F = S.field;
      S.ball.pocket();
      // 1. 他停下来，看向近的那一边屏幕，走到下面三分之一靠中间的地方，朝着那边坐下
      var side = man.x < (F.x0 + F.x1) / 2 ? -1 : 1;
      S.look(man, { x: man.x + side * 100, y: man.y, z: 20 }); S.face(man, 'soft');
      yield 0.8;
      var p = lowPt(S, (F.x0 + F.x1) / 2 - side * 20);
      yield S.go(man, p, 24, null, 8);
      man.face = side; S.hold(man, 'p_sit');
      yield 0.6;
      // 2. 金毛挨着他坐下，他把手臂搭在它背上；小腊肠爬到他腿上坐着
      var a = S.go(gold, cx(S, man.x - side * (gold.half * 0.5 + 4)), man.y + S.ry(-2), S.spd(gold, 'walk') * 1.5, null, 5);
      var b = S.go(dax, cx(S, man.x + side * 16), man.y + S.ry(3), S.spd(dax, 'trot'), null, 5);
      yield S.all(a, b);
      gold.face = side; S.hold(gold, 'sit'); gold.wag = 0.2;
      S.hold(man, ['p_sit_arm', 'p_sit']);
      S.attach(dax, man, 'lap', 2, 0, false, 1); S.hold(dax, 'sit');
      yield 1.0;
      // 3. 一动不动地坐着。草地慢慢换成黄昏的颜色；一颗心慢慢升起来；金毛的尾巴扫一下
      S.look(man, { x: man.x + side * 200, y: man.y, z: 40 }); S.look(gold, { x: gold.x + side * 200, y: gold.y, z: 30 }); S.look(dax, { x: dax.x + side * 200, y: dax.y, z: 30 });
      yield 4.0;
      S.emote('heart', man, 0, 2.4);
      yield 3.0;
      gold.wag = 0.7;
      yield 0.8;
      gold.wag = 0.1;
      yield 3.0;
      // 4. 他拍拍另一边空着的草地——那个空位——手就留在那儿
      S.hold(man, ['p_sit_arm', 'p_sit']); S.face(man, 'wistful'); S.look(man, { x: man.x - side * 14, y: man.y, z: 0 });
      var e = S.anchor(man, 'hand2');
      S.bits(man.x - side * 10, man.y, 2, S.grass(), 4, 8);
      yield 3.0;
      // 5. 起来：狗狗伸懒腰；黄昏里接着过日子
      S.face(man, 'soft'); S.detach(dax, 30); S.hold(dax, 'stand'); S.hold(gold, 'stand'); S.look(man, null);
      yield 0.5;
      S.act(dax, 'stretch', 1.6); S.act(gold, 'stretch', 2.2);
      S.hold(man, null);
      yield 2.0;
    },
  });

  // ============================================================
  //  D05 哈欠会传染（她也许也被传染了——没有谁叫她去睡觉）
  // ============================================================
  add({ name: 'yawn_chain', zh: '哈欠会传染', cast: 'man gold dax', weight: 8, cap: 1, tag: 'calm', mood: 'sleepy', family: 'sleep',
    when: function (S) { var n = nightStart(S); return n >= 0 && S.time.h === (n + 23) % 24 && S.her.present; },
    run: function* (S) {
      var man = S.man, gold = S.gold, dax = S.dax;
      S.look(gold, man); S.look(dax, gold);
      // 1. 他捂着嘴打个哈欠
      yield S.act(man, 'yawn', 1.6);
      // 2. 金毛看着他，也张大嘴打了个哈欠
      yield S.act(gold, 'yawn', 1.7);
      // 3. 小腊肠扭过头去忍着……没忍住，打了一个最大的，只好坐下
      dax.face = -dax.face; S.rig(dax, { jaw: 0.1 });
      yield 0.6;
      S.rig(dax, null); S.faceTo(dax, man);
      yield S.act(dax, 'yawn', 1.1);
      S.hold(dax, 'sit');
      // 4. 他看到了，又打一个，认输
      S.face(man, 'sleepy');
      yield S.act(man, 'yawn', 1.6);
      // 5. 慢慢眨三下眼；金毛趴下
      S.face(man, 'sleepy'); S.hold(gold, 'lie'); S.rig(gold, { eyes: 'closed' });
      yield 1.6;
    },
  });

  // ============================================================
  //  D06 睡前故事（他最后回头看的那一眼，是给她的）
  // ============================================================
  add({ name: 'bedtime_story', zh: '睡前故事', cast: 'man dax gold', weight: 10, cap: 1, tag: 'calm', mood: 'sleepy', family: 'carry', timeout: 74,
    when: function (S) {
      var I = S.island();
      return S.night() && S.her.idle > 20 && S.quietFor() < 120 && !!(I && I.on && S.roam);
    },
    run: function* (S) {
      var man = S.man, dax = S.dax, gold = S.gold, I = S.island(), defiant = S.chance(0.3), i;
      if (!I) return;
      S.ball.pocket();
      // 1. 他走到岛底下坐好，从西装里掏出一本小书，翻开
      yield S.go(man, I.x, cy(S, I.y + 26), 24, null, 8);
      // （画的人还没画坐着读书的 p_read：那就站着捧书读——坐着的画面手里拿不了东西）
      var reading = S.has(man, 'p_read') ? 'p_read' : 'p_gaze';
      if (reading === 'p_read') S.hold(man, 'p_sit');
      S.face(man, 'soft');
      S.hold(man, 'p_pocket'); S.item(man, 'book_open');
      yield 0.6;
      S.hold(man, reading);
      // 2. 两只狗面朝他趴下；小腊肠的下巴搁在金毛的爪子上
      var a = S.go(gold, cx(S, man.x + man.face * (gold.half + 30)), man.y + S.ry(-3), S.spd(gold, 'walk') * 1.5, null, 5);
      var b = S.go(dax, cx(S, man.x + man.face * (dax.half + 10)), man.y + S.ry(7), S.spd(dax, 'walk') * 1.6, null, 5);
      yield S.all(a, b);
      S.faceTo(gold, man); S.faceTo(dax, man); S.hold(gold, 'lie'); S.hold(dax, 'lie'); S.rig(dax, { chin: true });
      if (defiant) {
        // "我不困"：小腊肠伏下身子冲他叫，绕着跑一小圈，叫到一半打了个哈欠……他把它像法棍一样抱起来
        yield 1.5;
        S.rig(dax, null); S.hold(dax, 'bow'); S.mood(dax, 'happy'); dax.wag = 1;
        yield 0.7;
        yield S.orbit(dax, { x: dax.x, y: dax.y }, 30, 10, 1, S.spd(dax, 'trot'));
        dax.bark = 0.3;
        yield 0.3;
        yield S.act(dax, 'yawn', 1.1);
        S.item(man, null); S.hold(man, null);
        yield S.go(man, S.manAt(dax, 12), 'stroll', null, 3);
      } else {
        // 3. 他读着，三秒翻一页。小腊肠的眼睛闭上了，翻成侧躺；金毛的头一点、一抬、又一点
        for (i = 0; i < 3; i++) {
          yield 1.5;
          S.item(man, 'book_turn');
          yield 0.25;
          S.item(man, 'book_open');
          if (i === 0) { S.rig(dax, { eyes: 'closed' }); }
          if (i === 1) { S.rig(dax, null); S.hold(dax, ['flop', 'sleep']); S.rig(dax, { eyes: 'closed' }); S.mood(gold, 'sleepy'); gold.look = -0.4; }
          if (i === 2) { gold.look = 0.2; }
          yield 1.2;
          gold.look = -0.4;
        }
        // 4. 他发现了，轻轻合上书，竖起手指：嘘
        S.item(man, 'book_closed');
        yield 0.5;
        S.item(man, null); S.hold(man, ['p_shh', 'p_front']); S.look(man, 'camera'); S.face(man, 'soft');
        yield 1.4;
        S.hold(man, null);
        yield S.go(man, S.manAt(dax, 12), 'stroll', null, 3);
      }
      // 5. 他把睡着的小腊肠抱起来；碰碰金毛，金毛眯着眼慢吞吞跟上
      S.faceTo(man, dax); S.hold(man, ['p_place', 'p_crouch']);
      yield 0.5;
      S.rig(dax, null); S.attach(dax, man, 'arms', 0, 0, false, 1); S.hold(dax, ['cradle', 'sleep']); S.rig(dax, { eyes: 'closed' });
      S.hold(man, ['p_carry', 'p_hold']); S.face(man, 'soft');
      S.hold(gold, 'stand'); S.mood(gold, 'sleepy'); S.rig(gold, { eyes: 'slit' });
      S.follow(gold, man, gold.half + 8, S.ry(-3), S.spd(gold, 'walk') * 0.9);
      yield S.go(man, I.x, cy(S, I.y + 8), 20, ['p_carry', 'p_hold'], 5);
      S.stop(gold); S.hold(gold, 'sit');
      // 6. 到了岛底下：他回头看她，小小地挥一下手说晚安（然后它们就回岛里睡了）
      S.look(man, 'camera');
      yield 0.6;
      S.hold(man, ['p_carry', 'p_hold']); S.face(man, 'smile');
      S.say('night', ['晚安', '晚安', 'Good night']);
      S.emote('z', dax, 0, 1.6);
      yield 1.6;
      // 抱着睡着的小腊肠等一会儿：她不碰它们，大家就回岛（引擎的"夜里回岛"），没等到也就散了
      yield S.until(function () { return S.quietFor() > 150; }, 30);
    },
  });

  // ============================================================
  //  D08 他那边天亮了 / 他那边要睡了（时区表在她电脑上：不联网）
  // ============================================================
  add({ name: 'his_time', zh: '他那边天亮了／他那边要睡了', kind: 'react', on: 'minute', cast: 'man', tag: 'calm', mood: 'tender', timeout: 8,
    when: function (S) {
      if (!S.her.present || S.night()) return false;
      var hm = hisHM(S), c = S.cfg;
      return !!hm && (hm === (c.hisMorning || '07:30') || hm === (c.hisNight || '23:30'));
    },
    run: function* (S) {
      var man = S.man, gold = S.gold, morning = hisHM(S) === (S.cfg.hisMorning || '07:30');
      S.ball.pocket();
      if (morning) {
        // 他的早上：伸个懒腰，头顶升起一个小太阳；掏出杯子抿一口，朝她举一举：干杯
        S.emote('sun', man, 0, 1.5);
        yield S.act(man, ['stretch', 'p_reach'], 1.6);
        S.hold(man, ['p_pocket', 'p_hold']); S.item(man, 'cup');
        yield 0.5;
        S.hold(man, ['p_sip', 'p_hold']); S.face(man, 'sleepy');
        yield 0.9;
        S.hold(man, ['p_show', 'p_front']); S.look(man, 'camera'); S.face(man, 'smile');
        if (S.dist(gold, man) < 120) S.emote('zs', gold, 0, 1.0);
        yield 1.2;
        S.item(man, null);
      } else {
        // 他的晚上：一个小月亮；转过来，小小地挥手说晚安，手在心口停一下
        S.emote('moon', man, 0, 1.5);
        S.hold(man, 'p_front'); S.look(man, 'camera'); S.face(man, 'soft');
        yield 1.2;
        S.hold(man, { f: ['p_wave_a', 'p_wave_b'], fps: 4 });
        S.say('hisNight');
        yield 0.9;
        S.hold(man, ['p_heart', 'p_front']);
        yield 1.0;
      }
      S.hold(man, null);
    },
  });

  // ============================================================
  //  D09 五点二十（一天只有一分钟的秘密）
  // ============================================================
  add({ name: 'secret_minute', zh: '五点二十', kind: 'react', on: 'minute', cast: 'man', tag: 'calm', mood: 'tender', timeout: 6,
    when: function (S, ev) {
      var list = S.cfg.secretTimes;
      if (list === undefined || list === null) list = ['13:14', '17:20'];

    run: function* (S) {
      var man = S.man, gold = S.gold, big = S.time.md === '05-20';
      // 1. 瞄一眼手表
      S.hold(man, 'p_watch'); S.face(man, 'neutral');

      // 2. 正对着她看过来；胸口的口袋里冒出一颗小心，他拍拍口袋
      S.hold(man, 'p_front'); S.look(man, 'camera'); S.face(man, 'soft');
      S.emote(big ? 'heart' : 'hs', man, man.face * 1.5, 1.4);
      if (big) { S.emote('heart', S.dax, 0, 1.2); S.emote('heart', gold, 0, 1.2); }
      yield 0.5;
      S.hold(man, ['p_heart', 'p_front']);
      yield 0.6;
      // 3. 金毛抬头看那颗心，摇尾巴；他转回去，好像什么都没发生
      if (S.dist(gold, man) < 140) S.emote('q', gold, 0, 0.6);
