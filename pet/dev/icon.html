<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script src="../web/config.js"></script>
<script src="../web/sprites.js"></script>
<script src="../web/dogs.js"></script>
<script>
// 开发用：画 App 图标（圆角方块 + 小腊肠 + 小球）
var S = window.PET_SPRITES.build(window.PET_CONFIG);
var c = document.getElementById('c'), x = c.getContext('2d');
x.imageSmoothingEnabled = false;
function rr(px, py, w, h, r) { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); }
var g = x.createLinearGradient(0, 100, 0, 924);
g.addColorStop(0, '#bfe3f7'); g.addColorStop(0.62, '#e4f3fb'); g.addColorStop(0.62, '#9fd18b'); g.addColorStop(1, '#86bf74');
var FULL = location.search.indexOf('full=1') >= 0;   // iPhone 图标：铺满整个方块，系统自己会切圆角
if (FULL) { g = x.createLinearGradient(0, 0, 0, 1024); g.addColorStop(0, '#bfe3f7'); g.addColorStop(0.64, '#e4f3fb'); g.addColorStop(0.64, '#9fd18b'); g.addColorStop(1, '#86bf74'); x.fillStyle = g; x.fillRect(0, 0, 1024, 1024); x.save(); x.translate(512, 512); x.scale(1.12, 1.12); x.translate(-512, -512); }
else { rr(100, 100, 824, 824, 186); x.fillStyle = g; x.fill(); x.save(); rr(100, 100, 824, 824, 186); x.clip(); }
// 小腊肠：用骨架渲染器摆一个摇尾巴的站姿
var rig = window.PET_DOGS.create('dax', 'dax_' + ((window.PET_CONFIG || {}).dachshund || 'red'));
rig.blinkAt = 99; rig.wagT = 0.25;
for (var i = 0; i < 90; i++) rig.update(1 / 60, { pose: 'stand', wag: 0.8, pant: true });
var o = rig.render(false), dc = document.createElement('canvas');
dc.width = o.w; dc.height = o.h;
var dctx = dc.getContext('2d'), did = dctx.createImageData(o.w, o.h);
did.data.set(o.data); dctx.putImageData(did, 0, 0);
var k = 19, bw = o.box[2] - o.box[0] + 1, bh = o.box[3] - o.box[1] + 1;
x.drawImage(dc, o.box[0], o.box[1], bw, bh, Math.round(512 - bw * k / 2) + 4, 690 - bh * k, bw * k, bh * k);
var b = S.ball0, kb = 26;
x.drawImage(b.img, 250, 190, b.w * kb, b.h * kb);
var h = S.fx_heart, kh = 18;
x.drawImage(h.img, 640, 250, h.w * kh, h.h * kh);
x.restore();
</script></body></html>
