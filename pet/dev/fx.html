<!doctype html>
<html><head><meta charset="utf-8"><title>fx gallery (dev)</title>
<!--
  开发用：把 web/fx.js 里的小球、影子、小道具、表情都摆出来放大看。
  网址里可以加：?res=2（一个世界单位画几个像素）&zoom=8（放大几倍）&f=heart（只看名字里带这个的）&anim=0（不要最下面会动的那一排）
-->
<style>
  body { margin: 10px; font: 11px/1.3 monospace; background: #17181c; color: #c8c8cf; }
  h2 { font: bold 13px monospace; margin: 18px 0 6px; color: #fff; }
  .note { color: #8d8f99; margin: 0 0 6px; }
  canvas { image-rendering: pixelated; display: block; }
  .strip { margin-bottom: 8px; }
  .labels { position: relative; height: 26px; }
  .labels span { position: absolute; top: 2px; white-space: nowrap; }
  .labels small { color: #7f828c; display: block; }
  #err { color: #f66; white-space: pre-wrap; font-size: 14px; }
</style></head>
<body>
<div id="err"></div><div id="out"></div>
<script src="../web/config.js"></script>
<script src="../web/fx.js"></script>
<script src="../web/lawn.js"></script>
<script src="../web/dogs.js"></script>
<script src="../web/person.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var R = Math.max(1, Math.min(4, parseInt(q.get('res') || '2', 10))), Z = parseInt(q.get('zoom') || String(Math.round(16 / R)), 10), filt = q.get('f') || '';
  var out = document.getElementById('out');
  try {
    var FX = window.PET_FX, S = FX.build(window.PET_CONFIG || {}, R);
    var lawnDay = window.PET_LAWN ? window.PET_LAWN.render(400, 60, 'day', R, { seed: 5 }) : null;
    var lawnNight = window.PET_LAWN ? window.PET_LAWN.render(400, 60, 'night', R, { seed: 5 }) : null;
    var BGS = [['light', '#f0f2f6'], ['dark', '#20242b'], ['grass', lawnDay]];

    function toCanvas(im) {
      var c = document.createElement('canvas'); c.width = im.w; c.height = im.h;
      var id = c.getContext('2d').createImageData(im.w, im.h); id.data.set(im.data); c.getContext('2d').putImageData(id, 0, 0);
      return c;
    }
    var cache = new Map();
    function cv(im) { var c = cache.get(im); if (!c) { c = toCanvas(im); cache.set(im, c); } return c; }
    function h2(t, note) {
      var h = document.createElement('h2'); h.textContent = t; out.appendChild(h);
      if (note) { var p = document.createElement('div'); p.className = 'note'; p.textContent = note; out.appendChild(p); }
    }
    function paintBg(ctx, bg, w, h, ox) {
      if (typeof bg === 'string') { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
      else if (bg) { var l = cv(bg); for (var x = 0; x < w; x += l.width) ctx.drawImage(l, x - (ox || 0) % 7, -6 * R); }
    }
    // 一排图：items = [{ im, label, dx, dy, align }]；每格 cellW x cellH（世界单位）；三种底色各画一遍
    function strip(items, cellW, cellH, bgs, place) {
      var div = document.createElement('div'); div.className = 'strip';
      var W = Math.max(1, items.length) * cellW * R, H = cellH * R;
      (bgs || BGS).forEach(function (b) {
        var c = document.createElement('canvas'); c.width = W; c.height = H; c.style.width = W * Z + 'px'; c.style.height = H * Z + 'px';
        var ctx = c.getContext('2d');
        paintBg(ctx, b[1], W, H);
        items.forEach(function (it, i) {
          var im = it.im, x, y;
          if (place === 'origin') { x = i * cellW * R + cellW * R / 2 - im.ox; y = (it.y === undefined ? cellH / 2 : it.y) * R - im.oy; }
          else if (place === 'ground') { x = i * cellW * R + cellW * R / 2 - (im.bb[0] + im.bb[2] + 1) / 2; y = (cellH - 1) * R - im.bb[3] - 1; }
          else { x = i * cellW * R + cellW * R / 2 - (im.bb[0] + im.bb[2] + 1) / 2; y = cellH * R / 2 - (im.bb[1] + im.bb[3] + 1) / 2; }
          ctx.drawImage(cv(im), Math.round(x), Math.round(y));
        });
        div.appendChild(c);
      });
      var lab = document.createElement('div'); lab.className = 'labels'; lab.style.width = W * Z + 'px';
      items.forEach(function (it, i) {
        if (!it.label) return;
        var s = document.createElement('span'); s.style.left = i * cellW * R * Z + 2 + 'px'; s.textContent = it.label;
        if (it.sub) { var sm = document.createElement('small'); sm.textContent = it.sub; s.appendChild(sm); }
        lab.appendChild(s);
      });
      div.appendChild(lab);
      out.appendChild(div);
    }
    function sized(im) { return ((im.bb[2] - im.bb[0] + 1) / R) + ' x ' + ((im.bb[3] - im.bb[1] + 1) / R) + ' wu'; }
    function named(names) { return names.filter(function (n) { return S[n] && (!filt || n.indexOf(filt) >= 0); }).map(function (n) { return { im: S[n], label: n, sub: sized(S[n]) }; }); }

    var i, items;
    if (!filt) {
      // ---- 小球 ----
      h2('ball(rot, squash, R)  ·  R = ' + R, '一圈 24 格，这里隔一格取一张（12 格）；白线跟着转。半径 4 个世界单位（连描边）。');
      items = []; for (i = 0; i < 12; i++) items.push({ im: FX.ball(i / 12 * Math.PI * 2, 0, R), label: 'rot ' + i + '/12' });
      strip(items, 11, 11, null, 'origin');
      h2('压扁：squash 0 → 1（贴着地面，变宽，体积不变）；后面几格是额外的"拉长"：squash < 0，dir = 拉长的方向');
      items = []; for (i = 0; i <= 4; i++) items.push({ im: FX.ball(0.8, i / 4, R), label: 'squash ' + i / 4, y: 5 });
      for (i = 1; i <= 2; i++) items.push({ im: FX.ball(0.8, -i / 2, R), label: 'squash -' + i / 2, y: 5 });
      for (i = 0; i < 4; i++) items.push({ im: FX.ball(2.0, -1, R, i * Math.PI / 4), label: 'dir ' + i + 'π/4', y: 5 });
      strip(items, 11, 11, null, 'origin');
      // ---- 影子 ----
      h2('shadow(halfW, alpha, R)', '半宽 2 3 4 6 9 13 16 19（球、小人、两只狗大概用这些）；中间实、往外淡两级。');
      var SHBG = [['light', '#f0f2f6'], ['white', '#ffffff'], ['grass', lawnDay], ['night', lawnNight]];
      strip([2, 3, 4, 6, 9].map(function (w) { return { im: FX.shadow(w, 0.28, R), label: 'w=' + w }; }), 22, 6, SHBG, 'origin');
      strip([13, 16, 19].map(function (w) { return { im: FX.shadow(w, 0.28, R), label: 'w=' + w }; }), 42, 7, SHBG, 'origin');
      // ---- 碎屑 ----
      h2('px(color, R)');
      strip(['#9ccc66', '#6fae5c', '#478a60', '#8a6a4a', '#edbc7b', '#b2e5ff', '#ffffff', '#ffd342'].map(function (c) { return { im: FX.px(c, R), label: c }; }), 6, 3);
    }
    // ---- 小道具、表情 ----
    var all = Object.keys(S), extra = {};
    (FX.EXTRA || []).forEach(function (e) { extra[e.name] = e.what; });
    h2('build(cfg, R)：规定要有的 18 张');
    strip(named(['bone', 'bfly_a', 'bfly_b', 'bfly2_a', 'bfly2_b', 'puff0', 'puff1', 'puff2']), 13, 11);
    strip(named(['fx_heart', 'fx_hs', 'fx_bang', 'fx_note', 'fx_z', 'fx_zs', 'fx_q', 'fx_spark', 'fx_sweat', 'fx_woof']), 12, 11);
    h2('同一样东西的几帧，排在一起看（摆放框相同，所以换帧不会跳）');
    strip(named(['fx_heart_pop0', 'fx_heart_pop1', 'fx_heart_pop2', 'fx_heart', 'fx_spark0', 'fx_spark1', 'fx_spark2']), 12, 11);
    strip(named(['puff0', 'puff1', 'puff2', 'puff3']), 12, 7, null, 'ground');
    strip(named(['bfly_a', 'bfly_b', 'bfly_c', 'bfly_b', 'bfly_rest', 'bfly2_a', 'bfly2_b', 'bfly2_c', 'bfly2_b', 'bfly2_rest']), 12, 9);
    h2('PET_FX.EXTRA：新加的图（' + (FX.EXTRA || []).length + ' 张）');
    strip(named(['paw', 'paw_s', 'sod0', 'sod1', 'sod2', 'sod0_dusk', 'sod1_dusk', 'sod2_dusk', 'sod0_night', 'sod1_night', 'sod2_night']), 10, 9);
    strip(named(['bloom_w', 'bloom_y', 'bloom_p', 'bloom2_w', 'bloom2_y', 'bloom2_p']), 10, 6);
    strip(named(['leaf_a0', 'leaf_a1', 'leaf_a2', 'leaf_a3', 'leaf_b0', 'leaf_b1', 'leaf_b2', 'leaf_b3']), 10, 7);
    strip(named(['firefly0', 'firefly1', 'firefly2']), 10, 7, [['night', lawnNight], ['dark', '#20242b'], ['grass', lawnDay]]);
    var listed = {};
    ['bone', 'bfly_a', 'bfly_b', 'bfly2_a', 'bfly2_b', 'puff0', 'puff1', 'puff2', 'fx_heart', 'fx_hs', 'fx_bang', 'fx_note', 'fx_z', 'fx_zs', 'fx_q', 'fx_spark', 'fx_sweat', 'fx_woof',
      'fx_heart_pop0', 'fx_heart_pop1', 'fx_heart_pop2', 'fx_spark0', 'fx_spark1', 'fx_spark2', 'puff3', 'bfly_c', 'bfly_rest', 'bfly2_c', 'bfly2_rest',
      'paw', 'paw_s', 'sod0', 'sod1', 'sod2', 'sod0_dusk', 'sod1_dusk', 'sod2_dusk', 'sod0_night', 'sod1_night', 'sod2_night', 'bloom_w', 'bloom_y', 'bloom_p', 'bloom2_w', 'bloom2_y', 'bloom2_p', 'leaf_a0', 'leaf_a1', 'leaf_a2', 'leaf_a3', 'leaf_b0', 'leaf_b1', 'leaf_b2', 'leaf_b3', 'firefly0', 'firefly1', 'firefly2'].forEach(function (n) { listed[n] = 1; });
    // ---- 第二批：开饭、便便、收拾（R6），互动用的小道具和表情（R5）----
    var groups = [
      ['开饭（R6）：碗和狗粮（原点在底边正中，青色十字 = grip）', ['bowl_gold_empty', 'bowl_gold_half', 'bowl_gold_full', 'bowl_dax_empty', 'bowl_dax_half', 'bowl_dax_full', 'bowl_water_full', 'bowl_water_full2', 'bowl_water_low'], 16, 10, 'ground'],
      ['', ['bowls_stack_empty', 'bowls_stack_bag', 'kibble_bag_closed', 'kibble_bag_pour', 'kibble_fall_a', 'kibble_fall_b', 'kibble_bit'], 16, 18, 'ground'],
      ['便便和收拾（R6 4.4：干干净净、像玩具）', ['poop_s', 'poop_s_pop', 'poop_l', 'poop_l_pop', 'poop_gold', 'poop_gold_pop', 'poop_gold2', 'bag_roll', 'bag_open', 'bag_full', 'hanky', 'daisy_sprout', 'daisy_bloom'], 9, 9, 'ground'],
      ['', ['scooper_carry', 'scooper_full', 'scooper_use', 'bin_closed', 'bin_open', 'bin_pop'], 16, 20, 'ground'],
      ['表情（R6 + R5）', ['fx_food', 'fx_drool0', 'fx_drool1', 'fx_drool2', 'fx_sigh', 'fx_huff', 'fx_dots0', 'fx_dots1', 'fx_dots2', 'fx_blush', 'fx_wisp', 'fx_clover'], 12, 12],
      ['', ['fx_sniffs0', 'fx_sniffs1', 'fx_achoo', 'fx_achoo_y', 'fx_dizzy0', 'fx_dizzy1', 'fx_dizzy2', 'fx_dizzy3', 'fx_grr', 'fx_sun', 'fx_moon', 'fx_bigwoof'], 12, 14],
      ['', ['fx_thought', 'fx_thought_ball', 'fx_thought_bone', 'fx_thought_shoe', 'fx_thought_butterfly', 'fx_thought_hole', 'fx_thought_tail', 'fx_thought_heart', 'fx_thought_cursor', 'fx_thought_bouquet'], 15, 13],
      ['互动用的小道具（R5）', ['stick', 'stick_chewed', 'rope', 'rope_carry', 'rope_knot', 'leash', 'leash_handle', 'leash_carry'], 31, 16],
      ['', ['brush', 'brush_full', 'furball', 'furball_b', 'furball_c', 'cup', 'cup2', 'calendar', 'calendar_sheet', 'calendar_sheet2', 'photo', 'gnat', 'gnat2', 'lantern'], 10, 12, 'ground'],
      ['', ['basket', 'basket_front', 'book_open', 'book_turn', 'book_closed', 'gift_wrapped', 'gift_open', 'flower', 'flower_worn', 'cake_lit', 'cake_lit2', 'cake_bent', 'cake_out', 'envelope', 'bouquet', 'ribbon'], 14, 14, 'ground'],
      ['', ['blanket', 'blanket_edge', 'blanket_den', 'blanket_lump', 'blanket_folded'], 48, 30, 'ground'],
      ['草地上的贴花', ['mound', 'hole', 'nap_flower', 'nap_flower_y', 'nap_flower_p', 'fur', 'fur2', 'petal0', 'petal1', 'confetti0', 'confetti1', 'confetti2', 'confetti3', 'confetti4', 'confetti5', 'confetti6'], 10, 6, 'ground'],
      ['', ['flat_grass', 'flat_grass_dusk', 'flat_grass_night', 'sunpatch', 'lantern_glow'], 62, 26],
    ];
    groups.forEach(function (g) {
      var have = g[1].filter(function (n) { return S[n] && (!filt || n.indexOf(filt) >= 0); });
      if (!have.length) return;
      if (g[0]) h2(g[0]);
      strip(named(have), g[2], g[3], null, g[4]);
      have.forEach(function (n) { listed[n] = 1; });
    });
    // ---- 拿在手里 / 叼在嘴里：按 grip 对到他的 hand、狗的 mouth（真实大小 × 3）----
    if (window.PET_PERSON && window.PET_DOGS && !filt) {
      h2('拿在手里 / 叼在嘴里（grip 对到 hand / mouth；一个像素放大 3 倍）');
      var HW = 330, HH = 60, hc = document.createElement('canvas'); hc.width = HW * R; hc.height = HH * R; hc.style.width = HW * R * 3 + 'px'; hc.style.height = HH * R * 3 + 'px';
      out.appendChild(hc);
      var hx = hc.getContext('2d'); if (lawnDay) { hx.drawImage(cv(lawnDay), 0, 0); hx.drawImage(cv(lawnDay), lawnDay.w, 0); }
      var drawAt = function (im, x, y) { hx.drawImage(toCanvas(im), Math.round(x * R - im.ox), Math.round(y * R - im.oy)); };
      var holdAt = function (name, px, py) { var im = S[name]; if (!im) return; var g = im.grip || [im.ox, im.oy]; hx.drawImage(cv(im), Math.round(px * R - g[0]), Math.round(py * R - g[1])); };
      var manProps = ['kibble_bag_closed', 'scooper_carry', 'bag_full', 'cup', 'bouquet', 'book_closed', 'gift_wrapped'];
      manProps.forEach(function (n, i) {
        var rig = window.PET_PERSON.create(window.PET_CONFIG);
        for (var k = 0; k < 30; k++) rig.update(0.05, { frame: 'p_hold', holding: 'ball', t: k * 0.05 });
        var o = rig.render(false, R), x = 14 + i * 26, y = 52;
        drawAt(o, x, y); if (o.hand) holdAt(n, x + o.hand[0], y - o.hand[1]);
      });
      [['gold', 'stick'], ['dax', 'bowl_dax_empty'], ['gold', 'rope_carry']].forEach(function (d, i) {
        var rig = window.PET_DOGS.create(d[0], d[0] === 'gold' ? 'gold' : 'dax_red');
        for (var k = 0; k < 20; k++) rig.update(0.05, { pose: 'stand', carry: true });
        var o = rig.render(false, R), x = 205 + i * 48, y = 52;
        drawAt(o, x, y); if (o.mouth) holdAt(d[1], x + o.mouth[0], y - o.mouth[1]);
      });
    }
    var rest = all.filter(function (n) { return !listed[n]; });
    if (rest.length) { h2('其余的图（后来加的）'); for (i = 0; i < rest.length; i += 8) strip(named(rest.slice(i, i + 8)), 16, 18); }
    if (FX.EXTRA && FX.EXTRA.length && !filt) {
      var pre = document.createElement('div'); pre.className = 'note'; pre.style.whiteSpace = 'pre';
      pre.textContent = FX.EXTRA.map(function (e) { return e.name + '  ' + e.what; }).join('\n');
      out.appendChild(pre);
    }

    // ---- 会动的一排：按引擎里大概的节奏放 ----
    if (q.get('anim') !== '0' && !filt) {
      h2('动起来（一个像素放大 3 倍 = 屏幕上真实的大小）', '球滚过来、弹两下；爱心"啵"地冒出来往上飘；星星闪；灰尘；蝴蝶；落叶；夜里的萤火虫。');
      var AW = 190, AH = 46, ac = document.createElement('canvas'); ac.width = AW * R; ac.height = AH * R * 2; ac.style.width = AW * R * 3 + 'px'; ac.style.height = AH * R * 2 * 3 + 'px';
      out.appendChild(ac);
      var actx = ac.getContext('2d'), t0 = performance.now();
      var img = function (im, x, y) { actx.drawImage(cv(im), Math.round(x * R - (im.bb[0] + im.bb[2] + 1) / 2), Math.round(y * R - (im.bb[1] + im.bb[3] + 1) / 2)); };
      var org = function (im, x, y) { actx.drawImage(cv(im), Math.round(x * R - im.ox), Math.round(y * R - im.oy)); };
      var frame = function () {
        var t = (performance.now() - t0) / 1000, k;
        for (k = 0; k < 2; k++) {
          actx.save(); actx.translate(0, k * AH * R);
          if (lawnDay) actx.drawImage(cv(k ? lawnNight : lawnDay), 0, 0);
          var g = 36;                                                    // 地面在哪一行（世界单位）
          // 球：扔出来，弹两下，滚到停
          var u = t % 4, bx, bz, sq = 0, rot;
          if (u < 2.2) { bx = 12 + u * 44; var v = (u * 1.6) % 1, hgt = [16, 9, 4, 1.5][Math.min(3, Math.floor(u * 1.6))]; bz = 4 * hgt * v * (1 - v); if (v < 0.07 && u > 0.2) sq = 1 - v / 0.07; }
          else { bx = 12 + 2.2 * 44 + (1 - Math.exp(-(u - 2.2) * 2.5)) * 22; bz = 0; }
          rot = bx / 4;
          org(FX.shadow(Math.max(2, 4 - bz / 6), k ? 0.2 : 0.28, R), bx, g + 3.5);
          org(FX.ball(rot, sq, R), bx, g - bz);
          if (sq > 0) { var pf = S['puff' + Math.min(3, Math.floor((1 - sq) * 4))]; actx.drawImage(cv(pf), Math.round((bx + 5) * R - (pf.bb[0] + pf.bb[2] + 1) / 2), Math.round((g + 4.5) * R - pf.bb[3] - 1)); }
          // 爱心
          var hu = t % 1.6, hy = 16 - Math.min(1, hu / 1.3) * 9, hn = hu < 0.05 ? 'fx_heart_pop0' : (hu < 0.1 ? 'fx_heart_pop1' : (hu < 0.2 ? 'fx_heart_pop2' : 'fx_heart'));
          if (hu < 1.3) img(S[hn], 150 + Math.sin(hu * 5) * 1.2, hy); else if (hu < 1.4) img(S.fx_hs, 150, hy);
          // 星星
          var su = t % 0.9; if (su < 0.3) img(S[su < 0.05 ? 'fx_spark0' : (su < 0.18 ? 'fx_spark1' : 'fx_spark2')], 166, 14);
          // 蝴蝶
          var bf = ['a', 'b', 'c', 'b'][Math.floor(t * 12) % 4]; img(S[(k ? 'bfly2_' : 'bfly_') + bf], 172 + Math.sin(t * 1.3) * 10, 26 + Math.sin(t * 2.1) * 5);
          // 落叶
          var lu = (t * 0.5) % 1, lf = [0, 1, 2, 3, 2, 1][Math.floor(t * 6) % 6]; img(S['leaf_' + (k ? 'b' : 'a') + lf], 20 + Math.sin(lu * 9) * 6 + lu * 10, 4 + lu * 36);
          // 萤火虫（夜里那一排）
          if (k) for (var f = 0; f < 4; f++) { var ft = (t * 0.6 + f * 0.37) % 1, fn = ft < 0.5 ? 0 : (ft < 0.62 ? 1 : (ft < 0.9 ? 2 : 1)); img(S['firefly' + fn], 50 + f * 28 + Math.sin(t * 0.7 + f) * 6, 12 + Math.cos(t * 0.9 + f * 2) * 5); }
          actx.restore();
        }
        requestAnimationFrame(frame);
      };
      frame();
    }
  } catch (e) { document.getElementById('err').textContent = String(e && e.stack || e); }
})();
</script></body></html>
