# 在 GitHub 的云端 Mac 上编译"球球"桌宠，并做几项自检。
# 只在 pet/ 有改动时才跑。不想要的话，直接删掉这个文件即可，不影响桌宠本身。
name: pet-mac

on:
  push:
    branches: ['claude/**']
    paths: ['pet/**', '.github/workflows/pet-mac.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]   # xcode-27 这个镜像的系统是 macOS 27
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcode-select -p
          xcrun swiftc --version
          ls /Library/Developer/CommandLineTools 2>/dev/null | head -5 || true

      - name: Build with Command Line Tools only (what most people have)
        run: |
          if [ -d /Library/Developer/CommandLineTools/usr/bin ]; then
            DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun swiftc --version
            DEVELOPER_DIR=/Library/Developer/CommandLineTools bash pet/install.sh --build-only
            echo "CLT_BUILD_OK"
          else
            echo "CLT_NOT_PRESENT (skipped)"
          fi

      - name: Build (default toolchain)
        run: |
          bash pet/install.sh --build-only
          ls -la pet/build/QiuQiu.app/Contents pet/build/QiuQiu.app/Contents/MacOS pet/build/QiuQiu.app/Contents/Resources
          file pet/build/QiuQiu.app/Contents/MacOS/QiuQiu
          codesign -dv pet/build/QiuQiu.app 2>&1 | head -8 || true
          du -sh pet/build/QiuQiu.app

      - name: Full install, run, autostart file, uninstall
        run: |
          # 模拟"从网上下载 / AirDrop 收到的压缩包解压出来的文件夹"：
          # 给每个文件都打上系统的隔离标记（Gatekeeper 就是看这个标记拦人的），再照常安装
          xattr -rw com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" pet || true
          echo "quarantine on install.sh: $(xattr -p com.apple.quarantine pet/install.sh 2>/dev/null || echo none)"
          bash pet/install.sh --autostart
          sleep 4
          if pgrep -x QiuQiu >/dev/null; then echo "RUNNING_OK"; else echo "NOT RUNNING"; exit 1; fi
          ls -d /Applications/QiuQiu.app "$HOME/Applications/QiuQiu.app" 2>/dev/null || true
          INST=/Applications/QiuQiu.app; [ -d "$INST" ] || INST="$HOME/Applications/QiuQiu.app"
          echo "quarantined files left inside the installed app: $(xattr -lr "$INST" 2>/dev/null | grep -c com.apple.quarantine || true)"
          echo "Gatekeeper: $(spctl --status 2>&1 | head -1)"
          spctl --assess --type execute -v "$INST" 2>&1 | head -3 || true
          echo "---- LaunchAgent ----"
          cat "$HOME/Library/LaunchAgents/local.qiuqiu.deskpet.plist"
          plutil -lint "$HOME/Library/LaunchAgents/local.qiuqiu.deskpet.plist"
          plutil -lint /Applications/QiuQiu.app/Contents/Info.plist 2>/dev/null || plutil -lint "$HOME/Applications/QiuQiu.app/Contents/Info.plist"
          echo "---- second launch must not create a second copy ----"
          open -n /Applications/QiuQiu.app 2>/dev/null || open -n "$HOME/Applications/QiuQiu.app"
          sleep 3
          echo "instances: $(pgrep -x QiuQiu | wc -l | tr -d ' ')"
          echo "---- memory / cpu after a few seconds ----"
          ps -axo pid,rss,%cpu,comm | grep -E "QiuQiu|com.apple.WebKit" | grep -v grep | head -8 || true
          echo "---- uninstall ----"
          bash pet/uninstall.sh
          sleep 1
          if pgrep -x QiuQiu >/dev/null; then echo "STILL RUNNING"; exit 1; fi
          if [ -e /Applications/QiuQiu.app ] || [ -e "$HOME/Applications/QiuQiu.app" ] || [ -e "$HOME/Library/LaunchAgents/local.qiuqiu.deskpet.plist" ]; then echo "LEFTOVERS"; exit 1; fi
          echo "UNINSTALL_OK"
          echo "---- no-argument path of the script (old bash + set -u) ----"
          bash pet/install.sh --no-open && bash pet/uninstall.sh

      - name: Self-test (page renders, background is transparent)
        run: |
          APP=pet/build/QiuQiu.app/Contents/MacOS/QiuQiu
          "$APP" --selftest "$RUNNER_TEMP/snap.png" > "$RUNNER_TEMP/selftest.log" 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $PID 2>/dev/null; then echo "SELFTEST TIMEOUT"; kill $PID; fi
          CODE=0; wait $PID || CODE=$?
          cat "$RUNNER_TEMP/selftest.log"
          echo "selftest exit code: $CODE"
          if [ -f "$RUNNER_TEMP/snap.png" ]; then
            sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/snap.png" | tail -2
            sips -Z 1024 "$RUNNER_TEMP/snap.png" --out "$RUNNER_TEMP/snap_small.png" >/dev/null
            echo "-----BEGIN SNAP PNG-----"
            base64 -i "$RUNNER_TEMP/snap_small.png" | fold -w 120
            echo "-----END SNAP PNG-----"
          fi
          grep -q "SELFTEST PASS" "$RUNNER_TEMP/selftest.log"
          echo "---- for information only: would the system-default (GPU) canvas alone have worked on this machine? ----"
          QIUQIU_GPU_CANVAS=1 "$APP" --selftest "$RUNNER_TEMP/snap_gpu.png" 2>&1 | grep -E "^(CANVAS|SELFTEST (canvas|snapshot|PASS|FAIL))" | cut -c1-150 || true

      - name: Window level (the island must draw above the menu bar)
        run: |
          APP=pet/build/QiuQiu.app/Contents/MacOS/QiuQiu
          xcrun swiftc -O -o "$RUNNER_TEMP/ci_windows" pet/dev/ci_windows.swift
          "$APP" > /dev/null 2>&1 &
          PID=$!
          sleep 5
          "$RUNNER_TEMP/ci_windows" | tee "$RUNNER_TEMP/windows.txt" | head -30
          screencapture -x -R"212,0,600,90" "$RUNNER_TEMP/top.png" || true
          sips -s format jpeg -s formatOptions 60 "$RUNNER_TEMP/top.png" --out "$RUNNER_TEMP/top.jpg" >/dev/null
          echo "-----BEGIN top JPG-----"
          base64 -i "$RUNNER_TEMP/top.jpg" | fold -w 120
          echo "-----END top JPG-----"
          kill $PID 2>/dev/null || true
          MINE=$(grep 'name=QiuQiu ' "$RUNNER_TEMP/windows.txt" | head -1 | sed -E 's/.*layer=(-?[0-9]+).*/\1/')
          BAR=$(grep 'name=Menubar ' "$RUNNER_TEMP/windows.txt" | head -1 | sed -E 's/.*layer=(-?[0-9]+).*/\1/')
          echo "pet window layer: ${MINE:-?}   menu bar layer: ${BAR:-?}"
          if [ -n "$MINE" ] && [ -n "$BAR" ] && [ "$MINE" -gt "$BAR" ]; then echo "LEVEL_OK"; else echo "LEVEL_NOT_ABOVE_MENU_BAR"; exit 1; fi
          sleep 0.7

      - name: Live run (real screen, mouse drag, click-through)
        run: |
          APP=pet/build/QiuQiu.app/Contents/MacOS/QiuQiu
          LOG="$RUNNER_TEMP/app.log"
          xcrun swiftc -O -o "$RUNNER_TEMP/ci_mouse" pet/dev/ci_mouse.swift
          # 关掉自动丢球，让画面基本静止，鼠标测试才对得准
          defaults write local.qiuqiu.deskpet auto -bool false
          "$APP" --debug > "$LOG" 2>&1 &
          PID=$!
          sleep 8
          FRAME=$(grep -m1 '^FRAME' "$LOG" || true)
          echo "frame: $FRAME"
          set -- $FRAME
          X=$2; Y=$3; W=$4; H=$5
          # shot 名字 [x y w h]：不给范围就拍整块屏幕（缩小），给了就原样拍那一块
          shot() {
            if [ -n "${2:-}" ]; then
              screencapture -x -R"$2,$3,$4,$5" "$RUNNER_TEMP/$1.png" || { echo "screencapture failed"; return 0; }
              sips -s format jpeg -s formatOptions 60 "$RUNNER_TEMP/$1.png" --out "$RUNNER_TEMP/$1.jpg" >/dev/null
            else
              screencapture -x -R"$X,$Y,$W,$H" "$RUNNER_TEMP/$1.png" || { echo "screencapture failed"; return 0; }
              sips -s format jpeg -s formatOptions 50 -Z 1024 "$RUNNER_TEMP/$1.png" --out "$RUNNER_TEMP/$1.jpg" >/dev/null
            fi
            echo "-----BEGIN $1 JPG-----"
            base64 -i "$RUNNER_TEMP/$1.jpg" | fold -w 120
            echo "-----END $1 JPG-----"
          }
          shot live1
          # 可点区域的顺序：小球、金毛、小人、小腊肠、灵动岛
          # 1) 鼠标移到灵动岛上：应该展开
          HOT=$(grep '^HOT' "$LOG" | tail -1 || true)
          ISL=$(echo "$HOT" | awk '{print $NF}')
          if [ -n "$ISL" ]; then
            IX=$(echo "$ISL" | awk -F, '{print $1 + $3/2}'); IY=$(echo "$ISL" | awk -F, '{print $2 + 10}')
            "$RUNNER_TEMP/ci_mouse" "$IX" "$IY" 0 0 hover || true
            sleep 1.2
            shot island "$(echo "$IX" | awk '{print int($1 - 260)}')" "$Y" 520 230
            # 宠物们站的地方：原样拍一张，看清楚画得怎么样
            PETS=$(grep '^HOT' "$LOG" | tail -1 | awk '{print $3}')
            if [ -n "$PETS" ]; then
              PX=$(echo "$PETS" | awk -F, '{v = int($1 - 260); if (v < 0) v = 0; print v}'); PY=$(echo "$PETS" | awk -F, '{v = int($2 - 150); if (v < 0) v = 0; print v}')
              shot pets "$PX" "$PY" 640 330
            fi
          fi
          OK=0
          for attempt in 1 2 3 4 5 6 7 8; do
            HOT=$(grep '^HOT' "$LOG" | tail -1 || true)
            # 前 3 次：单纯点一下金毛（第 2 个区域）；后面：拖球（第 1 个区域）
            if [ "$attempt" -le 3 ]; then TARGET=$(echo "$HOT" | awk '{print $3}'); DX=0; DY=0; else TARGET=$(echo "$HOT" | awk '{print $2}'); DX=-230; DY=-170; fi
            echo "== attempt $attempt target=$TARGET hot: $HOT"
            echo "MARK attempt $attempt" >> "$LOG"
            if [ -z "$TARGET" ]; then sleep 1; continue; fi
            BX=$(echo "$TARGET" | awk -F, '{print $1 + $3/2}')
            BY=$(echo "$TARGET" | awk -F, '{print $2 + $4/2}')
            "$RUNNER_TEMP/ci_mouse" "$BX" "$BY" "$DX" "$DY" || true
            sleep 0.5
            if [ "$attempt" -ge 4 ] && grep -q '^JSDRAG 1' "$LOG"; then OK=1; break; fi
            sleep 1.5
          done
          shot live2
          sleep 2.5
          shot live3
          echo "---- memory / cpu while roaming the whole screen ----"
          ps -axo pid,rss,%cpu,comm | grep -E "QiuQiu|com.apple.WebKit" | grep -v grep | head -8 || true
          echo "---- app log (events) ----"
          grep -E '^(CANVAS|INTERACTIVE|MOUSE|JSDRAG|FRAME|PANEL|GLOBAL|MARK)' "$LOG" | head -90 || true
          kill $PID 2>/dev/null || true
          defaults delete local.qiuqiu.deskpet >/dev/null 2>&1 || true
          if [ "$OK" = "1" ] && grep -q '^MOUSE up' "$LOG"; then echo "MOUSE_DRAG_OK"; else echo "MOUSE_DRAG_NOT_CONFIRMED"; exit 1; fi
