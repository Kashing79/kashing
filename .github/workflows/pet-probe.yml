# 临时的排查用流程：验证 v3 原生方案的几个关键点。验证完会删掉。
name: pet-probe

on:
  push:
    branches: ['claude/**']
    paths: ['pet/dev/ci_probe2.swift', '.github/workflows/pet-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Native feasibility probe
        run: |
          sw_vers | head -2
          if [ -d /Library/Developer/CommandLineTools/usr/bin ]; then
            DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun swiftc -O -target "$(uname -m)-apple-macos11.0" -o "$RUNNER_TEMP/probe_clt" pet/dev/ci_probe2.swift && echo "CLT_BUILD_OK (JavaScriptCore + AppKit, target macOS 11)"
          fi
          xcrun swiftc -O -target "$(uname -m)-apple-macos11.0" -o "$RUNNER_TEMP/probe2" pet/dev/ci_probe2.swift
          xcrun swiftc -O -o "$RUNNER_TEMP/ci_windows" pet/dev/ci_windows.swift
          echo "==== A. as built (linker ad-hoc signature, no entitlements)"
          codesign -d --entitlements - "$RUNNER_TEMP/probe2" 2>&1 | head -5 || true
          "$RUNNER_TEMP/probe2" pet/web/dogs.js belowIcons > "$RUNNER_TEMP/a.log" 2>&1 &
          PID=$!; sleep 9; grep "JSC bench" "$RUNNER_TEMP/a.log" || head -5 "$RUNNER_TEMP/a.log"; kill $PID 2>/dev/null || true; sleep 0.5
          cat > "$RUNNER_TEMP/jit.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/jit.plist"
          plutil -lint "$RUNNER_TEMP/jit.plist"
          echo "==== B. re-signed ad hoc WITH com.apple.security.cs.allow-jit"
          cp "$RUNNER_TEMP/probe2" "$RUNNER_TEMP/probe2_jit"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/jit.plist" "$RUNNER_TEMP/probe2_jit"
          codesign -d --entitlements - "$RUNNER_TEMP/probe2_jit" 2>&1 | head -8 || true
          "$RUNNER_TEMP/probe2_jit" pet/web/dogs.js belowIcons > "$RUNNER_TEMP/b.log" 2>&1 &
          PID=$!; sleep 9; grep "JSC bench" "$RUNNER_TEMP/b.log" || head -5 "$RUNNER_TEMP/b.log"; kill $PID 2>/dev/null || true; sleep 0.5
          echo "==== C. same, plus the hardened runtime"
          cp "$RUNNER_TEMP/probe2" "$RUNNER_TEMP/probe2_hr"
          codesign --force --sign - --options runtime --entitlements "$RUNNER_TEMP/jit.plist" "$RUNNER_TEMP/probe2_hr"
          "$RUNNER_TEMP/probe2_hr" pet/web/dogs.js belowIcons > "$RUNNER_TEMP/c.log" 2>&1 &
          PID=$!; sleep 9; grep "JSC bench" "$RUNNER_TEMP/c.log" || head -5 "$RUNNER_TEMP/c.log"; kill $PID 2>/dev/null || true; sleep 0.5
          echo "==== D. inside an .app bundle, signed like install.sh does but with the entitlement"
          APPD="$RUNNER_TEMP/Probe.app"; mkdir -p "$APPD/Contents/MacOS"
          cp "$RUNNER_TEMP/probe2" "$APPD/Contents/MacOS/Probe"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>local.qiuqiu.probe</string><key>CFBundleExecutable</key><string>Probe</string><key>CFBundlePackageType</key><string>APPL</string><key>LSUIElement</key><true/></dict></plist>\n' > "$APPD/Contents/Info.plist"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/jit.plist" "$APPD"
          "$APPD/Contents/MacOS/Probe" "$PWD/pet/web/dogs.js" belowIcons > "$RUNNER_TEMP/d.log" 2>&1 &
          PID=$!; sleep 9; grep "JSC bench" "$RUNNER_TEMP/d.log" || head -5 "$RUNNER_TEMP/d.log"; kill $PID 2>/dev/null || true
